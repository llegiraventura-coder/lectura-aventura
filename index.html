    function formatReadingCode(num) {
      if (!num || isNaN(num)) return "#CL-00001";
      return `#CL-${String(num).padStart(5, '0')}`;
    }

    function scrollToGlossary(e) {
      if (e) e.preventDefault();
      const target = document.getElementById('glossary-section');

      }

    function normalizeText(str) {
      return (str || '')
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    /* ==========================================================================
       PUJADA DIRECTA AMB COMPRESSIÓ AUTOMÀTICA PER EVITAR EL LÍMIT DE FIRESTORE
       ========================================================================== */
    function uploadImageToFirebase(fileInputElem, targetInputClass, statusSpanId = null) {
      if (!fileInputElem) return;
      const file = fileInputElem.files ? fileInputElem.files[0] : fileInputElem;
      if (!file) return;

      const optionWrapper = fileInputElem.closest('.flex-col') || fileInputElem.closest('.q-block');
      const block = fileInputElem.closest('.q-block');
      
      let statusElem = statusSpanId ? document.getElementById(statusSpanId) : null;
      if (!statusElem && optionWrapper) {
        statusElem = optionWrapper.querySelector('.q-upload-status');
      }
      
      if (statusElem) {
        statusElem.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-indigo-600"></i> Compriment...`;
        statusElem.className = "text-xs text-indigo-600 font-bold flex items-center gap-1";
      }

      const reader = new FileReader();
      
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const MAX_WIDTH = 800;
          const MAX_HEIGHT = 800;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width = Math.round((width * MAX_HEIGHT) / height);
              height = MAX_HEIGHT;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Convertim a JPEG comprimit al 70% de qualitat (~40-90 KB)
          const compressedDataURL = canvas.toDataURL('image/jpeg', 0.7);

          let inputElem = null;
          if (optionWrapper) {
            inputElem = optionWrapper.querySelector('input[type="text"]');
          }
          if (!inputElem && block) {
            inputElem = block.querySelector('.' + targetInputClass);
          }
          if (!inputElem) {
            inputElem = document.getElementById(targetInputClass) || document.querySelector('.' + targetInputClass);
          }

          if (inputElem) {
            inputElem.value = compressedDataURL;
            updateImagePreview(inputElem);
            inputElem.dispatchEvent(new Event('input', { bubbles: true }));
            inputElem.dispatchEvent(new Event('change', { bubbles: true }));
          }

          if (statusElem) {
            statusElem.innerHTML = `<i class="fa-solid fa-check text-emerald-600"></i> Carregada!`;
            statusElem.className = "text-xs text-emerald-600 font-bold flex items-center gap-1";
            setTimeout(() => { if (statusElem) statusElem.innerHTML = ''; }, 3000);
          }
          fileInputElem.value = '';
        };

        img.onerror = function() {
          if (statusElem) {
            statusElem.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-600"></i> Error en la imatge`;
            statusElem.className = "text-xs text-red-600 font-bold flex items-center gap-1";
          }
          fileInputElem.value = '';
        };

        img.src = e.target.result;
      };

      reader.onerror = function(err) {
        if (statusElem) {
          statusElem.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-600"></i> Error`;
          statusElem.className = "text-xs text-red-600 font-bold flex items-center gap-1";
        }
        fileInputElem.value = '';
      };

      reader.readAsDataURL(file);
    }

    function toggleDyslexicFont() {
      isDyslexicMode = !isDyslexicMode;
      const box = document.getElementById('reading-text-box');
      const btn = document.getElementById('btn-dyslexia-toggle');
      if (box) {

        }
      }
    }

    function changeReaderFontSize(delta) {
      readerFontSize = Math.min(Math.max(readerFontSize + delta, 14), 28);
      const box = document.getElementById('reading-text-box');
      if (box) box.style.fontSize = `${readerFontSize}px`;
    }

    function setReaderTheme(theme) {
      readerTheme = theme;
      const box = document.getElementById('reading-text-box');
      if (!box) return;
      box.classList.remove('bg-sepia', 'bg-dark-mode', 'bg-slate-50', 'text-slate-700');
      if (theme === 'sepia') box.classList.add('bg-sepia');
      else if (theme === 'dark') box.classList.add('bg-dark-mode');
      else box.classList.add('bg-slate-50', 'text-slate-700');
    }

    function toggleSpeechSynthesis() {
      if (!('speechSynthesis' in window)) {
        alert("El teu navegador no suporta la síntesi de veu (Web Speech API).");
        return;
      }
      if (isSpeaking && !isSpeechPaused) {
        window.speechSynthesis.pause();
        isSpeechPaused = true;
        updateSpeechUI();
        return;
      }
      if (isSpeaking && isSpeechPaused) {
        window.speechSynthesis.resume();
        isSpeechPaused = false;
        updateSpeechUI();
        return;
      }
      stopSpeechSynthesis();
      const textElem = document.getElementById('reading-text-box');
      if (!textElem) return;

      currentTextToRead = textElem.innerText.trim();
      if (!currentTextToRead) return;

      speechUtterance = new SpeechSynthesisUtterance(currentTextToRead);
      speechUtterance.lang = 'ca-ES';
      speechUtterance.rate = speechRate;

      const voices = window.speechSynthesis.getVoices();
      const caVoice = voices.find(v => v.lang.startsWith('ca'));
      if (caVoice) speechUtterance.voice = caVoice;

      speechUtterance.onstart = () => { isSpeaking = true; isSpeechPaused = false; updateSpeechUI(); };
      speechUtterance.onend = () => { stopSpeechSynthesis(); };
      speechUtterance.onerror = () => { stopSpeechSynthesis(); };

      window.speechSynthesis.speak(speechUtterance);
    }

    function stopSpeechSynthesis() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isSpeaking = false;
      isSpeechPaused = false;
      updateSpeechUI();
    }

    function changeSpeechRate(rate) {
      speechRate = parseFloat(rate);
      if (isSpeaking) { toggleSpeechSynthesis(); toggleSpeechSynthesis(); }
    }

    function updateSpeechUI() {
      const btnPlay = document.getElementById('btn-speech-play');
      const btnStop = document.getElementById('btn-speech-stop');

      if (btnPlay) {
        if (isSpeaking && !isSpeechPaused) {
          btnPlay.innerHTML = `<i class="fa-solid fa-pause text-amber-300"></i> Pausa`;
          btnPlay.className = "px-3 py-1 text-xs font-bold rounded-lg bg-amber-600 text-white border border-amber-700 shadow-xs flex items-center gap-1.5";
        } else if (isSpeaking && isSpeechPaused) {
          btnPlay.innerHTML = `<i class="fa-solid fa-play text-white"></i> Reprendre`;
          btnPlay.className = "px-3 py-1 text-xs font-bold rounded-lg bg-emerald-600 text-white border border-emerald-700 shadow-xs flex items-center gap-1.5";
        } else {
          btnPlay.innerHTML = `<i class="fa-solid fa-volume-high text-indigo-200"></i> Escolta`;
          btnPlay.className = "px-3 py-1 text-xs font-bold rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white border border-indigo-700 shadow-xs flex items-center gap-1.5";
        }
      }
      if (btnStop) {
        if (isSpeaking) btnStop.classList.remove('hidden');
        else btnStop.classList.add('hidden');
      }
    }

    /* ==========================================================================
       MOTOR DE PREGUNTES (SUPORTA 1 IMATGE, MÚLTIPLE IMATGES I OPINIÓ IMATGES)
       ========================================================================== */
    const QuestionEngine = {
      render(qDocId, qData, qIndex, totalQuestions = 0, glossaryWords = []) {
        const type = qData.questionType || 'single';
        const imgMode = qData.imageSelectionMode || 'single';
        const taxonomy = qData.taxonomyType || 'literal';
        const taxConfig = TAXONOMY_CONFIG[taxonomy] || TAXONOMY_CONFIG.literal;
        
        let text = qData.questionText || qData.pregunta || `Pregunta ${qIndex + 1}`;
        text = parseContentWithGlossary(text, glossaryWords);
        const options = (qData.options || qData.opcions || []).filter(o => o !== null && o !== undefined && o !== '');

        let badgeHTML = '';
        if (type === 'multiple') badgeHTML = `<span class="text-[11px] font-bold text-purple-700 bg-purple-100 border border-purple-200 px-2 py-0.5 rounded-md shrink-0">☑️ Opció Múltiple (${options.length} opcions)</span>`;
        else if (type === 'opinion') badgeHTML = `<span class="text-[11px] font-bold text-blue-700 bg-blue-100 border border-blue-200 px-2 py-0.5 rounded-md shrink-0">💬 Reflexió / Opinió</span>`;
        else if (type === 'ordering') badgeHTML = `<span class="text-[11px] font-bold text-amber-800 bg-amber-100 border border-amber-300 px-2 py-0.5 rounded-md shrink-0">↕️ Ordenació (${options.length} fets)</span>`;
        else if (type === 'image_single') {
          const modeLabel = imgMode === 'multiple' ? '☑️ Múltiple' : (imgMode === 'opinion' ? '💬 Opinió' : '');
          badgeHTML = `<span class="text-[11px] font-bold text-teal-800 bg-teal-100 border border-teal-300 px-2 py-0.5 rounded-md shrink-0">🖼️ Imatges ${modeLabel}</span>`;
        }
        else if (type === 'text_input') badgeHTML = `<span class="text-[11px] font-bold text-emerald-800 bg-emerald-100 border border-emerald-300 px-2 py-0.5 rounded-md shrink-0">✍️ Resposta Oberta</span>`;

        const taxBadge = `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-md border inline-flex items-center gap-1 ${taxConfig.color}">
          <i class="fa-solid ${taxConfig.icon}"></i> ${taxConfig.label}
        </span>`;

        let optionsHTML = '';

        if (type === 'text_input') {
          optionsHTML = `
            <div class="bg-emerald-50/50 p-3.5 rounded-xl border border-emerald-200/80 space-y-2">
              <label class="block text-xs font-bold text-emerald-900 flex items-center gap-1.5">
                <i class="fa-solid fa-pen-fancy text-emerald-600"></i> Escriu la teva resposta a continuació:
              </label>
              <textarea name="q_${qDocId}" rows="3" required placeholder="Escriu aquí la teva explicació o resposta..." class="w-full p-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
            </div>
          `;
        } else if (type === 'image_single') {
          const letterLabels = ['A', 'B', 'C', 'D', 'E', 'F'];
          const colsClass = options.length > 4 ? 'grid-cols-1 sm:grid-cols-3' : 'grid-cols-1 sm:grid-cols-2';
          const inputType = imgMode === 'multiple' ? 'checkbox' : 'radio';
          const reqAttr = imgMode === 'multiple' ? '' : 'required';

          optionsHTML = `<div class="grid ${colsClass} gap-3 mt-2">`;
          options.forEach((optImgUrl, oIdx) => {
            const letter = letterLabels[oIdx] || '';
            const imgSrc = optImgUrl.trim() || 'https://via.placeholder.com/300x200?text=Sense+Imatge';
            optionsHTML += `
              <label class="group relative flex flex-col items-center bg-white p-2.5 rounded-xl border-2 border-slate-200 cursor-pointer hover:border-indigo-500 hover:shadow-md transition">
                <div class="absolute top-2 left-2 z-10 flex items-center gap-1.5 bg-slate-900/80 text-white text-xs font-bold px-2 py-1 rounded-lg backdrop-blur-xs">
                  <input type="${inputType}" name="q_${qDocId}" value="${oIdx}" ${reqAttr} class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                  <span>Opció ${letter}</span>
                </div>
                <div class="w-full h-36 overflow-hidden rounded-lg bg-slate-100 flex items-center justify-center">
                  <img src="${imgSrc}" alt="Opció ${letter}" class="w-full h-full object-cover group-hover:scale-105 transition duration-200" onerror="this.src='https://via.placeholder.com/300x200?text=Error+Carregant+Imatge'">
                </div>
              </label>
            `;
          });
          optionsHTML += `</div>`;
        } else if (type === 'ordering') {
          let indexedOptions = options.map((opt, idx) => ({ text: parseContentWithGlossary(opt, glossaryWords), originalIdx: idx }));
          indexedOptions.sort(() => Math.random() - 0.5);

          optionsHTML = `
            <div class="bg-amber-50/50 p-3 rounded-xl border border-amber-200/80 mb-2">
              <p class="text-xs font-bold text-amber-900 mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-up-down-left-right text-amber-600"></i>
                Fes servir les fletxes per ordenar els fets de primer (1r) a últim:
              </p>
              <div id="ordering_list_${qDocId}" class="ordering-container space-y-2">
          `;

          indexedOptions.forEach((optObj, posIdx) => {
            optionsHTML += `
              <div class="ordering-item flex items-center justify-between p-2.5 bg-white rounded-lg border border-slate-200 shadow-xs" data-original-idx="${optObj.originalIdx}">
                <div class="flex items-center space-x-3">
                  <span class="pos-badge w-6 h-6 rounded-md bg-amber-500 text-white font-black text-xs flex items-center justify-center shrink-0">
                    ${posIdx + 1}º
                  </span>
                  <span class="text-sm font-medium text-slate-800">${optObj.text}</span>
                </div>
                <div class="flex items-center space-x-1">
                  <button type="button" onclick="moveOrderItem(this, -1)" class="p-1 px-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded border border-slate-300">▲</button>
                  <button type="button" onclick="moveOrderItem(this, 1)" class="p-1 px-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded border border-slate-300">▼</button>
                </div>
              </div>
            `;
          });

          optionsHTML += `
              </div>
              <input type="hidden" name="q_${qDocId}" id="q_input_${qDocId}" value="${indexedOptions.map(o => o.originalIdx).join(',')}">
            </div>
          `;
        } else {
          const letterLabels = ['A', 'B', 'C', 'D', 'E', 'F'];
          options.forEach((opt, oIdx) => {
            const letterBadge = `<span class="w-5 h-5 rounded bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">${letterLabels[oIdx] || ''}</span>`;
            const optParsed = parseContentWithGlossary(opt, glossaryWords);
            if (type === 'multiple') {
              optionsHTML += `
                <label class="flex items-center space-x-3 p-2.5 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-purple-50/50 transition">

              `;
            } else {
              const hoverColor = type === 'opinion' ? 'hover:bg-blue-50/50' : 'hover:bg-indigo-50/50';
              const radioColor = type === 'opinion' ? 'text-blue-600 focus:ring-blue-500' : 'text-indigo-600 focus:ring-indigo-500';
              
              optionsHTML += `
                <label class="flex items-center space-x-3 p-2.5 bg-white rounded-lg border border-slate-200 cursor-pointer ${hoverColor} transition">
                  <input type="radio" name="q_${qDocId}" value="${oIdx}" required class="w-4 h-4 ${radioColor}">
                  ${letterBadge}
                  <span class="text-sm text-slate-700 font-medium">${optParsed}</span>
                </label>
              `;
            }
          });
        }

        const progressIndicator = totalQuestions > 0 ? `<span class="text-xs text-indigo-600 font-extrabold bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-100">Pregunta ${qIndex + 1} de ${totalQuestions}</span>` : '';

        return `
          <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white font-extrabold text-xs flex items-center justify-center shrink-0 shadow-xs">${qIndex + 1}</span>
                <div class="font-bold text-slate-800 text-sm md:text-base">${text}</div>
              </div>
              <div class="flex items-center gap-1.5 flex-wrap justify-end">${progressIndicator} ${taxBadge} ${badgeHTML}</div>
            </div>
            <div class="space-y-2">${optionsHTML}</div>
          </div>
        `;
      },

      evaluate(qData, qDocId, formData) {
        const type = qData.questionType || 'single';
        const imgMode = qData.imageSelectionMode || 'single';

        if (type === 'text_input') {
          const userText = formData.get(`q_${qDocId}`) || '';
          const normUser = normalizeText(userText);
          if (!normUser) return false;

          let keywords = [];
          if (Array.isArray(qData.keywords)) {
            keywords = qData.keywords;
          } else if (typeof qData.keywords === 'string') {
            keywords = qData.keywords.split(',').map(k => k.trim());
          } else if (qData.correctAnswerText) {
            keywords = [qData.correctAnswerText];
          }

          if (keywords.length === 0) return true;
          return keywords.some(kw => normUser.includes(normalizeText(kw)));
        } else if (type === 'ordering') {
          const val = formData.get(`q_${qDocId}`);
          if (!val) return false;
          const userSequence = val.split(',').map(v => parseInt(v));
          return userSequence.every((v, idx) => v === idx);
        } else if (type === 'opinion' || (type === 'image_single' && imgMode === 'opinion')) {
          const selected = formData.get(`q_${qDocId}`);
          return selected !== null && selected !== undefined;
        } else if (type === 'multiple' || (type === 'image_single' && imgMode === 'multiple')) {
          const selectedVals = formData.getAll(`q_${qDocId}`).map(v => parseInt(v)).sort();
          let correctVals = [];
          if (Array.isArray(qData.correctAnswers)) {
            correctVals = qData.correctAnswers.map(v => parseInt(v)).sort();
          } else if (qData.correctAnswer !== undefined) {
            correctVals = [parseInt(qData.correctAnswer)];
          }
          return selectedVals.length === correctVals.length && selectedVals.every((val, idx) => val === correctVals[idx]);
        } else {
          const selected = parseInt(formData.get(`q_${qDocId}`));
          const correct = qData.correctAnswer !== undefined ? parseInt(qData.correctAnswer) : 0;
          return selected === correct;
        }
      }
    };

    function moveOrderItem(btn, dir) {
      const item = btn.closest('.ordering-item');
      const container = item.parentNode;
      const items = Array.from(container.children);
      const currentIdx = items.indexOf(item);
      const targetIdx = currentIdx + dir;

      if (targetIdx >= 0 && targetIdx < items.length) {
        if (dir === -1) container.insertBefore(item, items[targetIdx]);
        else container.insertBefore(item, items[targetIdx].nextSibling);
        
        const updatedItems = Array.from(container.children);
        updatedItems.forEach((it, idx) => {
          it.querySelector('.pos-badge').innerText = `${idx + 1}º`;
        });
        const hiddenInput = container.parentNode.querySelector('input[type="hidden"]');
        if (hiddenInput) {
          hiddenInput.value = updatedItems.map(it => it.getAttribute('data-original-idx')).join(',');
        }
      }
    }

                if (!isCompleted) continue;
              }
            }

            const matchesSearch = (data.title || '').toLowerCase().includes(filterSearch) || readingCode.toLowerCase().includes(filterSearch);
            const matchesBookAuthor = !filterBookAuthor || (bookAuthorName.toLowerCase().includes(filterBookAuthor));
            const matchesType = filterType === 'all' || (isBook ? 'book' : 'text') === filterType;
            
            let matchesLevel = filterLevel === 'all';
            if (!matchesLevel) {
              if (filterLevel === '1r cicle de primària') matchesLevel = currentLevel === '1r cicle de primària';
              else if (filterLevel === '2n cicle de primària') matchesLevel = currentLevel === '2n cicle de primària';
              else if (filterLevel === '3r cicle de primària') matchesLevel = currentLevel === '3r cicle de primària';
              else matchesLevel = currentLevel === filterLevel;
            }

            const matchesCategory = filterCategory === 'all' || (data.category || 'General') === filterCategory;
            const matchesDuration = filterDuration === 'all' || (data.estimatedTime === filterDuration);
            
            let matchesStatus = true;
            if (filterStatus === 'completed') matchesStatus = isCompleted;
            if (filterStatus === 'pending') matchesStatus = !isCompleted;
            if (filterStatus === 'has_adapted') matchesStatus = hasAnnexAdaptation;
            
            if (!matchesSearch || !matchesBookAuthor || !matchesType || !matchesLevel || !matchesCategory || !matchesDuration || !matchesStatus) continue;

        html += `</div></div>`;

    async function renderEditor(docIdToEdit = null, cloneFromDocId = null, mode = 'questions') {

        renderLogin();
        return;

      const isAdmin = currentUser.email === ADMIN_SUPREMO_EMAIL;

        alert("Accés restringit a Docents i Col·laboradors.");
        renderCatalog();
        return;
      }

      editingDocId = docIdToEdit;
      cloningParentId = cloneFromDocId;
      cloningMode = mode;

      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i><p class="mt-2 text-slate-500 font-medium">Carregant l'editor...</p></div>`;

      let initialData = {
        type: 'text',

        estimatedTime: '10 min',
        bookPages: '',

        content: '',
        imageUrl: '',
        readingNumber: null,
        glossary: [],
        parentReadingId: null,
        isAdaptedVersion: false
      };

      let initialQuestions = [];
      const targetDocId = editingDocId || cloningParentId;

      if (targetDocId) {
        try {
          const docSnap = await db.collection(DB_COLLECTION).doc(targetDocId).get();
          if (docSnap.exists) {
            initialData = docSnap.data();
            
            let qSnap;
            try {
              qSnap = await db.collection(DB_COLLECTION).doc(targetDocId).collection(SUB_COLLECTION).orderBy('orderIndex', 'asc').get();
            } catch (orderErr) {
              qSnap = await db.collection(DB_COLLECTION).doc(targetDocId).collection(SUB_COLLECTION).get();
            }

            if (qSnap.empty) {
              qSnap = await db.collection(DB_COLLECTION).doc(targetDocId).collection(SUB_COLLECTION).get();
            }

            qSnap.forEach(qDoc => { 
              initialQuestions.push({ id: qDoc.id, ...qDoc.data() }); 
            });

            initialQuestions.sort((a, b) => (a.orderIndex !== undefined ? a.orderIndex : 0) - (b.orderIndex !== undefined ? b.orderIndex : 0));
          }
        } catch (err) {
          console.error("Error carregant la lectura per a l'editor:", err);
        }
      }

      if (cloningParentId) {
        // Si clonem des d'una lectura que ja era filla, enllacem a la mare arrel per agrupar totes les versions
        const rootId = initialData.parentReadingId || cloningParentId;

          initialData.title = `${initialData.title.replace(/\s*\(Versió Adaptada.*\)/i, '')} (Versió Adaptada)`;

              </h3>

            </div>
          ` : (cloningParentId ? `
            <div class="bg-amber-50 border border-amber-300 p-4 rounded-2xl mb-4 text-amber-900 text-xs font-semibold shadow-xs">
              <h3 class="font-black text-sm mb-1 flex items-center gap-1.5 text-amber-900">

    function insertGlossaryLink() {
      const textarea = document.getElementById('editor-content');
      if (!textarea) return;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selectedText = textarea.value.substring(start, end) || "paraula";
      const replacement = `[${selectedText}](#glossari-section)`;
      textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
      textarea.focus();
    }

    function addGlossaryField(item = null) {
      const container = document.getElementById('glossary-container');
      if (!container) return;

      const gWord = item ? (item.word || '') : '';
      const gDef = item ? (item.definition || '') : '';

      const div = document.createElement('div');
      div.className = "glossary-item flex items-center gap-2 bg-white p-2 rounded-xl border border-teal-200 shadow-2xs";
      div.innerHTML = `
        <input type="text" value="${gWord}" placeholder="Mot o Concepte" class="g-word w-1/3 p-1.5 border border-slate-300 rounded-lg text-xs font-bold text-teal-900 outline-none">
        <input type="text" value="${gDef}" placeholder="Definició breu i senzilla..." class="g-def w-2/3 p-1.5 border border-slate-300 rounded-lg text-xs outline-none">
        <button type="button" onclick="this.parentNode.remove()" title="Eliminar" class="p-1.5 text-xs text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
      `;
      container.appendChild(div);
    }

    function toggleReadingTypeInputs() {
      const type = document.getElementById('editor-type').value;
      const wrapContent = document.getElementById('wrapper-content');
      const wrapImage = document.getElementById('wrapper-image');
      const wrapDurText = document.getElementById('wrapper-duration-text');
      const wrapDurBook = document.getElementById('wrapper-duration-book');
      const contentInput = document.getElementById('editor-content');
      const labelSource = document.getElementById('label-editorial-source');

      if (type === 'book') {
        wrapContent.classList.add('hidden');
        if (contentInput) contentInput.removeAttribute('required');
        wrapImage.classList.remove('hidden');
        wrapDurText.classList.add('hidden');
        wrapDurBook.classList.remove('hidden');
        if (labelSource) labelSource.innerText = "Editorial / Any d'Edició";
      } else {
        wrapContent.classList.remove('hidden');
        if (contentInput) contentInput.setAttribute('required', 'true');
        wrapImage.classList.add('hidden');
        wrapDurText.classList.remove('hidden');
        wrapDurBook.classList.add('hidden');
        if (labelSource) labelSource.innerText = "Font / Referència Legal o Enllaç";
      }
    }

    function toggleExtraOptions(btn) {
      const block = btn.closest('.q-block');
      const extraBox = block.querySelector('.q-extra-opts-box');
      const choiceEF = block.querySelectorAll('.opt-ef-choice');
      const multiEF = block.querySelectorAll('.opt-ef-multi');
      const isHidden = extraBox.classList.contains('hidden');

      if (isHidden) {
        extraBox.classList.remove('hidden');
        choiceEF.forEach(el => el.classList.remove('hidden'));
        multiEF.forEach(el => el.classList.remove('hidden'));
        btn.innerHTML = `<i class="fa-solid fa-minus"></i> <span>Ocultar opcions E i F</span>`;
      } else {
        extraBox.classList.add('hidden');
        choiceEF.forEach(el => el.classList.add('hidden'));
        multiEF.forEach(el => el.classList.add('hidden'));
        btn.innerHTML = `<i class="fa-solid fa-plus"></i> <span>Afegir opcions E i F (fins a 6)</span>`;
        block.querySelector('.q-opt-4').value = '';
        block.querySelector('.q-opt-5').value = '';
      }
    }

    function updateImagePreview(inputElem) {
      const block = inputElem.closest('.q-block');
      if (!block) return;
      const optMatch = inputElem.className.match(/q-opt-(\d)/);
      if (optMatch && optMatch[1] !== undefined) {
        const optIdx = optMatch[1];
        const img = block.querySelector(`.img-preview-${optIdx}`);
        if (img) img.src = inputElem.value.trim() || `https://via.placeholder.com/100?text=${['A','B','C','D','E','F'][optIdx]}`;
      }
    }

    function removeQuestionField(btn) {
      btn.closest('.q-block').remove();
      updateQuestionIndexes();
    }

    function moveQuestionUp(btn) {
      const currentBlock = btn.closest('.q-block');
      const prevBlock = currentBlock.previousElementSibling;
      if (prevBlock) {
        currentBlock.parentNode.insertBefore(currentBlock, prevBlock);
        updateQuestionIndexes();
      }
    }

    function moveQuestionDown(btn) {
      const currentBlock = btn.closest('.q-block');
      const nextBlock = currentBlock.nextElementSibling;
      if (nextBlock) {
        currentBlock.parentNode.insertBefore(nextBlock, currentBlock);
        updateQuestionIndexes();
      }
    }

    function updateQuestionIndexes() {
      const blocks = document.querySelectorAll('#questions-container .q-block');
      blocks.forEach((block, idx) => {
        const badge = block.querySelector('.q-number-badge');
        const label = block.querySelector('.q-number-label');
        if (badge) badge.innerText = idx + 1;
        if (label) label.innerText = `Pregunta ${idx + 1}`;
      });
      const badge = document.getElementById('question-count-badge');
      if (badge) badge.innerText = blocks.length;
    }

    function toggleQuestionAnswerType(elem) {
      const block = elem.closest('.q-block');
      const mainType = block.querySelector('.q-type-select').value;
      const imgModeSelect = block.querySelector('.q-img-mode-select');
      const imgMode = imgModeSelect ? imgModeSelect.value : 'single';

      const optionsWrapper = block.querySelector('.q-options-wrapper');
      const singleBox = block.querySelector('.q-single-box');
      const singleLabel = block.querySelector('.q-single-label');
      const multiBox = block.querySelector('.q-multiple-box');
      const opinionBox = block.querySelector('.q-opinion-box');
      const orderingBox = block.querySelector('.q-ordering-box');
      const textInputBox = block.querySelector('.q-text-input-box');
      const imagePreviewsBox = block.querySelector('.q-image-previews-box');
      const uploadContainers = block.querySelectorAll('.q-upload-btn-container');
      const badges = block.querySelectorAll('.opt-label-badge');

      optionsWrapper.classList.remove('hidden');
      singleBox.classList.add('hidden');
      multiBox.classList.add('hidden');
      opinionBox.classList.add('hidden');
      orderingBox.classList.add('hidden');
      if (imgModeSelect) imgModeSelect.classList.add('hidden');
      if (textInputBox) textInputBox.classList.add('hidden');
      if (imagePreviewsBox) imagePreviewsBox.classList.add('hidden');

      uploadContainers.forEach(c => c.classList.add('hidden'));

      const isOrdering = mainType === 'ordering';
      const isImage = mainType === 'image_single';
      const isTextInput = mainType === 'text_input';

      if (isTextInput) {
        optionsWrapper.classList.add('hidden');
        if (textInputBox) textInputBox.classList.remove('hidden');
        return;
      }

      badges.forEach((b, idx) => {
        const labelsLetter = ['A', 'B', 'C', 'D', 'E', 'F'];
        const labelsOrder = ['1r', '2n', '3r', '4t', '5è', '6è'];
        b.innerText = isOrdering ? labelsOrder[idx] : labelsLetter[idx];
      });

      for (let i = 0; i < 6; i++) {
        const input = block.querySelector(`.q-opt-${i}`);
        if (input) {
          if (isImage) input.placeholder = `URL o imatge ${['A','B','C','D','E','F'][i]}...`;
          else if (isOrdering) input.placeholder = `${['1r','2n','3r','4t','5è','6è'][i]} fet que passa`;
          else input.placeholder = `Opció ${['A','B','C','D','E','F'][i]}`;
        }
      }

      if (mainType === 'multiple') {
        multiBox.classList.remove('hidden');
      } else if (mainType === 'opinion') {
        opinionBox.classList.remove('hidden');
      } else if (mainType === 'ordering') {
        orderingBox.classList.remove('hidden');
      } else if (isImage) {
        if (imgModeSelect) imgModeSelect.classList.remove('hidden');
        if (imagePreviewsBox) imagePreviewsBox.classList.remove('hidden');
        uploadContainers.forEach(c => c.classList.remove('hidden'));

        if (imgMode === 'multiple') {
          multiBox.classList.remove('hidden');
        } else if (imgMode === 'opinion') {
          opinionBox.classList.remove('hidden');
        } else {
          singleBox.classList.remove('hidden');
          if (singleLabel) singleLabel.innerText = "Quina és la imatge correcta?";
        }
      } else {
        singleBox.classList.remove('hidden');
        if (singleLabel) singleLabel.innerText = "Quina és la resposta correcta?";
      }
    }

    async function saveReading(e) {
      e.preventDefault();
      const type = document.getElementById('editor-type')?.value || 'text';
      const title = document.getElementById('editor-title').value;
      const bookAuthor = document.getElementById('editor-book-author')?.value || '';
      const editorialOrSource = document.getElementById('editor-source')?.value || '';
      const level = document.getElementById('editor-level').value;
      const category = document.getElementById('editor-category')?.value || 'General';
      const estimatedTime = document.getElementById('editor-duration')?.value || '10 min';
      const bookPages = document.getElementById('editor-book-pages')?.value || '';
      const pointsPerQuestion = parseInt(document.getElementById('editor-points-per-q')?.value || 1);
      const content = document.getElementById('editor-content')?.value || '';
      const imageUrl = document.getElementById('editor-image')?.value || '';
      const isAdaptedVersion = document.getElementById('editor-is-adapted')?.value === 'true';

      const glossary = [];
      document.querySelectorAll('#glossary-container .glossary-item').forEach(item => {
        const w = item.querySelector('.g-word')?.value.trim();
        const d = item.querySelector('.g-def')?.value.trim();
        if (w && d) glossary.push({ word: w, definition: d });
      });

      const authorDisplayName = userDisplayName || (currentUser ? currentUser.email.split('@')[0] : "Creador/a");
      const authorSchool = userSchool || "";
      const authorEmail = currentUser ? currentUser.email : "";

      try {
        let docId = editingDocId;

        if (editingDocId) {
          await db.collection(DB_COLLECTION).doc(editingDocId).update({
            type: type,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            estimatedTime: estimatedTime,
            bookPages: bookPages,
            pointsPerQuestion: pointsPerQuestion,
            content: content,
            imageUrl: imageUrl,
            glossary: glossary,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          const oldQ = await db.collection(DB_COLLECTION).doc(editingDocId).collection(SUB_COLLECTION).get();
          for (const qDoc of oldQ.docs) {
            await qDoc.ref.delete();
          }
        } else {
          if (currentUser && (userRole === 'docent' || userRole === 'colaborador')) {
            userPoints += 1;
            await db.collection("users").doc(currentUser.uid).set({ points: userPoints }, { merge: true });
          }

          const countSnap = await db.collection(DB_COLLECTION).get();
          const nextNum = countSnap.size + 1;

          const docRef = await db.collection(DB_COLLECTION).add({
            type: type,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            estimatedTime: estimatedTime,
            bookPages: bookPages,
            pointsPerQuestion: pointsPerQuestion,
            content: content,
            imageUrl: imageUrl,
            readingNumber: nextNum,
            glossary: glossary,
            parentReadingId: cloningParentId || null,
            isAdaptedVersion: isAdaptedVersion,
            authorUid: currentUser ? currentUser.uid : null,
            authorDisplayName: authorDisplayName,
            authorSchool: authorSchool,
            authorEmail: authorEmail,
            authorPoints: userPoints,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          docId = docRef.id;
        }

        const qBlocks = document.querySelectorAll('.q-block');
        let orderIndex = 0;

        for (const block of qBlocks) {
          const qText = block.querySelector('.q-text').value;
          const qType = block.querySelector('.q-type-select')?.value || 'single';
          const imgMode = block.querySelector('.q-img-mode-select')?.value || 'single';
          const taxonomyType = block.querySelector('.q-taxonomy-select')?.value || 'literal';

          if (qType === 'text_input') {
            const rawKw = block.querySelector('.q-keywords-input')?.value || '';
            const keywordsArr = rawKw.split(',').map(k => k.trim()).filter(k => k.length > 0);

            if (qText) {
              await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add({
                questionText: qText,
                options: [],
                questionType: 'text_input',
                taxonomyType: taxonomyType,
                keywords: keywordsArr,
                orderIndex: orderIndex
              });
              orderIndex++;
            }
          } else {
            const options = [];
            for (let i = 0; i < 6; i++) {
              const optVal = block.querySelector(`.q-opt-${i}`)?.value || '';
              if (optVal.trim()) options.push(optVal.trim());
            }

            if (qText && options.length >= 2) {
              const baseQData = {
                questionText: qText,
                options: options,
                questionType: qType,
                imageSelectionMode: imgMode,
                taxonomyType: taxonomyType,
                orderIndex: orderIndex
              };

              if (qType === 'opinion' || qType === 'ordering' || (qType === 'image_single' && imgMode === 'opinion')) {
                await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add(baseQData);
              } else if (qType === 'multiple' || (qType === 'image_single' && imgMode === 'multiple')) {
                const multiCheckboxes = block.querySelectorAll('.q-correct-multi:checked');
                const correctAnswers = Array.from(multiCheckboxes).map(cb => parseInt(cb.value));

                await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add({
                  ...baseQData,
                  correctAnswers: correctAnswers.length > 0 ? correctAnswers : [0]
                });
              } else {
                const correctSelect = block.querySelector('.q-correct-single');
                const correctIdx = correctSelect ? parseInt(correctSelect.value) : 0;

                await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add({
                  ...baseQData,
                  correctAnswer: correctIdx
                });
              }
              orderIndex++;
            }
          }
        }

        editingDocId = null;
        cloningParentId = null;
        cloningMode = 'questions';
        await loadUserData();
        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error en desar la lectura: " + err.message);
      }
    }

    function parseContentWithGlossary(rawText, glossaryList = []) {
      if (!rawText) return '';
      let processed = rawText;
      processed = processed.replace(/\[([^\]]+)\]\(#glossari-section\)/g, function(match, word) {
        return `<a href="#glossari-section" onclick="scrollToGlossary(event)" class="text-indigo-600 font-bold border-b-2 border-indigo-400 hover:text-indigo-800 transition" title="Consultar glossari">${word}</a>`;
      });
      if (Array.isArray(glossaryList) && glossaryList.length > 0) {
        glossaryList.forEach(g => {
          if (g.word && g.word.trim()) {
            const wordToFind = g.word.trim();
            const regex = new RegExp(`\\b(${wordToFind})\\b(?![^<]*>|[^[]*])`, 'gi');
            processed = processed.replace(regex, `<a href="#glossari-section" onclick="scrollToGlossary(event)" class="text-indigo-600 font-bold border-b-2 border-indigo-400 hover:text-indigo-800 transition" title="Consultar '${wordToFind}' al Glossari">$1</a>`);
          }
        });
      }
      return processed;
    }

    async function renderReader(docId) {
      stopSpeechSynthesis();
      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i><p class="mt-2 text-slate-500 font-medium">Carregant la lectura assignada...</p></div>`;

      try {
        const doc = await db.collection(DB_COLLECTION).doc(docId).get();
        if (!doc.exists) {
          app.innerHTML = `
            <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
              <i class="fa-solid fa-file-circle-xmark text-4xl text-red-400"></i>
              <h2 class="text-xl font-bold text-slate-800">Lectura no trobada</h2>
              <p class="text-sm text-slate-600">L'enllaç utilitzat és incorrecte o la lectura s'ha eliminat.</p>
              <button onclick="resetFiltersAndRenderCatalog()" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-xl text-sm">Anar al Catàleg General</button>
            </div>
          `;
          return;
        }

        const data = doc.data() || {};
        const isBook = data.type === 'book';

        const totalDocsInDb = (await db.collection(DB_COLLECTION).get()).size;
        const readingNum = data.readingNumber || totalDocsInDb;
        const readingCode = formatReadingCode(readingNum);
        const glossaryList = Array.isArray(data.glossary) ? data.glossary : [];

        const rootParentId = data.parentReadingId || docId;
        
        let parentDocData = null;
        if (data.parentReadingId) {
          const parentSnap = await db.collection(DB_COLLECTION).doc(data.parentReadingId).get();
          if (parentSnap.exists) {
            parentDocData = { id: parentSnap.id, ...parentSnap.data() };
          }
        } else {
          parentDocData = { id: docId, ...data };
        }

        const variantsSnap = await db.collection(DB_COLLECTION).where('parentReadingId', '==', rootParentId).get();
        let allVariants = [];
        variantsSnap.forEach(vDoc => {
          allVariants.push({ id: vDoc.id, ...vDoc.data() });
        });

        // Separem versions adaptades (text simplificat DUA) de bateries de preguntes pures
        const adaptedTextVariants = allVariants.filter(v => !!v.isAdaptedVersion);
        const questionBatteryVariants = allVariants.filter(v => !v.isAdaptedVersion);

        const hasAdaptedTextTabs = parentDocData && adaptedTextVariants.length > 0;
        const hasBatteryOptions = parentDocData && questionBatteryVariants.length > 0;

        let questionsSnap = { empty: true, size: 0, forEach: () => {} };
        try {
          questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).orderBy('orderIndex', 'asc').get();
        } catch (qErr) {
          try {
            questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
          } catch (e) {
            console.warn("No s'han pogut carregar les preguntes de Firestore:", e);
          }
        }

        const totalAllSnapReader = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
        if (questionsSnap.size < totalAllSnapReader.size) questionsSnap = totalAllSnapReader;

    async function submitQuiz(e, docId, pointsPerQuestion = 1) {
      e.preventDefault();
      if (!currentUser) { renderLogin(); return; }

      const form = e.target;
      const formData = new FormData(form);

      let questionsSnap;
      try {
        questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).orderBy('orderIndex', 'asc').get();
      } catch (e) {
        questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
      }

      const totalAllSnapSubmit = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
      if (questionsSnap.size < totalAllSnapSubmit.size) questionsSnap = totalAllSnapSubmit;

      let score = 0;
      let total = questionsSnap.size;

      const stats = {
        literal: { correct: 0, total: 0 },
        inferential: { correct: 0, total: 0 },
        figurative: { correct: 0, total: 0 },
        opinion: { correct: 0, total: 0 },
        creative: { correct: 0, total: 0 }
      };

      questionsSnap.forEach(qDoc => {
        const q = qDoc.data() || {};
        const taxKey = q.taxonomyType || 'literal';
        if (!stats[taxKey]) stats[taxKey] = { correct: 0, total: 0 };
        stats[taxKey].total++;
        if (QuestionEngine.evaluate(q, qDoc.id, formData)) {
          score++;
          stats[taxKey].correct++;
        }
      });

      const newQuizPoints = score * pointsPerQuestion;
      const maxPossiblePoints = total * pointsPerQuestion;

      let userScores = {};
      try {
        const userDoc = await db.collection("users").doc(currentUser.uid).get();
        if (userDoc.exists) userScores = userDoc.data().scores || {};
      } catch (err) {
        console.warn("Error llegint puntuacions anteriors:", err);
      }

      const previousQuizPoints = userScores[docId] || 0;
      let pointsToAdd = 0;

      if (newQuizPoints > previousQuizPoints) {
        pointsToAdd = newQuizPoints - previousQuizPoints;
        userScores[docId] = newQuizPoints;
        userPoints += pointsToAdd;
      }

      if (!userCompletedReadings.includes(docId)) userCompletedReadings.push(docId);

      try {
        await db.collection("users").doc(currentUser.uid).set({
          points: userPoints,
          completedReadings: userCompletedReadings,
          scores: userScores
        }, { merge: true });
      } catch (err) {
        console.warn("Dades desades localment:", err);
      }

      await loadUserData();

    function renderFeedbackModal(score, total, newQuizPoints, maxPossiblePoints, pointsToAdd, stats) {
      const container = document.getElementById('feedback-modal-container');
      if (!container) return;

      let breakdownRows = '';
      Object.keys(stats).forEach(taxKey => {
        const item = stats[taxKey];
        if (item.total > 0) {
          const cfg = TAXONOMY_CONFIG[taxKey] || TAXONOMY_CONFIG.literal;
          const pct = Math.round((item.correct / item.total) * 100);
          
          breakdownRows += `
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">

                <span class="text-xs text-slate-500 hidden sm:inline">${cfg.desc}</span>
              </div>
              <div class="text-right">
                <span class="text-sm font-black text-slate-800">${item.correct} / ${item.total}</span>
                <span class="text-xs font-bold ml-1.5 ${pct >= 70 ? 'text-emerald-600' : (pct >= 50 ? 'text-amber-600' : 'text-slate-500')}">(${pct}%)</span>
              </div>

      container.innerHTML = `

      const submitBtn = document.getElementById('auth-submit-btn');

      if (mode === 'register') {
        extra.classList.remove('hidden');
        btnReg.className = "w-1/2 py-2 rounded-lg bg-white text-indigo-700 shadow-xs";
        btnLogin.className = "w-1/2 py-2 rounded-lg text-slate-600";
        submitBtn.innerText = "Registrar-me i Començar";
      } else {
        extra.classList.add('hidden');
        btnLogin.className = "w-1/2 py-2 rounded-lg bg-white text-indigo-700 shadow-xs";
        btnReg.className = "w-1/2 py-2 rounded-lg text-slate-600";
        submitBtn.innerText = "Entrar";
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const mode = document.getElementById('auth-mode').value;
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        if (mode === 'register') {
          const name = document.getElementById('auth-name').value || email.split('@')[0];
          const role = document.getElementById('auth-role').value || 'alumne';
          const school = document.getElementById('auth-school').value || '';

          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection("users").doc(cred.user.uid).set({
            email: email,
            displayName: name,
            role: role,
            school: school,
            points: 0,
            completedReadings: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        document.getElementById('auth-modal-container').innerHTML = '';
      } catch (err) {
        alert("Error d'autenticació: " + err.message);
      }
    }

    function renderUserProfileModal() {
      if (!currentUser) return;
      const container = document.getElementById('profile-modal-container');

      container.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white p-6 rounded-2xl max-w-md w-full space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
              <h3 class="text-lg font-bold text-slate-800">El meu Perfil de Lectura</h3>
              <button onclick="container.innerHTML=''" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveUserProfile(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nom / Pseudònim *</label>
                <input type="text" id="profile-display-name" value="${userDisplayName}" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Escola / Centre Educatiu</label>
                <input type="text" id="profile-school" value="${userSchool}" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
              </div>
              ${userRole === 'alumne' ? `
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Codi de Mestre/a (UID Docent)</label>
                  <input type="text" id="profile-teacher-uid" value="${userTeacherUid}" placeholder="Enganxa el codi del teu mestre" class="w-full p-2 border border-slate-300 rounded-lg text-sm font-mono">
                </div>
              ` : ''}
              <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-sm">Desar dades de perfil</button>
            </form>
          </div>
        </div>
      `;
    }

    async function saveUserProfile(e) {
      e.preventDefault();
      const name = document.getElementById('profile-display-name').value;
      const school = document.getElementById('profile-school').value;
      const teacherUid = document.getElementById('profile-teacher-uid')?.value || '';

      try {
        await db.collection("users").doc(currentUser.uid).set({
          displayName: name,
          school: school,
          teacherUid: teacherUid
        }, { merge: true });

        document.getElementById('profile-modal-container').innerHTML = '';
        await loadUserData();
        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error desant el perfil: " + err.message);
      }
    }

    function shareFolderLink(folderId) {
      const shareUrl = `${window.location.href.split('?')[0]}?carpeta=${folderId}`;
      prompt("Copia aquest enllaç directe a la carpeta:", shareUrl);
    }

    function shareToGoogleClassroom(docId, title) {
      const baseUrl = window.location.href.split('?')[0];
      const targetUrl = encodeURIComponent(`${baseUrl}?lectura=${docId}`);
      const encodedTitle = encodeURIComponent(`Lectura Aventura: ${title}`);
      const classroomUrl = `https://classroom.google.com/u/0/share?url=${targetUrl}&title=${encodedTitle}`;
      window.open(classroomUrl, '_blank', 'width=650,height=550');
    }

    function resetFiltersAndRenderCatalog() {
      stopSpeechSynthesis();
      if (window.location.search) {
        window.history.pushState({}, document.title, window.location.pathname);
      }
      filterSearch = "";
      filterBookAuthor = "";
      filterType = "all";
      filterLevel = "all";
      filterCategory = "all";
      filterStatus = "all";
      filterDuration = "all";
      filterMyLectures = false;
      renderNav();
      renderCatalog();
    }

    function applyCatalogFilters() {
      filterSearch = document.getElementById('search-input')?.value.toLowerCase() || '';
      filterBookAuthor = document.getElementById('author-search-input')?.value.toLowerCase() || '';
      filterType = document.getElementById('type-select')?.value || 'all';
      filterLevel = document.getElementById('level-select')?.value || 'all';
      filterCategory = document.getElementById('category-select')?.value || 'all';
      filterStatus = document.getElementById('status-select')?.value || 'all';
      filterDuration = document.getElementById('duration-select')?.value || 'all';
      renderCatalog();
    }

    function toggleMyLectures() {
      filterMyLectures = !filterMyLectures;
      renderNav();
      renderCatalog();
    }

    function logout() {
      stopSpeechSynthesis();
      auth.signOut().then(() => renderCatalog());
    }

    function shareReadingLink(docId, titleOrCode) {
      const baseUrl = window.location.href.split('?')[0];
      const shareUrl = `${baseUrl}?lectura=${docId}`;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert(`🔗 Enllaç copiat al porta-retalls (${titleOrCode})!\n\n${shareUrl}`);
        }).catch(() => { prompt("Copia aquest enllaç:", shareUrl); });
      } else {
        prompt("Copia aquest enllaç:", shareUrl);
      }
    }
