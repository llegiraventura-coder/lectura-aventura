<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Aventura</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase JS SDK v9 (Compat version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- NAVEGACIÓ SUPERIOR -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="renderCatalog()">
        <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
        <span class="font-bold text-xl tracking-wide">Lectura Aventura</span>
      </div>
      <nav id="nav-actions" class="flex items-center space-x-3">
        <!-- Renderitzat dinàmic -->
      </nav>
    </div>
  </header>
<!-- NAVEGACIÓ SUPERIOR -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="renderCatalog()">
        <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
        <span class="font-bold text-xl tracking-wide">Lectura Aventura</span>
      </div>
      <nav id="nav-actions" class="flex items-center space-x-3">
        <!-- Renderitzat dinàmic -->
      </nav>
    </div>
  </header>

  <!-- BARRA MOTIVADORA PERMANENT PER A ALUMNES -->
  <div id="motivation-banner"></div>

  <!-- CONTENIDOR PRINCIPAL -->
  <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6">
    <!-- Vistes dinàmiques -->
  </main>
  <!-- CONTENIDOR PRINCIPAL -->
  <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6">
    <!-- Vistes dinàmiques -->
  </main>

  <footer class="bg-slate-800 text-slate-400 text-center py-4 text-sm mt-auto">
    <p>&copy; Lectura Aventura — Plataforma Educativa de Comprensió Lectora</p>
  </footer>

  <script>
    // --- CONFIGURACIÓ DE FIREBASE REALS ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcBpg9FRwYDElWoZlYsGir4ZA_HqS0BDc",
      authDomain: "lectura-aventura.firebaseapp.com",
      projectId: "lectura-aventura",
      storageBucket: "lectura-aventura.firebasestorage.app",
      messagingSenderId: "525339295825",
      appId: "1:525339295825:web:3a5b3ea8791f6146d4b870",
      measurementId: "G-7132LXLDTR"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DB_COLLECTION = "lectures";
    const SUB_COLLECTION = "questions";
    let currentUser = null;
    let userPoints = 0;
    let userRole = 'alumne'; // Rol per defecte ("mestre" o "alumne")
    let filterMyLectures = false;

    // --- MANEGADOR D'AUTENTICACIÓ I NAVEGACIÓ ---
    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (user) {
        await loadUserPoints();
      } else {
        userPoints = 0;
        userRole = 'alumne';
        filterMyLectures = false;
      }
      renderNav();
      renderCatalog();
    });

    async function loadUserPoints() {
      if (!currentUser) return;
      try {
        const doc = await db.collection("users").doc(currentUser.uid).get();
        if (doc.exists) {
          const data = doc.data();
          userPoints = data.points !== undefined ? data.points : 0;
          userRole = data.role || 'alumne';
        } else {
          userPoints = 0;
          userRole = 'alumne';
        }
      } catch (err) {
        console.warn("No s'han pogut carregar les dades de l'usuari de Firestore:", err);
      }
    }

    function getRankDetails(points) {
      if (points >= 100) {
        return { name: "Mestre/a de la Lectura", icon: "fa-crown", color: "from-amber-400 to-amber-600", text: "text-amber-300" };
      } else if (points >= 50) {
        return { name: "Lector/a d'Argent", icon: "fa-medal", color: "from-slate-400 to-slate-600", text: "text-slate-200" };
      }
      return { name: "Explorador/a de Històries", icon: "fa-compass", color: "from-indigo-500 to-indigo-700", text: "text-indigo-200" };
    }
function getRankDetails(points) {
      if (points >= 100) {
        return { name: "Mestre/a de la Lectura", icon: "fa-crown", color: "from-amber-400 to-amber-600", text: "text-amber-300" };
      } else if (points >= 50) {
        return { name: "Lector/a d'Argent", icon: "fa-medal", color: "from-slate-400 to-slate-600", text: "text-slate-200" };
      }
      return { name: "Explorador/a de Històries", icon: "fa-compass", color: "from-indigo-500 to-indigo-700", text: "text-indigo-200" };
    }

    // --- NOVA FUNCIÓ PER AL BANNER MOTIVADOR ---
    function renderBanner() {
      const bannerContainer = document.getElementById('motivation-banner');
      if (!bannerContainer) return;

      if (currentUser && userRole !== 'mestre') {
        const rank = getRankDetails(userPoints);
        
        let nextRankPoints = 50;
        let nextRankName = "Lector/a d'Argent";
        if (userPoints >= 50 && userPoints < 100) {
          nextRankPoints = 100;
          nextRankName = "Mestre/a de la Lectura";
        } else if (userPoints >= 100) {
          nextRankPoints = userPoints;
        }

        const pointsNeeded = nextRankPoints - userPoints;

        bannerContainer.innerHTML = `
          <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-indigo-900 text-white border-b border-indigo-700/50 shadow-inner py-3 px-4">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3 text-center md:text-left">
              
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr ${rank.color} text-white flex items-center justify-center text-lg shadow-md border border-white/20">
                  <i class="fa-solid ${rank.icon}"></i>
                </div>
                <div>
                  <h2 class="text-sm md:text-base font-extrabold text-white tracking-wide">
                    Hola, <span class="text-amber-300">${currentUser.email.split('@')[0]}</span>!
                  </h2>
                  <p class="text-xs text-indigo-200">
                    Rang actual: <span class="font-bold text-amber-300">${rank.name}</span>
                  </p>
                </div>
              </div>

              <div class="flex items-center space-x-4 bg-indigo-950/60 px-4 py-1.5 rounded-xl border border-indigo-500/30">
                <div class="text-right">
                  <span class="block text-xs font-semibold text-indigo-200">Total acumulat</span>
                  <span class="text-base font-black text-amber-400">${userPoints} PTS</span>
                </div>
                <div class="h-7 w-px bg-indigo-700/60"></div>
                <div class="text-left">
                  <span class="block text-xs font-semibold text-indigo-200">Següent objectiu</span>
                  <span class="text-xs font-bold text-slate-200">
                    ${userPoints >= 100 ? '🌟 Nivell Màxim Assolit!' : `+${pointsNeeded} pts per ${nextRankName}`}
                  </span>
                </div>
              </div>

            </div>
          </div>
        `;
      } else {
        bannerContainer.innerHTML = '';
      }
    }
    function renderNav() {
      const nav = document.getElementById('nav-actions');
      if (currentUser) {
        const rank = getRankDetails(userPoints);
        const isTeacher = userRole === 'mestre';

        nav.innerHTML = `
          <button onclick="toggleMyLectures()" class="${filterMyLectures ? 'bg-amber-300 text-slate-900' : 'bg-indigo-700 hover:bg-indigo-800 text-white'} font-semibold px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-bookmark"></i>
            <span class="hidden sm:inline">${filterMyLectures ? 'Totes les lectures' : 'Les meves lectures'}</span>
          </button>

          ${isTeacher ? `
            <button onclick="renderEditor()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3.5 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-md transform hover:scale-105">
              <i class="fa-solid fa-plus text-base"></i>
              <span>Nova Lectura</span>
            </button>
          ` : ''}

          <!-- BLOC VISUAL / GAMIFICACIÓ USUARI -->
          <div class="flex items-center bg-indigo-800/80 backdrop-blur-sm px-3 py-1.5 rounded-xl border border-indigo-500/30 space-x-3 shadow-inner">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr ${isTeacher ? 'from-amber-400 to-amber-200 text-slate-900' : rank.color + ' text-white'} flex items-center justify-center text-sm shadow">
              <i class="fa-solid ${isTeacher ? 'fa-chalkboard-user' : rank.icon}"></i>
            </div>
            
            <div class="flex flex-col text-left">
              <div class="flex items-center space-x-1.5">
                <span class="text-xs font-bold text-white tracking-wide">${currentUser.email.split('@')[0]}</span>
                ${!isTeacher ? `<span class="bg-amber-400/20 text-amber-300 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md border border-amber-400/30">${userPoints} pts</span>` : ''}
              </div>
              <span class="text-[11px] ${isTeacher ? 'text-amber-300 font-bold' : rank.text} font-medium leading-none mt-0.5">
                ${isTeacher ? '👨‍🏫 Mestre/a' : rank.name}
              </span>
            </div>

            <button onclick="logout()" title="Tancar Sessió" class="text-indigo-300 hover:text-white hover:bg-indigo-700/50 p-1.5 rounded-lg transition ml-1">
              <i class="fa-solid fa-right-from-bracket text-sm"></i>
            </button>
          </div>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="renderLogin()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow">
            Inicia Sessió
          </button>
        `;
      }
    }

    function toggleMyLectures() {
      filterMyLectures = !filterMyLectures;
      renderNav();
      renderCatalog();
    }

    function logout() {
      auth.signOut().then(() => renderCatalog());
    }

    // --- VISTA 1: CATÀLEG DE LECTURES (PÀGINA PRINCIPAL) ---
    async function renderCatalog() {
      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i><p class="mt-2 text-slate-500 font-medium">Carregant el catàleg...</p></div>`;

      try {
        const snapshot = await db.collection(DB_COLLECTION).orderBy('createdAt', 'desc').get();
        
        let html = `
          <div class="max-w-6xl mx-auto space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <div>
                <h1 class="text-2xl font-extrabold text-slate-800">Catàleg de Lectures</h1>
                <p class="text-slate-500 text-sm">Explora les lectures i llibres disponibles per als alumnes.</p>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        `;

        if (snapshot.empty) {
          html += `
            <div class="col-span-full bg-white p-8 rounded-2xl border border-slate-200 text-center">
              <i class="fa-solid fa-book-open text-4xl text-slate-300 mb-3"></i>
              <p class="text-slate-600 font-bold">Encara no hi ha cap lectura publicada.</p>
            </div>
          `;
        } else {
          snapshot.forEach(doc => {
            const data = doc.data();
            const isBook = data.type === 'book';

            html += `
              <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between">
                <div class="p-5">
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isBook ? 'bg-purple-100 text-purple-800' : 'bg-indigo-100 text-indigo-800'}">
                      ${isBook ? '📖 Llibre' : '📄 Text Integrat'}
                    </span>
                    ${data.level ? `<span class="text-xs text-slate-500 font-medium">${data.level}</span>` : ''}
                  </div>

                  ${isBook && data.imageUrl ? `
                    <div class="w-full h-40 mb-3 overflow-hidden rounded-xl bg-slate-100">
                      <img src="${data.imageUrl}" alt="${data.title}" class="w-full h-full object-cover">
                    </div>
                  ` : ''}

                  <h3 class="font-bold text-slate-800 text-lg mb-2 line-clamp-2">${data.title || 'Sense títol'}</h3>
                  
                  ${!isBook && data.content ? `
                    <p class="text-slate-600 text-sm line-clamp-3 mb-4">${data.content}</p>
                  ` : ''}
                </div>

                <div class="p-5 pt-0 mt-auto">
                  <button onclick="renderReader('${doc.id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-book-open"></i>
                    <span>${isBook ? 'Anar al Qüestionari' : 'Llegir i Respondre'}</span>
                  </button>
                </div>
              </div>
            `;
          });
        }

        html += `</div></div>`;
        app.innerHTML = html;
      } catch (err) {
        console.error("Error carregant el catàleg:", err);
        app.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg max-w-2xl mx-auto">Error en carregar el catàleg: ${err.message}</div>`;
      }
    }

    // --- VISTA 2: LECTOR INTERACTIU (TEXT VS LLIBRE) ---
    async function renderReader(docId) {
      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600"></i></div>`;

      try {
        const doc = await db.collection(DB_COLLECTION).doc(docId).get();
        if (!doc.exists) {
          app.innerHTML = `<p class="text-red-500">Lectura no trobada.</p>`;
          return;
        }
        const data = doc.data();
        const isBook = data.type === 'book';

        const questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
        
        let questionsHTML = '';
        if (!questionsSnap.empty) {
          questionsHTML = `
            <form id="quiz-form" onsubmit="submitQuiz(event, '${docId}')" class="mt-8 pt-6 border-t border-slate-200">
              <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa-solid fa-list-check text-indigo-600 mr-2"></i> Preguntes de Comprensió
              </h2>
          `;

          let qIndex = 0;
          questionsSnap.forEach(qDoc => {
            const q = qDoc.data();
            const options = q.options || q.opcions || q.respostes || [];
            const questionText = q.questionText || q.pregunta || q.text || `Pregunta ${qIndex + 1}`;

            questionsHTML += `
              <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="font-semibold text-slate-800 mb-3">${qIndex + 1}. ${questionText}</p>
                <div class="space-y-2">
            `;

            options.forEach((opt, oIdx) => {
              questionsHTML += `
                <label class="flex items-center space-x-3 p-2.5 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/50 transition">
                  <input type="radio" name="q_${qDoc.id}" value="${oIdx}" required class="text-indigo-600 focus:ring-indigo-500">
                  <span class="text-sm text-slate-700">${opt}</span>
                </label>
              `;
            });

            questionsHTML += `</div></div>`;
            qIndex++;
          });

          questionsHTML += `
              <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">
                Enviar respostes i obtenir punts
              </button>
            </form>
          `;
        } else {
          questionsHTML = `
            <div class="mt-6 p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm">
              <i class="fa-solid fa-circle-info mr-1"></i> No s'han trobat preguntes enregistrades a la subcol·lecció d'aquesta lectura.
            </div>
          `;
        }

        let headerContentHTML = '';
        if (isBook) {
          headerContentHTML = `
            <div class="flex flex-col md:flex-row gap-6 items-center bg-indigo-50/50 p-5 rounded-2xl border border-indigo-100 mb-6">
              ${data.imageUrl ? `
                <img src="${data.imageUrl}" alt="${data.title}" class="w-32 h-44 object-cover rounded-xl shadow-md border border-slate-200">
              ` : `
                <div class="w-32 h-44 bg-indigo-100 rounded-xl flex items-center justify-center text-indigo-400">
                  <i class="fa-solid fa-book text-4xl"></i>
                </div>
              `}
              <div>
                <span class="text-xs font-bold px-2.5 py-1 bg-purple-100 text-purple-800 rounded-full inline-block mb-2">Qüestionari de Llibre</span>
                <h2 class="text-lg font-bold text-slate-800">${data.title}</h2>
                <p class="text-sm text-slate-600 mt-1">Respon a les següents preguntes sobre la lectura que has realitzat en paper.</p>
              </div>
            </div>
          `;
        } else {
          headerContentHTML = `
            <div class="prose max-w-none text-slate-700 leading-relaxed text-lg whitespace-pre-line mb-6">
              ${data.content}
            </div>
          `;
        }

        app.innerHTML = `
          <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
            <button onclick="renderCatalog()" class="text-slate-500 hover:text-slate-800 text-sm font-medium mb-4 inline-flex items-center">
              <i class="fa-solid fa-arrow-left mr-1"></i> Tornar al catàleg
            </button>
            <h1 class="text-3xl font-bold text-slate-900 mb-4">${data.title}</h1>
            ${headerContentHTML}
            ${questionsHTML}
            <div id="quiz-result" class="mt-6 hidden"></div>
          </div>
        `;
      } catch (err) {
        console.error("Error carregant la lectura:", err);
        app.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg">Error carregar lectura: ${err.message}</div>`;
      }
    }

    async function submitQuiz(e, docId) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);

      const questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
      let score = 0;
      let total = questionsSnap.size;

      questionsSnap.forEach(qDoc => {
        const q = qDoc.data();
        const selected = parseInt(formData.get(`q_${qDoc.id}`));
        const correct = q.correctAnswer !== undefined ? q.correctAnswer : 0;
        if (selected === correct) {
          score++;
        }
      });

      const points = score * 10;
      userPoints += points;

      if (currentUser) {
        try {
          await db.collection("users").doc(currentUser.uid).set({
            points: userPoints,
            email: currentUser.email
          }, { merge: true });
        } catch (err) {
          console.warn("S'han desat els punts localment per aquesta sessió:", err);
        }
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;

      const resultDiv = document.getElementById('quiz-result');
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `
        <div class="p-6 bg-emerald-50 border border-emerald-300 text-emerald-900 rounded-2xl text-center shadow-sm">
          <i class="fa-solid fa-award text-4xl text-amber-500 mb-2"></i>
          <h3 class="font-bold text-xl mb-1">Resultat: Has encertat ${score} de ${total} preguntes!</h3>
          <p class="text-base font-semibold text-emerald-700 mb-4">Punts aconseguits: +${points} punts</p>
          <button onclick="renderCatalog()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl shadow transition text-sm inline-flex items-center gap-2">
            <span>Veure el meu rang i punts al catàleg</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      `;

      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    // --- VISTA 3: EDITOR AMB OPCIÓ DE TIPUS (TEXT VS LLIBRE) ---
    function renderEditor() {
      if (!currentUser) {
        renderLogin();
        return;
      }

      if (userRole !== 'mestre') {
        alert("Accés restringit: Només els usuaris amb rol de Mestre/a poden crear noves lectures.");
        renderCatalog();
        return;
      }

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
          <h1 class="text-2xl font-bold text-slate-800 mb-6 flex items-center">
            <i class="fa-solid fa-pen-to-square text-indigo-600 mr-2"></i> Crear Nova Lectura
          </h1>
          <form onsubmit="saveReading(event)" class="space-y-5">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1">Tipus de Lectura *</label>
              <select id="editor-type" onchange="toggleReadingTypeInputs()" class="w-full p-2.5 border border-indigo-300 bg-indigo-50/50 rounded-xl text-sm font-bold text-indigo-900 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="text">📄 Text Integrat (Lectura curta)</option>
                <option value="book">📖 Llibre de Lectura (Imatge / Coberta)</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1">Títol de la Lectura / Llibre *</label>
              <input type="text" id="editor-title" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1">Nivell Educatiu</label>
              <select id="editor-level" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="Cicle Inicial">Cicle Inicial</option>
                <option value="Cicle Mitjà">Cicle Mitjà</option>
                <option value="Cicle Superior">Cicle Superior</option>
              </select>
            </div>

            <!-- Camp per a Text Integrat -->
            <div id="wrapper-content">
              <label class="block text-sm font-bold text-slate-700 mb-1">Text de la Lectura *</label>
              <textarea id="editor-content" rows="6" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
            </div>

            <!-- Camp per a Llibre (Imatge/Coberta) -->
            <div id="wrapper-image" class="hidden">
              <label class="block text-sm font-bold text-slate-700 mb-1">URL de la Imatge / Coberta del Llibre (Opcional)</label>
              <input type="url" id="editor-image" placeholder="https://exemple.com/coberta.jpg" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div class="pt-4 border-t border-slate-200">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-slate-800">Preguntes de Comprensió</h3>
                <button type="button" onclick="addQuestionField()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-lg transition">
                  <i class="fa-solid fa-plus mr-1"></i> Afegir pregunta
                </button>
              </div>
              <div id="questions-container" class="space-y-4"></div>
            </div>

            <div class="flex justify-end space-x-3 pt-4">
              <button type="button" onclick="renderCatalog()" class="px-4 py-2 border border-slate-300 rounded-xl text-sm text-slate-600 hover:bg-slate-50">Cancel·lar</button>
              <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow transition">Publicar Lectura</button>
            </div>
          </form>
        </div>
      `;

      toggleReadingTypeInputs();
      addQuestionField();
    }

    function toggleReadingTypeInputs() {
      const type = document.getElementById('editor-type').value;
      const wrapContent = document.getElementById('wrapper-content');
      const wrapImage = document.getElementById('wrapper-image');
      const contentInput = document.getElementById('editor-content');

      if (type === 'book') {
        wrapContent.classList.add('hidden');
        if (contentInput) contentInput.removeAttribute('required');
        wrapImage.classList.remove('hidden');
      } else {
        wrapContent.classList.remove('hidden');
        if (contentInput) contentInput.setAttribute('required', 'true');
        wrapImage.classList.add('hidden');
      }
    }

    function addQuestionField() {
      const container = document.getElementById('questions-container');
      if (!container) return;

      const qIndex = container.children.length;

      const qDiv = document.createElement('div');
      qDiv.className = 'q-block p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3 relative';
      qDiv.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-500">Pregunta ${qIndex + 1}</span>
          <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-500 hover:text-red-700 text-xs">
            <i class="fa-solid fa-trash"></i> Eliminar
          </button>
        </div>
        <input type="text" placeholder="Escriu l'enunciat de la pregunta" required class="q-text w-full p-2 border border-slate-300 rounded-lg text-sm">
        
        <div class="grid grid-cols-2 gap-2">
          <input type="text" placeholder="Opció 1" required class="q-opt-0 w-full p-2 border border-slate-300 rounded-lg text-xs">
          <input type="text" placeholder="Opció 2" required class="q-opt-1 w-full p-2 border border-slate-300 rounded-lg text-xs">
          <input type="text" placeholder="Opció 3" class="q-opt-2 w-full p-2 border border-slate-300 rounded-lg text-xs">
          <input type="text" placeholder="Opció 4" class="q-opt-3 w-full p-2 border border-slate-300 rounded-lg text-xs">
        </div>

        <div class="mt-3 flex items-center space-x-2 bg-indigo-50 p-2.5 rounded-lg border border-indigo-100">
          <i class="fa-solid fa-circle-check text-indigo-600"></i>
          <label class="text-xs font-bold text-indigo-900">Quina és la resposta correcta?</label>
          <select class="q-correct p-1 text-xs border border-indigo-300 rounded-md font-bold text-indigo-700 bg-white outline-none">
            <option value="0">Opció 1</option>
            <option value="1">Opció 2</option>
            <option value="2">Opció 3</option>
            <option value="3">Opció 4</option>
          </select>
        </div>
      `;
      container.appendChild(qDiv);
    }

    async function saveReading(e) {
      e.preventDefault();
      const type = document.getElementById('editor-type')?.value || 'text';
      const title = document.getElementById('editor-title').value;
      const level = document.getElementById('editor-level').value;
      const content = document.getElementById('editor-content')?.value || '';
      const imageUrl = document.getElementById('editor-image')?.value || '';

      try {
        const docRef = await db.collection(DB_COLLECTION).add({
          type: type,
          title: title,
          level: level,
          content: content,
          imageUrl: imageUrl,
          authorUid: currentUser ? currentUser.uid : null,
          authorEmail: currentUser ? currentUser.email : "Anònim",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        const qBlocks = document.querySelectorAll('.q-block');
        for (const block of qBlocks) {
          const qText = block.querySelector('.q-text').value;
          const opt0 = block.querySelector('.q-opt-0').value;
          const opt1 = block.querySelector('.q-opt-1').value;
          const opt2 = block.querySelector('.q-opt-2')?.value || '';
          const opt3 = block.querySelector('.q-opt-3')?.value || '';
          
          const correctSelect = block.querySelector('.q-correct');
          const correctIdx = correctSelect ? parseInt(correctSelect.value) : 0;

          const options = [opt0, opt1];
          if (opt2) options.push(opt2);
          if (opt3) options.push(opt3);

          if (qText && options.length >= 2) {
            await db.collection(DB_COLLECTION).doc(docRef.id).collection(SUB_COLLECTION).add({
              questionText: qText,
              options: options,
              correctAnswer: correctIdx
            });
          }
        }

        renderCatalog();
      } catch (err) {
        alert("Error en desar la lectura: " + err.message);
      }
    }

    // --- VISTA 4: LOGIN / REGISTRE AMB SELECCIÓ DE ROL ---
    function renderLogin() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="max-w-md mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
          <div class="flex border-b border-slate-200 mb-6">
            <button id="tab-login" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm">
              Inicia Sessió
            </button>
            <button id="tab-register" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent text-sm hover:text-slate-600">
              Crear Compte
            </button>
          </div>

          <!-- FORMULARI D'INICI DE SESSIÓ -->
          <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Correu electrònic</label>
              <input type="email" id="login-email" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Contrasenya</label>
              <input type="password" id="login-password" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">Inicia Sessió</button>
          </form>

          <!-- FORMULARI DE REGISTRE -->
          <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Soc...</label>
              <select id="reg-role" class="w-full p-2.5 border border-indigo-300 bg-indigo-50/50 rounded-xl text-sm font-bold text-indigo-900 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="alumne">🎓 Alumne / Alumna</option>
                <option value="mestre">👨‍🏫 Mestre / Mestra (Creador/a)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Correu electrònic</label>
              <input type="email" id="reg-email" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Contrasenya</label>
              <input type="password" id="reg-password" required minlength="6" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm transition">Crear Compte</button>
          </form>
        </div>
      `;
    }

    function switchAuthTab(tab) {
      const fLogin = document.getElementById('form-login');
      const fReg = document.getElementById('form-register');
      const tLogin = document.getElementById('tab-login');
      const tReg = document.getElementById('tab-register');

      if (tab === 'register') {
        fLogin.classList.add('hidden');
        fReg.classList.remove('hidden');
        tReg.className = "w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm";
        tLogin.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent text-sm hover:text-slate-600";
      } else {
        fReg.classList.add('hidden');
        fLogin.classList.remove('hidden');
        tLogin.className = "w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm";
        tReg.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent text-sm hover:text-slate-600";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        alert("Error d'accés: " + err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const role = document.getElementById('reg-role').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection("users").doc(cred.user.uid).set({
          email: email,
          role: role,
          points: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        alert("Compte creat amb èxit!");
      } catch (err) {
        alert("Error en registrar l'usuari: " + err.message);
      }
    }
  </script>
</body>
</html>
