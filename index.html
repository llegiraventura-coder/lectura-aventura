<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Aventura - v0.21.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="resetFiltersAndRenderCatalog()">
        <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
        <span class="font-bold text-xl tracking-wide">Lectura Aventura</span>
      </div>
      <nav id="nav-actions" class="flex items-center space-x-3"></nav>
    </div>
  </header>

  <div id="motivation-banner"></div>

  <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6"></main>

  <footer class="bg-slate-800 text-slate-400 py-4 text-sm mt-auto border-t border-slate-700">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
      <p>&copy; Lectura Aventura — Plataforma Educativa de Comprensió Lectora</p>
      <button onclick="renderChangelogPage()" class="inline-flex items-center gap-1.5 text-xs bg-slate-700 hover:bg-slate-600 text-amber-300 hover:text-amber-200 px-3 py-1 rounded-lg transition font-mono border border-slate-600">
        <i class="fa-solid fa-code-branch text-amber-400"></i>
        <span>v0.21.1 — Historial de versions</span>
      </button>
    </div>
  </footer>

  <div id="profile-modal-container"></div>
  <div id="auth-modal-container"></div>
  <div id="folder-modal-container"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCcBpg9FRwYDElWoZlYsGir4ZA_HqS0BDc",
      authDomain: "lectura-aventura.firebaseapp.com",
      projectId: "lectura-aventura",
      storageBucket: "lectura-aventura.firebasestorage.app",
      messagingSenderId: "525339295825",
      appId: "1:525339295825:web:3a5b3ea8791f6146d4b870",
      measurementId: "G-7132LXLDTR"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DB_COLLECTION = "lectures";
    const FOLDERS_COLLECTION = "folders";
    const SUB_COLLECTION = "questions";
    const ADMIN_SUPREMO_EMAIL = "scasas26@xtec.cat";

    let currentUser = null;
    let userPoints = 0;
    let userRole = 'alumne'; 
    let userCompletedReadings = [];
    let userDisplayName = "";
    let userSchool = "";
    let userTeacherUid = ""; 
    let filterMyLectures = false;
    let editingDocId = null;
    let authIsSignUp = false;
    let currentLeaderboardTab = 'group';

    let filterSearch = "";
    let filterBookAuthor = "";
    let filterType = "all";
    let filterLevel = "all";
    let filterCategory = "all";
    let filterStatus = "all";
    let filterDuration = "all";

    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (user) {
        await loadUserData();
      } else {
        userPoints = 0;
        userRole = 'alumne';
        userCompletedReadings = [];
        userDisplayName = "";
        userSchool = "";
        userTeacherUid = "";
        filterMyLectures = false;
      }
      renderNav();
      
      const urlParams = new URLSearchParams(window.location.search);
      const directFolderId = urlParams.get('carpeta');
      const directReadingId = urlParams.get('lectura');
      const viewChangelog = urlParams.get('changelog');
      
      if (viewChangelog) {
        renderChangelogPage();
      } else if (directFolderId) {
        renderFolderView(directFolderId);
      } else if (directReadingId) {
        renderReader(directReadingId);
      } else if (currentUser && (!userDisplayName || (userRole !== 'adult' && !userSchool))) {
        renderUserProfileModal();
      } else {
        renderCatalog();
      }
    });

    async function loadUserData() {
      if (!currentUser) return;
      try {
        const doc = await db.collection("users").doc(currentUser.uid).get();
        if (doc.exists) {
          const data = doc.data();
          userPoints = data.points !== undefined ? data.points : 0;
          let role = data.role || 'alumne';
          if (role === 'mestre') role = 'docent';
          userRole = role;
          userCompletedReadings = data.completedReadings || [];
          userDisplayName = data.displayName || "";
          userSchool = data.school || "";
          userTeacherUid = data.teacherUid || "";
        }
      } catch (err) {
        console.warn("Error carregant dades de l'usuari:", err);
      }
    }

    function getRankDetails(points) {
      if (points >= 1300) return { name: "Mestre/a de la Lectura", icon: "fa-crown", color: "from-amber-400 to-amber-600", text: "text-amber-300" };
      if (points >= 700) return { name: "Lector/a d'Or", icon: "fa-trophy", color: "from-amber-300 to-amber-500", text: "text-amber-200" };
      if (points >= 300) return { name: "Lector/a d'Argent", icon: "fa-medal", color: "from-slate-400 to-slate-600", text: "text-slate-200" };
      if (points >= 100) return { name: "Lector/a de Bronze", icon: "fa-award", color: "from-amber-700 to-amber-900", text: "text-amber-400" };
      return { name: "Explorador/a d'Històries", icon: "fa-compass", color: "from-indigo-500 to-indigo-700", text: "text-indigo-200" };
    }

    function getTeacherRankDetails(points, email = "") {
      if (email === ADMIN_SUPREMO_EMAIL) return { name: "⚡ Admin Supremo", subtext: "Controlador/a del Codi", icon: "fa-shield-halved", badgeBg: "bg-purple-100 text-purple-900 border-purple-300", color: "from-purple-600 to-pink-600" };
      if (points >= 20) return { name: "👑 Docent Celestial", subtext: "Creador/a d'Universos Lectors", icon: "fa-wand-magic-sparkles", badgeBg: "bg-amber-100 text-amber-900 border-amber-300", color: "from-amber-400 to-amber-600" };
      if (points >= 15) return { name: "📚 Docent de Docents", subtext: "Supervivent de claustres", icon: "fa-graduation-cap", badgeBg: "bg-indigo-100 text-indigo-900 border-indigo-300", color: "from-blue-600 to-indigo-800" };
      if (points >= 10) return { name: "🌟 Savi/a de la Sala", subtext: "Llegenda entre cafès", icon: "fa-mug-hot", badgeBg: "bg-amber-50 text-amber-800 border-amber-200", color: "from-amber-600 to-amber-800" };
      if (points >= 6) return { name: "⚡ Arquitecte/a Pedagògic/a", subtext: "Dominador/a del currículum", icon: "fa-cubes", badgeBg: "bg-indigo-50 text-indigo-800 border-indigo-200", color: "from-indigo-500 to-indigo-700" };
      if (points >= 3) return { name: "📝 Docent Col·laborador/a", subtext: "Exportador/a de fotocòpies", icon: "fa-copy", badgeBg: "bg-teal-50 text-teal-800 border-teal-200", color: "from-teal-500 to-emerald-700" };
      if (points >= 1) return { name: "👨‍🏫 Docent Novell", subtext: "Ajustant el projector", icon: "fa-chalkboard-user", badgeBg: "bg-slate-100 text-slate-800 border-slate-300", color: "from-slate-500 to-slate-700" };
      return { name: "🎒 Docent Nouvingut/da", subtext: "Cercant el wifi de l'escola", icon: "fa-compass-drafting", badgeBg: "bg-slate-50 text-slate-600 border-slate-200", color: "from-slate-400 to-indigo-500" };
    }

    function renderBanner() {
      const bannerContainer = document.getElementById('motivation-banner');
      if (!bannerContainer) return;

      if (currentUser && (userRole === 'alumne' || userRole === 'adult')) {
        const rank = getRankDetails(userPoints);
        const displayName = userDisplayName || currentUser.email.split('@')[0];
        
        let nextRankPoints = 100;
        let nextRankName = "Lector/a de Bronze";
        if (userPoints >= 100 && userPoints < 300) { nextRankPoints = 300; nextRankName = "Lector/a d'Argent"; }
        else if (userPoints >= 300 && userPoints < 700) { nextRankPoints = 700; nextRankName = "Lector/a d'Or"; }
        else if (userPoints >= 700 && userPoints < 1300) { nextRankPoints = 1300; nextRankName = "Mestre/a de la Lectura"; }
        else if (userPoints >= 1300) { nextRankPoints = userPoints; }

        const pointsNeeded = nextRankPoints - userPoints;

        bannerContainer.innerHTML = `
          <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-indigo-900 text-white border-b border-indigo-700/50 shadow-inner py-3 px-4">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3 text-center md:text-left">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr ${rank.color} text-white flex items-center justify-center text-lg shadow-md border border-white/20">
                  <i class="fa-solid ${rank.icon}"></i>
                </div>
                <div>
                  <h2 class="text-sm md:text-base font-extrabold text-white tracking-wide">
                    Hola, <span class="text-amber-300">${displayName}</span>!
                  </h2>
                  <p class="text-xs text-indigo-200">
                    Rang actual: <span class="font-bold text-amber-300">${rank.name}</span>
                  </p>
                </div>
              </div>

              <div class="flex items-center space-x-4 bg-indigo-950/60 px-4 py-1.5 rounded-xl border border-indigo-500/30">
                <div class="text-right">
                  <span class="block text-xs font-semibold text-indigo-200">Total acumulat</span>
                  <span class="text-base font-black text-amber-400">${userPoints} PTS</span>
                </div>
                <div class="h-7 w-px bg-indigo-700/60"></div>
                <div class="text-left">
                  <span class="block text-xs font-semibold text-indigo-200">Següent objectiu</span>
                  <span class="text-xs font-bold text-slate-200">
                    ${userPoints >= 1300 ? '🌟 Nivell Màxim Assolit!' : `+${pointsNeeded} pts per ${nextRankName}`}
                  </span>
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        bannerContainer.innerHTML = '';
      }
    }

    function renderNav() {
      const nav = document.getElementById('nav-actions');
      if (currentUser) {
        const isCreator = userRole === 'docent' || userRole === 'colaborador';
        const isDocent = userRole === 'docent';
        const isLector = userRole === 'alumne' || userRole === 'adult';
        const rank = isCreator ? getTeacherRankDetails(userPoints, currentUser.email) : getRankDetails(userPoints);
        const nameToShow = userDisplayName || currentUser.email.split('@')[0];

        nav.innerHTML = `
          <button onclick="toggleMyLectures()" class="${filterMyLectures ? 'bg-amber-300 text-slate-900 font-bold' : 'bg-indigo-700 hover:bg-indigo-800 text-white font-semibold'} px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid ${filterMyLectures ? 'fa-filter-circle-xmark' : 'fa-bookmark'}"></i>
            <span class="hidden sm:inline">${filterMyLectures ? 'Totes les lectures' : 'Les meves lectures'}</span>
          </button>

          ${isLector ? `
            <button onclick="renderStudentLeaderboard()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-md transform hover:scale-105">
              <i class="fa-solid fa-trophy text-amber-900"></i>
              <span class="hidden md:inline">Classificació</span>
            </button>
          ` : ''}

          ${isDocent ? `
            <button onclick="renderTeacherFoldersList()" class="bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-folder-closed text-amber-300"></i>
              <span class="hidden md:inline">Carpetes / SA</span>
            </button>

            <button onclick="renderStudentTrackingPanel()" class="bg-indigo-700 hover:bg-indigo-800 text-amber-300 font-bold px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-users text-sm"></i>
              <span class="hidden md:inline">Els meus Alumnes</span>
            </button>
          ` : ''}

          ${isCreator ? `
            <button onclick="renderEditor()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3.5 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-md transform hover:scale-105">
              <i class="fa-solid fa-plus text-base"></i>
              <span>Nova Lectura</span>
            </button>
          ` : ''}

          <div onclick="renderUserProfileModal()" title="Obrir el meu perfil" class="cursor-pointer flex items-center bg-indigo-800/80 hover:bg-indigo-800 backdrop-blur-sm px-3 py-1.5 rounded-xl border border-indigo-500/30 space-x-3 shadow-inner transition">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr ${rank.color} text-white flex items-center justify-center text-sm shadow">
              <i class="fa-solid ${rank.icon}"></i>
            </div>
            
            <div class="flex flex-col text-left">
              <div class="flex items-center space-x-1.5">
                <span class="text-xs font-bold text-white tracking-wide">${nameToShow}</span>
                <span class="bg-amber-400/20 text-amber-300 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md border border-amber-400/30">${userPoints} pts</span>
              </div>
              <span class="text-[11px] text-amber-300 font-bold leading-none mt-0.5">${rank.name}</span>
            </div>

            <button onclick="event.stopPropagation(); logout()" title="Tancar Sessió" class="text-indigo-300 hover:text-white hover:bg-indigo-700/50 p-1.5 rounded-lg transition ml-1">
              <i class="fa-solid fa-right-from-bracket text-sm"></i>
            </button>
          </div>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="renderLogin()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow">Inicia Sessió</button>
        `;
      }
      renderBanner();
    }

    async function saveNewFolder(e, readingIdToAdd) {
      e.preventDefault();
      const title = document.getElementById('folder-title').value;
      const desc = document.getElementById('folder-desc').value;

      try {
        const docRef = await db.collection(FOLDERS_COLLECTION).add({
          title: title,
          description: desc,
          authorUid: currentUser.uid,
          authorName: userDisplayName || currentUser.email.split('@')[0],
          readingIds: readingIdToAdd ? [readingIdToAdd] : [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        closeFolderModal();
        if (readingIdToAdd) {
          alert("📁 Carpeta creada i lectura afegida correctament!");
          renderCatalog();
        } else {
          renderTeacherFoldersList();
        }
      } catch (err) {
        alert("Error en crear la carpeta: " + err.message);
      }
    }

    async function toggleReadingInFolder(folderId, readingId, currentlyExists) {
      try {
        const folderRef = db.collection(FOLDERS_COLLECTION).doc(folderId);
        if (currentlyExists) {
          await folderRef.update({ readingIds: firebase.firestore.FieldValue.arrayRemove(readingId) });
        } else {
          await folderRef.update({ readingIds: firebase.firestore.FieldValue.arrayUnion(readingId) });
        }
        closeFolderModal();
        renderCatalog();
      } catch (err) {
        alert("Error en actualitzar la carpeta: " + err.message);
      }
    }

    async function deleteFolder(folderId) {
      if (!confirm("Estàs segur/a de voler eliminar aquesta carpeta? Les lectures no s'esborraran.")) return;
      try {
        await db.collection(FOLDERS_COLLECTION).doc(folderId).delete();
        renderTeacherFoldersList();
      } catch (err) {
        alert("Error en eliminar la carpeta: " + err.message);
      }
    }

    function shareFolderLink(folderId) {
      const baseUrl = window.location.href.split('?')[0];
      const shareUrl = `${baseUrl}?carpeta=${folderId}`;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert(`🔗 Enllaç del Recull/Carpeta copiat!\n\n${shareUrl}\n\nEnganxa'l a Google Classroom o al teu entorn d'aula.`);
        }).catch(() => {
          prompt("Copia aquest enllaç directe per a compartir la carpeta:", shareUrl);
        });
      } else {
        prompt("Copia aquest enllaç directe per a compartir la carpeta:", shareUrl);
      }
    }

    function closeAuthModal() {
      const container = document.getElementById('auth-modal-container');

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const roleSelect = document.getElementById('auth-role');
      const errBox = document.getElementById('auth-error');

      errBox.classList.add('hidden');

      try {
        if (authIsSignUp) {
          const userCred = await auth.createUserWithEmailAndPassword(email, password);
          const role = roleSelect ? roleSelect.value : 'alumne';
          
          await db.collection("users").doc(userCred.user.uid).set({
            email: email,
            role: role,
            points: 0,
            completedReadings: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        closeAuthModal();
      } catch (err) {
        errBox.innerText = "Error d'autenticació: " + err.message;
        errBox.classList.remove('hidden');
      }
    }

    async function submitQuiz(e, docId, pointsPerQuestion = 1) {
      e.preventDefault();
      if (!currentUser) {
        renderLogin();
        return;
      }

      const form = e.target;
      const formData = new FormData(form);

      const questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
      let score = 0;
      let total = questionsSnap.size;

      questionsSnap.forEach(qDoc => {
        const q = qDoc.data();
        const selected = parseInt(formData.get(`q_${qDoc.id}`));
        const correct = q.correctAnswer !== undefined ? q.correctAnswer : 0;
        if (selected === correct) score++;
      });

      const newQuizPoints = score * pointsPerQuestion;
      const maxPossiblePoints = total * pointsPerQuestion;

      let userScores = {};
      try {
        const userDoc = await db.collection("users").doc(currentUser.uid).get();
        if (userDoc.exists) userScores = userDoc.data().scores || {};
      } catch (err) {
        console.warn("Error llegint puntuacions anteriors:", err);
      }

      const previousQuizPoints = userScores[docId] || 0;
      let pointsToAdd = 0;

      if (newQuizPoints > previousQuizPoints) {
        pointsToAdd = newQuizPoints - previousQuizPoints;
        userScores[docId] = newQuizPoints;
        userPoints += pointsToAdd;
      }

      if (!userCompletedReadings.includes(docId)) userCompletedReadings.push(docId);

      try {
        await db.collection("users").doc(currentUser.uid).set({
          points: userPoints,
          completedReadings: userCompletedReadings,
          scores: userScores
        }, { merge: true });
      } catch (err) {
        console.warn("S'han desat les dades localment:", err);
      }

      await loadUserData();
      renderNav();

      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;

      if (pointsToAdd > 0) {
        alert(`🎉 Gran millora! Has encertat ${score} de ${total} preguntes.\n\nS'han afegit +${pointsToAdd} PTS nous al teu total! (Total en aquesta lectura: ${newQuizPoints}/${maxPossiblePoints} pts)`);
      } else if (newQuizPoints === maxPossiblePoints) {
        alert(`⭐ Molt bé! Has tornat a encertar totes les preguntes (${score}/${total}), però ja tenies la puntuació màxima d'aquesta lectura.`);
      } else {
        alert(`👍 Has encertat ${score} de ${total} preguntes (${newQuizPoints} pts).\n\nCom que la teva millor marca anterior era de ${previousQuizPoints} pts, el teu total no ha canviat.`);
      }

      resetFiltersAndRenderCatalog();
    }

            ${editingDocId ? `<span class="text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-md">Mode Edició</span>` : ''}
          </h1>
          <form onsubmit="saveReading(event)" class="space-y-5">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1">Tipus de Lectura *</label>
              <select id="editor-type" onchange="toggleReadingTypeInputs()" class="w-full p-2.5 border border-indigo-300 bg-indigo-50/50 rounded-xl text-sm font-bold text-indigo-900 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="text" ${initialData.type === 'text' ? 'selected' : ''}>📄 Text Integrat (Lectura curta)</option>
                <option value="book" ${initialData.type === 'book' ? 'selected' : ''}>📖 Llibre de Lectura (Imatge / Coberta)</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1">Títol de la Lectura / Llibre *</label>
              <input type="text" id="editor-title" value="${initialData.title || ''}" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div class="bg-amber-50/60 p-4 rounded-xl border border-amber-200/80 space-y-3">
              <h3 class="text-xs font-bold text-amber-900 uppercase tracking-wide flex items-center gap-1.5">
                <i class="fa-solid fa-feather-pointed"></i> Dades d'Atribució i Drets d'Autor
              </h3>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Autor/a Original de l'Obra</label>
                  <input type="text" id="editor-book-author" value="${initialData.bookAuthor || ''}" placeholder="Ex: Mercè Rodoreda, J.K. Rowling" class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>

                <div>
                  <label id="label-editorial-source" class="block text-xs font-bold text-slate-700 mb-1">Editorial / Font o Referència Legal</label>
                  <input type="text" id="editor-source" value="${initialData.editorialOrSource || ''}" placeholder="Ex: Edicions 62, o URL d'origen" class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Nivell Educatiu / Públic *</label>
                <select id="editor-level" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="1r cicle de primària" ${initialData.level === '1r cicle de primària' || initialData.level === 'Cicle Inicial' ? 'selected' : ''}>1r cicle de primària</option>
                  <option value="2n cicle de primària" ${initialData.level === '2n cicle de primària' || initialData.level === 'Cicle Mitjà' ? 'selected' : ''}>2n cicle de primària</option>
                  <option value="3r cicle de primària" ${initialData.level === '3r cicle de primària' || initialData.level === 'Cicle Superior' ? 'selected' : ''}>3r cicle de primària</option>
                  <option value="Secundària" ${initialData.level === 'Secundària' ? 'selected' : ''}>Secundària (ESO)</option>
                  <option value="Formació d'Adults" ${initialData.level === "Formació d'Adults" ? 'selected' : ''}>🧑‍💼 Formació d'Adults / CFA</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Categoria / Gènere *</label>
                <select id="editor-category" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="Aventura" ${initialData.category === 'Aventura' ? 'selected' : ''}>🧭 Aventura</option>
                  <option value="Misteri" ${initialData.category === 'Misteri' ? 'selected' : ''}>🔍 Misteri</option>
                  <option value="Ciència-ficció" ${initialData.category === 'Ciència-ficció' ? 'selected' : ''}>🚀 Ciència-ficció</option>
                  <option value="Teatre" ${initialData.category === 'Teatre' ? 'selected' : ''}>🎭 Teatre</option>
                  <option value="Poesia" ${initialData.category === 'Poesia' ? 'selected' : ''}>📜 Poesia</option>
                  <option value="Tradició / Llegenda" ${initialData.category === 'Tradició / Llegenda' ? 'selected' : ''}>🏛️ Tradició / Llegenda</option>
                  <option value="General" ${initialData.category === 'General' ? 'selected' : ''}>📖 General</option>
                </select>
              </div>

              <div id="wrapper-duration-text">
                <label class="block text-sm font-bold text-slate-700 mb-1">Durada Estimada *</label>
                <select id="editor-duration" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="5 min" ${initialData.estimatedTime === '5 min' ? 'selected' : ''}>⏱️ 5 minuts</option>
                  <option value="10 min" ${initialData.estimatedTime === '10 min' ? 'selected' : ''}>⏱️ 10 minuts</option>
                  <option value="15 min" ${initialData.estimatedTime === '15 min' ? 'selected' : ''}>⏱️ 15 minuts</option>
                  <option value="+20 min" ${initialData.estimatedTime === '+20 min' ? 'selected' : ''}>⏱️ +20 minuts</option>
                </select>
              </div>

              <div id="wrapper-duration-book" class="hidden">
                <label class="block text-sm font-bold text-slate-700 mb-1">Nº de Pàgines *</label>
                <input type="number" id="editor-book-pages" value="${initialData.bookPages || ''}" placeholder="Ex: 120" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>

              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Punts / encert *</label>
                <select id="editor-points-per-q" class="w-full p-2.5 border border-amber-300 bg-amber-50/50 rounded-xl text-sm font-bold text-amber-900 focus:ring-2 focus:ring-amber-500 outline-none">
                  <option value="1" ${(initialData.pointsPerQuestion || 1) === 1 ? 'selected' : ''}>1 Punt (Estàndard)</option>
                  <option value="2" ${(initialData.pointsPerQuestion || 1) === 2 ? 'selected' : ''}>2 Punts (Complexa)</option>
                </select>
              </div>
            </div>

            <div id="wrapper-content">
              <label class="block text-sm font-bold text-slate-700 mb-1">Text de la Lectura *</label>
              <textarea id="editor-content" rows="6" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">${initialData.content || ''}</textarea>
            </div>

            <div id="wrapper-image" class="hidden">
              <label class="block text-sm font-bold text-slate-700 mb-1">URL de la Imatge / Coberta del Llibre (Opcional)</label>
              <input type="url" id="editor-image" value="${initialData.imageUrl || ''}" placeholder="https://exemple.com/coberta.jpg" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div class="pt-4 border-t border-slate-200">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-slate-800">Preguntes de Comprensió</h3>
                <button type="button" onclick="addQuestionField()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-lg transition">
                  <i class="fa-solid fa-plus mr-1"></i> Afegir pregunta
                </button>
              </div>
              <div id="questions-container" class="space-y-4"></div>
            </div>

            <div class="flex justify-end space-x-3 pt-4">
              <button type="button" onclick="renderCatalog()" class="px-4 py-2 border border-slate-300 rounded-xl text-sm text-slate-600 hover:bg-slate-50">Cancel·lar</button>
              <button type="submit" class="px-5 py-2 ${editingDocId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white font-bold rounded-xl text-sm shadow transition">
                ${editingDocId ? 'Desar Canvis' : 'Publicar Lectura (+1 PTS)'}
              </button>
            </div>
          </form>
        </div>
      `;

      toggleReadingTypeInputs();

      if (initialQuestions.length > 0) {
        initialQuestions.forEach(q => addQuestionField(q));
      } else {
        addQuestionField();
      }
    }

    function toggleReadingTypeInputs() {
      const type = document.getElementById('editor-type').value;
      const wrapContent = document.getElementById('wrapper-content');
      const wrapImage = document.getElementById('wrapper-image');
      const wrapDurText = document.getElementById('wrapper-duration-text');
      const wrapDurBook = document.getElementById('wrapper-duration-book');
      const contentInput = document.getElementById('editor-content');
      const labelSource = document.getElementById('label-editorial-source');

      if (type === 'book') {
        wrapContent.classList.add('hidden');
        if (contentInput) contentInput.removeAttribute('required');
        wrapImage.classList.remove('hidden');
        wrapDurText.classList.add('hidden');
        wrapDurBook.classList.remove('hidden');
        if (labelSource) labelSource.innerText = "Editorial / Any d'Edició";
      } else {
        wrapContent.classList.remove('hidden');
        if (contentInput) contentInput.setAttribute('required', 'true');
        wrapImage.classList.add('hidden');
        wrapDurText.classList.remove('hidden');
        wrapDurBook.classList.add('hidden');
        if (labelSource) labelSource.innerText = "Font / Referència Legal o Enllaç";
      }
    }

    function addQuestionField(data = null) {
      const container = document.getElementById('questions-container');
      if (!container) return;

      const qIndex = container.children.length;

      const qText = data ? (data.questionText || data.pregunta || '') : '';
      const opts = data ? (data.options || data.opcions || ['', '', '', '']) : ['', '', '', ''];
      const correctIdx = data ? (data.correctAnswer !== undefined ? data.correctAnswer : 0) : 0;

      const qDiv = document.createElement('div');
      qDiv.className = 'q-block p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3 relative';
      qDiv.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-500">Pregunta ${qIndex + 1}</span>
          <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-500 hover:text-red-700 text-xs">
            <i class="fa-solid fa-trash"></i> Eliminar
          </button>
        </div>
        <input type="text" value="${qText}" placeholder="Escriu l'enunciat de la pregunta" required class="q-text w-full p-2 border border-slate-300 rounded-lg text-sm">
        
        <div class="grid grid-cols-2 gap-2">
          <input type="text" value="${opts[0] || ''}" placeholder="Opció 1" required class="q-opt-0 w-full p-2 border border-slate-300 rounded-lg text-xs">
          <input type="text" value="${opts[1] || ''}" placeholder="Opció 2" required class="q-opt-1 w-full p-2 border border-slate-300 rounded-lg text-xs">
          <input type="text" value="${opts[2] || ''}" placeholder="Opció 3" class="q-opt-2 w-full p-2 border border-slate-300 rounded-lg text-xs">
          <input type="text" value="${opts[3] || ''}" placeholder="Opció 4" class="q-opt-3 w-full p-2 border border-slate-300 rounded-lg text-xs">
        </div>

        <div class="mt-3 flex items-center space-x-2 bg-indigo-50 p-2.5 rounded-lg border border-indigo-100">
          <i class="fa-solid fa-circle-check text-indigo-600"></i>
          <label class="text-xs font-bold text-indigo-900">Quina és la resposta correcta?</label>
          <select class="q-correct p-1 text-xs border border-indigo-300 rounded-md font-bold text-indigo-700 bg-white outline-none">
            <option value="0" ${correctIdx === 0 ? 'selected' : ''}>Opció 1</option>
            <option value="1" ${correctIdx === 1 ? 'selected' : ''}>Opció 2</option>
            <option value="2" ${correctIdx === 2 ? 'selected' : ''}>Opció 3</option>
            <option value="3" ${correctIdx === 3 ? 'selected' : ''}>Opció 4</option>
          </select>
        </div>
      `;
      container.appendChild(qDiv);
    }

    async function saveReading(e) {
      e.preventDefault();
      const type = document.getElementById('editor-type')?.value || 'text';
      const title = document.getElementById('editor-title').value;
      const bookAuthor = document.getElementById('editor-book-author')?.value || '';
      const editorialOrSource = document.getElementById('editor-source')?.value || '';
      const level = document.getElementById('editor-level').value;
      const category = document.getElementById('editor-category')?.value || 'General';
      const estimatedTime = document.getElementById('editor-duration')?.value || '10 min';
      const bookPages = document.getElementById('editor-book-pages')?.value || '';
      const pointsPerQuestion = parseInt(document.getElementById('editor-points-per-q')?.value || 1);
      const content = document.getElementById('editor-content')?.value || '';
      const imageUrl = document.getElementById('editor-image')?.value || '';

      const authorDisplayName = userDisplayName || (currentUser ? currentUser.email.split('@')[0] : "Creador/a");
      const authorSchool = userSchool || "";
      const authorEmail = currentUser ? currentUser.email : "";

      try {
        let docId = editingDocId;

        if (editingDocId) {
          await db.collection(DB_COLLECTION).doc(editingDocId).update({
            type: type,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            estimatedTime: estimatedTime,
            bookPages: bookPages,
            pointsPerQuestion: pointsPerQuestion,
            content: content,
            imageUrl: imageUrl,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          const oldQ = await db.collection(DB_COLLECTION).doc(editingDocId).collection(SUB_COLLECTION).get();
          for (const qDoc of oldQ.docs) {
            await qDoc.ref.delete();
          }
        } else {
          if (currentUser && (userRole === 'docent' || userRole === 'colaborador')) {
            userPoints += 1;
            await db.collection("users").doc(currentUser.uid).set({ points: userPoints }, { merge: true });
          }

          const docRef = await db.collection(DB_COLLECTION).add({
            type: type,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            estimatedTime: estimatedTime,
            bookPages: bookPages,
            pointsPerQuestion: pointsPerQuestion,
            content: content,
            imageUrl: imageUrl,
            authorUid: currentUser ? currentUser.uid : null,
            authorDisplayName: authorDisplayName,
            authorSchool: authorSchool,
            authorEmail: authorEmail,
            authorPoints: userPoints,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          docId = docRef.id;
        }

        const qBlocks = document.querySelectorAll('.q-block');
        for (const block of qBlocks) {
          const qText = block.querySelector('.q-text').value;
          const opt0 = block.querySelector('.q-opt-0').value;
          const opt1 = block.querySelector('.q-opt-1').value;
          const opt2 = block.querySelector('.q-opt-2')?.value || '';
          const opt3 = block.querySelector('.q-opt-3')?.value || '';
          
          const correctSelect = block.querySelector('.q-correct');
          const correctIdx = correctSelect ? parseInt(correctSelect.value) : 0;

          const options = [opt0, opt1];
          if (opt2) options.push(opt2);
          if (opt3) options.push(opt3);

          if (qText && options.length >= 2) {
            await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add({
              questionText: qText,
              options: options,
              correctAnswer: correctIdx
            });
          }
        }

        editingDocId = null;
        await loadUserData();
        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error en desar la lectura: " + err.message);
      }
    }
  </script>
</body>
</html>
