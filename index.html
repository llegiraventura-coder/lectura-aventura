<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Aventura - v0.42.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    .font-dyslexic {
      font-family: 'OpenDyslexic', 'Comic Sans MS', sans-serif !important;
      letter-spacing: 0.05em;
      word-spacing: 0.15em;
      line-height: 1.8 !important;
    }
    .bg-sepia { background-color: #fbf0d9 !important; color: #3b2e1e !important; }
    .bg-sepia a { color: #9c4221 !important; border-color: #d97736 !important; }
    .bg-dark-mode { background-color: #1e293b !important; color: #f1f5f9 !important; }
    .bg-dark-mode a { color: #38bdf8 !important; border-color: #0284c7 !important; }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- CAPÇALERA PRINCIPAL -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="resetFiltersAndRenderCatalog()">
        <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
        <div>
          <span class="font-bold text-xl tracking-wide block leading-none">Lectura Aventura</span>
          <span class="text-[10px] text-amber-300 font-mono font-bold">v0.42.0</span>
        </div>
      </div>
      <nav id="nav-actions" class="flex items-center space-x-2 md:space-x-3"></nav>
    </div>
  </header>

  <div id="global-error-box"></div>
  <div id="motivation-banner"></div>
  <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6">
    <div class="text-center py-12">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i>
      <p class="mt-2 text-slate-500 font-medium">Iniciant Lectura Aventura v0.42.0...</p>
    </div>
  </main>

  <footer class="bg-slate-800 text-slate-400 py-4 text-sm mt-auto border-t border-slate-700">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
      <p>&copy; Lectura Aventura — Plataforma Educativa de Comprensió Lectora</p>
      <button onclick="renderChangelogPage()" class="inline-flex items-center gap-1.5 text-xs bg-slate-700 hover:bg-slate-600 text-amber-300 hover:text-amber-200 px-3 py-1 rounded-lg transition font-mono border border-slate-600">
        <i class="fa-solid fa-code-branch text-amber-400"></i>
        <span>v0.42.0 — Historial de versions</span>
      </button>
    </div>
  </footer>

  <div id="profile-modal-container"></div>
  <div id="auth-modal-container"></div>
  <div id="folder-modal-container"></div>
  <div id="feedback-modal-container"></div>
  <div id="clone-modal-container"></div>
  <div id="zoom-modal-container"></div>

  <!-- Captura d'errors aïllada -->
  <script>
    function showGlobalError(msg) {
      var box = document.getElementById('global-error-box');
      if (box) {
        box.innerHTML = '<div class="max-w-4xl mx-auto mt-3 p-4 bg-red-100 border-2 border-red-400 text-red-900 rounded-xl text-xs font-mono shadow">' +
          '<strong>⚠️ Error detectat:</strong> ' + msg +
          '</div>';
      }
    }
    window.addEventListener('error', function(event) {
      showGlobalError('(Línia ' + (event.lineno || '?') + ') ' + (event.message || 'Error desconegut'));
    });
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason ? (event.reason.message || String(event.reason)) : 'Error en promesa';
      showGlobalError('(Async) ' + reason);
    });
  </script>

  <!-- CAPÍTOLS DE LÒGICA DE LECTURA AVENTURA -->
  <script src="1-config-ia.js"></script>
  <script src="2-motor-preguntes.js"></script>
  <script src="3-cataleg-perfil.js"></script>
  <script src="4-editor-lector.js"></script>
  <script src="5-docents-comunitat.js"></script>
</body>
</html>
