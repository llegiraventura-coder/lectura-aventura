    function formatReadingCode(num) {
      if (!num || isNaN(num)) return "#CL-00001";
      return `#CL-${String(num).padStart(5, '0')}`;
    }

    function scrollToGlossary(e) {
      if (e) e.preventDefault();
      const target = document.getElementById('glossary-section');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // EDITOR DE LECTURES I CLONACIÓ DOCENT (v0.33.1 CORREGIT)
    async function renderEditor(docIdToEdit = null, cloneFromDocId = null) {
      stopSpeechSynthesis();
      if (!currentUser) {
        renderLogin();
        return;
      }

      const isAdmin = currentUser.email === ADMIN_SUPREMO_EMAIL;
      if (userRole !== 'docent' && userRole !== 'colaborador' && !isAdmin) {
        alert("Accés restringit a Docents i Col·laboradors.");
        renderCatalog();
        return;
      }

      editingDocId = docIdToEdit;
      cloningParentId = cloneFromDocId;

      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i><p class="mt-2 text-slate-500 font-medium">Carregant l'editor...</p></div>`;

      let initialData = {
        type: 'text',
        title: '',
        bookAuthor: '',
        editorialOrSource: '',
        level: '1r cicle de primària',
        category: 'Aventura',
        estimatedTime: '10 min',
        bookPages: '',
        pointsPerQuestion: 1,
        content: '',
        imageUrl: '',
        readingNumber: null,
        glossary: [],
        parentReadingId: null
      };

      let initialQuestions = [];
      const targetDocId = editingDocId || cloningParentId;

      if (targetDocId) {
        try {
          const docSnap = await db.collection(DB_COLLECTION).doc(targetDocId).get();
          if (docSnap.exists) {
            initialData = docSnap.data();
            
            // CORRECCIÓ 1: Càrrega garantida per orderIndex
            let qSnap;
            try {
              qSnap = await db.collection(DB_COLLECTION).doc(targetDocId).collection(SUB_COLLECTION).orderBy('orderIndex', 'asc').get();
            } catch (orderErr) {
              qSnap = await db.collection(DB_COLLECTION).doc(targetDocId).collection(SUB_COLLECTION).get();
            }

            if (qSnap.empty) {
              qSnap = await db.collection(DB_COLLECTION).doc(targetDocId).collection(SUB_COLLECTION).get();
            }

            qSnap.forEach(qDoc => { 
              initialQuestions.push({ id: qDoc.id, ...qDoc.data() }); 
            });

            // Ordenació de seguretat si no tenien orderIndex
            initialQuestions.sort((a, b) => (a.orderIndex !== undefined ? a.orderIndex : 0) - (b.orderIndex !== undefined ? b.orderIndex : 0));
          }
        } catch (err) {
          console.error("Error carregant la lectura per a l'editor:", err);
        }
      }

      if (cloningParentId) {
        initialData.title = `${initialData.title} (Adaptació de la comunitat)`;
        initialData.parentReadingId = cloningParentId;
      }

      const assignedCode = (editingDocId && initialData.readingNumber) ? formatReadingCode(initialData.readingNumber) : "Assignació automàtica en publicar";

        <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">

                <div class="flex items-center gap-1.5">

                </div>
              </div>
            </div>
          `}

            <h1 class="text-2xl font-bold text-slate-800 flex items-center">
              <i class="fa-solid ${cloningParentId ? 'fa-code-fork text-amber-600' : (editingDocId ? 'fa-pen-to-square text-amber-500' : 'fa-plus text-indigo-600')} mr-2"></i> 
              ${cloningParentId ? 'Clonar i Crear Adaptació Docent' : (editingDocId ? 'Editar Lectura' : 'Crear Nova Lectura')}
            </h1>
            <span class="text-xs font-mono font-bold bg-indigo-50/80 text-indigo-700 px-3 py-1 rounded-xl border border-indigo-200/80 shadow-xs">
              <i class="fa-solid fa-barcode text-indigo-400 mr-1"></i> ${assignedCode}
            </span>
          </div>

          <form onsubmit="saveReading(event)" class="space-y-5">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1">Tipus de Lectura *</label>
              <select id="editor-type" onchange="toggleReadingTypeInputs()" class="w-full p-2.5 border border-indigo-300 bg-indigo-50/50 rounded-xl text-sm font-bold text-indigo-900 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="text" ${initialData.type === 'text' ? 'selected' : ''}>📄 Text Integrat (Lectura curta)</option>

            <div class="bg-amber-50/60 p-4 rounded-xl border border-amber-200/80 space-y-3">
              <h3 class="text-xs font-bold text-amber-900 uppercase tracking-wide flex items-center gap-1.5">

              </h3>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

                <select id="editor-level" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">

                  <option value="2n cicle de primària" ${initialData.level === '2n cicle de primària' || initialData.level === 'Cicle Mitjà' ? 'selected' : ''}>2n cicle de primària</option>

                </select>
              </div>

              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Categoria / Gènere *</label>
                <select id="editor-category" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">

                  <option value="Teatre" ${initialData.category === 'Teatre' ? 'selected' : ''}>🎭 Teatre</option>
                  <option value="Poesia" ${initialData.category === 'Poesia' ? 'selected' : ''}>📜 Poesia</option>

                  <option value="2" ${(initialData.pointsPerQuestion || 1) === 2 ? 'selected' : ''}>2 Pts per encert</option>

            <div id="wrapper-content">

                <button type="button" onclick="insertGlossaryLink()" class="text-xs text-teal-800 bg-teal-100 hover:bg-teal-200 font-bold px-2.5 py-1 rounded-lg border border-teal-300 flex items-center gap-1 shadow-2xs">

              </div>

            <div id="wrapper-image" class="hidden">

            </div>

            <div class="bg-teal-50/70 p-4 rounded-xl border border-teal-200/80 space-y-3">

                <div>
                  <h3 class="text-xs font-bold text-teal-900 uppercase tracking-wide flex items-center gap-1.5">
                    <i class="fa-solid fa-book-bookmark text-teal-600"></i> 📖 Glossari / Vocabulari Clau (Opcional)

            </div>

            <div class="pt-4 border-t border-slate-200">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">

                </h3>
                <button type="button" onclick="addQuestionField()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-lg transition border border-indigo-200">
                  <i class="fa-solid fa-plus mr-1"></i> Afegir pregunta
                </button>
              </div>
              
              <div id="questions-container" class="space-y-4"></div>

              <div class="mt-4 pt-2">
                <button type="button" onclick="addQuestionField()" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-2.5 px-4 rounded-xl transition border border-indigo-200 flex items-center justify-center gap-2 text-xs md:text-sm shadow-xs">
                  <i class="fa-solid fa-plus text-sm"></i>
                  <span>Afegir una altra pregunta al final</span>
                </button>
              </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4">
              <button type="button" onclick="renderCatalog()" class="px-4 py-2 border border-slate-300 rounded-xl text-sm text-slate-600 hover:bg-slate-50">Cancel·lar</button>

                ${cloningParentId ? 'Publicar Adaptació Docent (+1 PTS)' : (editingDocId ? 'Desar Canvis' : 'Publicar Lectura (+1 PTS)')}

          </form>
        </div>

      }

      if (initialQuestions.length > 0) {
        initialQuestions.forEach(q => addQuestionField(q));
      } else {
        addQuestionField();
      }
    }

    // CORRECCIÓ 2 I 3: Carregador dinàmic de preguntes amb tipologia i format d'imatge intactes
    function addQuestionField(data = null) {
      const container = document.getElementById('questions-container');
      if (!container) return;

      const qText = data ? (data.questionText || data.pregunta || '') : '';
      const opts = data ? (data.options || data.opcions || ['', '', '', '']) : ['', '', '', ''];
      const qType = data ? (data.questionType || 'single') : 'single';
      const qTaxonomy = data ? (data.taxonomyType || 'literal') : 'literal';

      let correctSingleIdx = 0;
      let correctMultipleArr = [0];

      if (data) {
        if (Array.isArray(data.correctAnswers)) {
          correctMultipleArr = data.correctAnswers.map(v => parseInt(v));
          correctSingleIdx = correctMultipleArr[0] || 0;
        } else if (data.correctAnswer !== undefined) {
          correctSingleIdx = parseInt(data.correctAnswer);
          correctMultipleArr = [correctSingleIdx];
        }
      }

      const qDiv = document.createElement('div');
      qDiv.className = 'q-block p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3 relative';
      
      qDiv.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-200/60 pb-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="q-number-badge w-7 h-7 rounded-lg bg-indigo-600 text-white font-extrabold text-xs flex items-center justify-center shrink-0 shadow-xs">1</span>
            <span class="q-number-label text-xs font-bold text-slate-700">Pregunta 1</span>
            
            <select class="q-type-select p-1 text-xs border border-slate-300 rounded-md font-bold text-slate-700 bg-white outline-none" onchange="toggleQuestionAnswerType(this)">
              <option value="single" ${qType === 'single' ? 'selected' : ''}>🔘 Opció Única (1 resposta)</option>
              <option value="multiple" ${qType === 'multiple' ? 'selected' : ''}>☑️ Opció Múltiple (Vàries respostes)</option>
              <option value="opinion" ${qType === 'opinion' ? 'selected' : ''}>💬 Reflexió / Opinió (Totes vàlides)</option>
              <option value="ordering" ${qType === 'ordering' ? 'selected' : ''}>↕️ Ordena Cronològicament (Seqüència)</option>
              <option value="image_single" ${qType === 'image_single' ? 'selected' : ''}>🖼️ Selecció d'Imatge (Respostes visuals)</option>
            </select>

            <select class="q-taxonomy-select p-1 text-xs border border-indigo-200 rounded-md font-bold text-indigo-800 bg-indigo-50/60 outline-none">
              <option value="literal" ${qTaxonomy === 'literal' ? 'selected' : ''}>🟢 Literal (Explícita)</option>
              <option value="inferential" ${qTaxonomy === 'inferential' ? 'selected' : ''}>🔵 Inferencial (Implícita)</option>
              <option value="figurative" ${qTaxonomy === 'figurative' ? 'selected' : ''}>🟣 Sentit Figurat (Dites/Dobles)</option>
              <option value="opinion" ${qTaxonomy === 'opinion' ? 'selected' : ''}>💬 D'Opinió (Crítica)</option>
              <option value="creative" ${qTaxonomy === 'creative' ? 'selected' : ''}>🎨 Creativa (Alternatives)</option>
            </select>
          </div>
          
          <div class="flex items-center space-x-1 self-end sm:self-auto">
            <button type="button" onclick="moveQuestionUp(this)" title="Pujar pregunta" class="p-1.5 text-xs font-bold bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-lg">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
            <button type="button" onclick="moveQuestionDown(this)" title="Baixar pregunta" class="p-1.5 text-xs font-bold bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-lg">
              <i class="fa-solid fa-arrow-down"></i>
            </button>
            <button type="button" onclick="removeQuestionField(this)" title="Eliminar" class="p-1.5 text-xs font-bold bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-lg ml-2">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>

        <input type="text" value="${qText}" placeholder="Escriu l'enunciat de la pregunta" required class="q-text w-full p-2 border border-slate-300 rounded-lg text-sm">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div class="flex items-center border border-slate-300 rounded-lg bg-white overflow-hidden">
            <span class="opt-label-badge bg-slate-100 text-slate-700 font-extrabold text-xs px-2.5 py-2 border-r border-slate-200 shrink-0">A</span>
            <input type="text" value="${opts[0] || ''}" placeholder="Opció A" required class="q-opt-0 w-full p-2 text-xs outline-none" oninput="updateImagePreview(this)">
          </div>

          <div class="flex items-center border border-slate-300 rounded-lg bg-white overflow-hidden">
            <span class="opt-label-badge bg-slate-100 text-slate-700 font-extrabold text-xs px-2.5 py-2 border-r border-slate-200 shrink-0">B</span>
            <input type="text" value="${opts[1] || ''}" placeholder="Opció B" required class="q-opt-1 w-full p-2 text-xs outline-none" oninput="updateImagePreview(this)">
          </div>

          <div class="flex items-center border border-slate-300 rounded-lg bg-white overflow-hidden">
            <span class="opt-label-badge bg-slate-100 text-slate-700 font-extrabold text-xs px-2.5 py-2 border-r border-slate-200 shrink-0">C</span>
            <input type="text" value="${opts[2] || ''}" placeholder="Opció C" class="q-opt-2 w-full p-2 text-xs outline-none" oninput="updateImagePreview(this)">
          </div>

          <div class="flex items-center border border-slate-300 rounded-lg bg-white overflow-hidden">
            <span class="opt-label-badge bg-slate-100 text-slate-700 font-extrabold text-xs px-2.5 py-2 border-r border-slate-200 shrink-0">D</span>
            <input type="text" value="${opts[3] || ''}" placeholder="Opció D" class="q-opt-3 w-full p-2 text-xs outline-none" oninput="updateImagePreview(this)">
          </div>
        </div>

        <div class="q-image-previews-box hidden grid grid-cols-4 gap-2 pt-1">
          <div class="h-16 bg-white rounded-lg border border-slate-200 overflow-hidden flex items-center justify-center">
            <img class="img-preview-0 w-full h-full object-cover" src="${opts[0] || ''}" onerror="this.src='https://via.placeholder.com/100?text=A'">
          </div>
          <div class="h-16 bg-white rounded-lg border border-slate-200 overflow-hidden flex items-center justify-center">
            <img class="img-preview-1 w-full h-full object-cover" src="${opts[1] || ''}" onerror="this.src='https://via.placeholder.com/100?text=B'">
          </div>
          <div class="h-16 bg-white rounded-lg border border-slate-200 overflow-hidden flex items-center justify-center">
            <img class="img-preview-2 w-full h-full object-cover" src="${opts[2] || ''}" onerror="this.src='https://via.placeholder.com/100?text=C'">
          </div>
          <div class="h-16 bg-white rounded-lg border border-slate-200 overflow-hidden flex items-center justify-center">
            <img class="img-preview-3 w-full h-full object-cover" src="${opts[3] || ''}" onerror="this.src='https://via.placeholder.com/100?text=D'">
          </div>
        </div>

        <div class="q-single-box flex items-center space-x-2 bg-indigo-50 p-2.5 rounded-lg border border-indigo-100">
          <i class="fa-solid fa-circle-check text-indigo-600"></i>
          <label class="q-single-label text-xs font-bold text-indigo-900">Quina és la resposta correcta?</label>
          <select class="q-correct-single p-1 text-xs border border-indigo-300 rounded-md font-bold text-indigo-700 bg-white outline-none">
            <option value="0" ${correctSingleIdx === 0 ? 'selected' : ''}>Opció A</option>
            <option value="1" ${correctSingleIdx === 1 ? 'selected' : ''}>Opció B</option>
            <option value="2" ${correctSingleIdx === 2 ? 'selected' : ''}>Opció C</option>
            <option value="3" ${correctSingleIdx === 3 ? 'selected' : ''}>Opció D</option>
          </select>
        </div>

        <div class="q-multiple-box hidden p-2.5 bg-purple-50 rounded-lg border border-purple-100 space-y-1.5">
          <div class="flex items-center gap-1.5 text-xs font-bold text-purple-900">
            <i class="fa-solid fa-square-check text-purple-600"></i>
            <span>Marca totes les respostes que són correctes:</span>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center space-x-2 bg-white p-1.5 rounded border border-purple-200 cursor-pointer">
              <input type="checkbox" value="0" class="q-correct-multi w-4 h-4 text-purple-600 rounded" ${correctMultipleArr.includes(0) ? 'checked' : ''}>
              <span class="font-bold">Opció A</span>
            </label>
            <label class="flex items-center space-x-2 bg-white p-1.5 rounded border border-purple-200 cursor-pointer">
              <input type="checkbox" value="1" class="q-correct-multi w-4 h-4 text-purple-600 rounded" ${correctMultipleArr.includes(1) ? 'checked' : ''}>
              <span class="font-bold">Opció B</span>
            </label>
            <label class="flex items-center space-x-2 bg-white p-1.5 rounded border border-purple-200 cursor-pointer">
              <input type="checkbox" value="2" class="q-correct-multi w-4 h-4 text-purple-600 rounded" ${correctMultipleArr.includes(2) ? 'checked' : ''}>
              <span class="font-bold">Opció C</span>
            </label>
            <label class="flex items-center space-x-2 bg-white p-1.5 rounded border border-purple-200 cursor-pointer">
              <input type="checkbox" value="3" class="q-correct-multi w-4 h-4 text-purple-600 rounded" ${correctMultipleArr.includes(3) ? 'checked' : ''}>
              <span class="font-bold">Opció D</span>
            </label>
          </div>
        </div>

        <div class="q-opinion-box hidden p-2.5 bg-blue-50 rounded-lg border border-blue-200 flex items-center space-x-2 text-xs font-bold text-blue-900">
          <i class="fa-solid fa-comment-dots text-blue-600 text-sm"></i>
          <span>💡 Pregunta de Reflexió: Qualsevol opció seleccionada per l'alumne comptarà com a encert.</span>
        </div>

        <div class="q-ordering-box hidden p-2.5 bg-amber-50 rounded-lg border border-amber-200 flex items-center space-x-2 text-xs font-bold text-amber-900">
          <i class="fa-solid fa-arrow-down-short-wide text-amber-600 text-sm"></i>
          <span>↕️ Escriu les frases en l’ordre cronològic REAL (1r, 2n, 3r, 4t). Es mostraran barrejades a l’alumne automàticament.</span>
        </div>
      `;

      container.appendChild(qDiv);
      
      // Força l'adaptació visual immediata del tipus de pregunta precarregada
      const selectElem = qDiv.querySelector('.q-type-select');
      if (selectElem) toggleQuestionAnswerType(selectElem);

      updateQuestionIndexes();
    }
  </script>
</body>
</html>
