<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Aventura - v0.27.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- CAPÇALERA PRINCIPAL -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="resetFiltersAndRenderCatalog()">
        <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
        <div>
          <span class="font-bold text-xl tracking-wide block leading-none">Lectura Aventura</span>
          <span class="text-[10px] text-indigo-200 font-mono">v0.27.0</span>
        </div>
      </div>
      <nav id="nav-actions" class="flex items-center space-x-2 md:space-x-3"></nav>
    </div>
  </header>

  <!-- BANNER DE MOTIVACIÓ / PERFIL -->
  <div id="motivation-banner"></div>

  <!-- CONTINGUT PRINCIPAL DINÀMIC -->
  <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6"></main>

  <!-- PEU DE PÀGINA -->
  <footer class="bg-slate-800 text-slate-400 py-4 text-sm mt-auto border-t border-slate-700">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
      <p>&copy; Lectura Aventura — Plataforma Educativa de Comprensió Lectora</p>
      <button onclick="renderChangelogPage()" class="inline-flex items-center gap-1.5 text-xs bg-slate-700 hover:bg-slate-600 text-amber-300 hover:text-amber-200 px-3 py-1 rounded-lg transition font-mono border border-slate-600">
        <i class="fa-solid fa-code-branch text-amber-400"></i>
        <span>v0.27.0 — Historial de versions</span>
      </button>
    </div>
  </footer>

  <!-- MODALS CONTENIDORS -->
  <div id="profile-modal-container"></div>
  <div id="auth-modal-container"></div>
  <div id="folder-modal-container"></div>
  <div id="feedback-modal-container"></div>

  <script>
    // CONFIGURACIÓ DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyCcBpg9FRwYDElWoZlYsGir4ZA_HqS0BDc",
      authDomain: "lectura-aventura.firebaseapp.com",
      projectId: "lectura-aventura",
      storageBucket: "lectura-aventura.firebasestorage.app",
      messagingSenderId: "525339295825",
      appId: "1:525339295825:web:3a5b3ea8791f6146d4b870",
      measurementId: "G-7132LXLDTR"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DB_COLLECTION = "lectures";
    const FOLDERS_COLLECTION = "folders";
    const SUB_COLLECTION = "questions";
    const ADMIN_SUPREMO_EMAIL = "scasas26@xtec.cat";

    // ESTAT GLOBAL
    let currentUser = null;
    let userPoints = 0;
    let userRole = 'alumne'; 
    let userCompletedReadings = [];
    let userDisplayName = "";
    let userSchool = "";
    let userTeacherUid = ""; 
    let filterMyLectures = false;
    let editingDocId = null;
    let authIsSignUp = false;
    let currentLeaderboardTab = 'group';

    // FILTRES DEL CATÀLEG
    let filterSearch = "";
    let filterBookAuthor = "";
    let filterType = "all";
    let filterLevel = "all";
    let filterCategory = "all";
    let filterStatus = "all";
    let filterDuration = "all";

    // DICCIONARI DE TAXONOMIA COGNITIVA
    const TAXONOMY_CONFIG = {
      literal: { label: "Literal", desc: "Buscar informació explícita en el text", color: "bg-emerald-100 text-emerald-800 border-emerald-300", icon: "fa-magnifying-glass" },
      inferential: { label: "Inferencial", desc: "Deduir informació implícita a partir de pistes", color: "bg-blue-100 text-blue-800 border-blue-300", icon: "fa-lightbulb" },
      figurative: { label: "Sentit Figurat", desc: "Desxifrar frases fetes, dites i llenguatge no literal", color: "bg-purple-100 text-purple-800 border-purple-300", icon: "fa-comments" },
      opinion: { label: "D'Opinió", desc: "Valorar, jutjar o donar el punt de vista crític", color: "bg-amber-100 text-amber-900 border-amber-300", icon: "fa-scale-balanced" },
      creative: { label: "Creativa", desc: "Proposar alternatives o connectar amb l'expressió artística", color: "bg-rose-100 text-rose-800 border-rose-300", icon: "fa-wand-magic-sparkles" }
    };

    /* ==========================================================================
       ARQUITECTURA MODULAR DEL MOTOR DE PREGUNTES (QuestionEngine v0.27.0)
       ========================================================================== */
    const QuestionEngine = {
      render(qDocId, qData, qIndex, totalQuestions = 0) {
        const type = qData.questionType || 'single';
        const taxonomy = qData.taxonomyType || 'literal';
        const taxConfig = TAXONOMY_CONFIG[taxonomy] || TAXONOMY_CONFIG.literal;
        const text = qData.questionText || qData.pregunta || `Pregunta ${qIndex + 1}`;
        const options = qData.options || qData.opcions || [];

        let badgeHTML = '';
        if (type === 'multiple') {
          badgeHTML = `<span class="text-[11px] font-bold text-purple-700 bg-purple-100 border border-purple-200 px-2 py-0.5 rounded-md shrink-0">☑️ Opció Múltiple</span>`;
        } else if (type === 'opinion') {
          badgeHTML = `<span class="text-[11px] font-bold text-blue-700 bg-blue-100 border border-blue-200 px-2 py-0.5 rounded-md shrink-0">💬 Reflexió / Opinió (Vàlides totes)</span>`;
        } else if (type === 'ordering') {
          badgeHTML = `<span class="text-[11px] font-bold text-amber-800 bg-amber-100 border border-amber-300 px-2 py-0.5 rounded-md shrink-0">↕️ Ordenació Cronològica</span>`;
        }

        const taxBadge = `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-md border inline-flex items-center gap-1 ${taxConfig.color}">
          <i class="fa-solid ${taxConfig.icon}"></i> ${taxConfig.label}
        </span>`;

        let optionsHTML = '';

        if (type === 'ordering') {
          let indexedOptions = options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
          indexedOptions.sort(() => Math.random() - 0.5);

          optionsHTML = `
            <div class="bg-amber-50/50 p-3 rounded-xl border border-amber-200/80 mb-2">
              <p class="text-xs font-bold text-amber-900 mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-up-down-left-right text-amber-600"></i>
                Fes servir les fletxes per ordenar els fets de primer (1r) a últim:
              </p>
              <div id="ordering_list_${qDocId}" class="ordering-container space-y-2">
          `;

          indexedOptions.forEach((optObj, posIdx) => {
            optionsHTML += `
              <div class="ordering-item flex items-center justify-between p-2.5 bg-white rounded-lg border border-slate-200 shadow-xs" data-original-idx="${optObj.originalIdx}">
                <div class="flex items-center space-x-3">
                  <span class="pos-badge w-6 h-6 rounded-md bg-amber-500 text-white font-black text-xs flex items-center justify-center shrink-0">
                    ${posIdx + 1}º
                  </span>
                  <span class="text-sm font-medium text-slate-800">${optObj.text}</span>
                </div>
                <div class="flex items-center space-x-1">
                  <button type="button" onclick="moveOrderItem(this, -1)" class="p-1 px-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded border border-slate-300">▲</button>
                  <button type="button" onclick="moveOrderItem(this, 1)" class="p-1 px-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded border border-slate-300">▼</button>
                </div>
              </div>
            `;
          });

          optionsHTML += `
              </div>
              <input type="hidden" name="q_${qDocId}" id="q_input_${qDocId}" value="${indexedOptions.map(o => o.originalIdx).join(',')}">
            </div>
          `;
        } else {
          const letterLabels = ['A', 'B', 'C', 'D'];
          options.forEach((opt, oIdx) => {
            const letterBadge = `<span class="w-5 h-5 rounded bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">${letterLabels[oIdx] || ''}</span>`;
            if (type === 'multiple') {
              optionsHTML += `
                <label class="flex items-center space-x-3 p-2.5 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-purple-50/50 transition">
                  <input type="checkbox" name="q_${qDocId}" value="${oIdx}" class="w-4 h-4 text-purple-600 rounded focus:ring-purple-500">
                  ${letterBadge}
                  <span class="text-sm text-slate-700 font-medium">${opt}</span>
                </label>
              `;
            } else {
              const hoverColor = type === 'opinion' ? 'hover:bg-blue-50/50' : 'hover:bg-indigo-50/50';
              const radioColor = type === 'opinion' ? 'text-blue-600 focus:ring-blue-500' : 'text-indigo-600 focus:ring-indigo-500';
              
              optionsHTML += `
                <label class="flex items-center space-x-3 p-2.5 bg-white rounded-lg border border-slate-200 cursor-pointer ${hoverColor} transition">
                  <input type="radio" name="q_${qDocId}" value="${oIdx}" required class="w-4 h-4 ${radioColor}">
                  ${letterBadge}
                  <span class="text-sm text-slate-700 font-medium">${opt}</span>
                </label>
              `;
            }
          });
        }

        const progressIndicator = totalQuestions > 0 ? `<span class="text-xs text-indigo-600 font-extrabold bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-100">Pregunta ${qIndex + 1} de ${totalQuestions}</span>` : '';

        return `
          <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white font-extrabold text-xs flex items-center justify-center shrink-0 shadow-xs">${qIndex + 1}</span>
                <p class="font-bold text-slate-800 text-sm md:text-base">${text}</p>
              </div>
              <div class="flex items-center gap-1.5 flex-wrap justify-end">${progressIndicator} ${taxBadge} ${badgeHTML}</div>
            </div>
            <div class="space-y-2">${optionsHTML}</div>
          </div>
        `;
      },

      evaluate(qData, qDocId, formData) {
        const type = qData.questionType || 'single';

        if (type === 'ordering') {
          const val = formData.get(`q_${qDocId}`);
          if (!val) return false;
          const userSequence = val.split(',').map(v => parseInt(v));
          return userSequence.every((v, idx) => v === idx);
        } else if (type === 'opinion') {
          const selected = formData.get(`q_${qDocId}`);
          return selected !== null && selected !== undefined;
        } else if (type === 'multiple') {
          const selectedVals = formData.getAll(`q_${qDocId}`).map(v => parseInt(v)).sort();
          let correctVals = [];
          if (Array.isArray(qData.correctAnswers)) {
            correctVals = qData.correctAnswers.map(v => parseInt(v)).sort();
          } else if (qData.correctAnswer !== undefined) {
            correctVals = [parseInt(qData.correctAnswer)];
          }

          return selectedVals.length === correctVals.length && 
                 selectedVals.every((val, idx) => val === correctVals[idx]);
        } else {
          const selected = parseInt(formData.get(`q_${qDocId}`));
          const correct = qData.correctAnswer !== undefined ? parseInt(qData.correctAnswer) : 0;
          return selected === correct;
        }
      }
    };

    function moveOrderItem(btn, dir) {
      const item = btn.closest('.ordering-item');
      const container = item.parentNode;
      const items = Array.from(container.children);
      const currentIdx = items.indexOf(item);
      const targetIdx = currentIdx + dir;

      if (targetIdx >= 0 && targetIdx < items.length) {
        if (dir === -1) {
          container.insertBefore(item, items[targetIdx]);
        } else {
          container.insertBefore(item, items[targetIdx].nextSibling);
        }
        
        const updatedItems = Array.from(container.children);
        updatedItems.forEach((it, idx) => {
          it.querySelector('.pos-badge').innerText = `${idx + 1}º`;
        });
        const hiddenInput = container.parentNode.querySelector('input[type="hidden"]');
        if (hiddenInput) {
          hiddenInput.value = updatedItems.map(it => it.getAttribute('data-original-idx')).join(',');
        }
      }
    }

    // OBSERVADOR D'AUTENTICACIÓ
    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (user) {
        await loadUserData();
      } else {
        userPoints = 0;
        userRole = 'alumne';
        userCompletedReadings = [];
        userDisplayName = "";
        userSchool = "";
        userTeacherUid = "";
        filterMyLectures = false;
      }
      renderNav();
      
      const urlParams = new URLSearchParams(window.location.search);
      const directFolderId = urlParams.get('carpeta');
      const directReadingId = urlParams.get('lectura');
      const viewChangelog = urlParams.get('changelog');
      
      if (viewChangelog) {
        renderChangelogPage();
      } else if (directFolderId) {
        renderFolderView(directFolderId);
      } else if (directReadingId) {
        renderReader(directReadingId);
      } else if (currentUser && (!userDisplayName || (userRole !== 'adult' && !userSchool))) {
        renderUserProfileModal();
      } else {
        renderCatalog();
      }
    });

    async function loadUserData() {
      if (!currentUser) return;
      try {
        const doc = await db.collection("users").doc(currentUser.uid).get();
        if (doc.exists) {
          const data = doc.data();
          userPoints = data.points !== undefined ? data.points : 0;
          let role = data.role || 'alumne';
          if (role === 'mestre') role = 'docent';
          userRole = role;
          userCompletedReadings = data.completedReadings || [];
          userDisplayName = data.displayName || "";
          userSchool = data.school || "";
          userTeacherUid = data.teacherUid || "";
        }
      } catch (err) {
        console.warn("Error carregant dades de l'usuari:", err);
      }
    }

    function getRankDetails(points) {
      if (points >= 1300) return { name: "Mestre/a de la Lectura", icon: "fa-crown", color: "from-amber-400 to-amber-600", text: "text-amber-300" };
      if (points >= 700) return { name: "Lector/a d'Or", icon: "fa-trophy", color: "from-amber-300 to-amber-500", text: "text-amber-200" };
      if (points >= 300) return { name: "Lector/a d'Argent", icon: "fa-medal", color: "from-slate-400 to-slate-600", text: "text-slate-200" };
      if (points >= 100) return { name: "Lector/a de Bronze", icon: "fa-award", color: "from-amber-700 to-amber-900", text: "text-amber-400" };
      return { name: "Explorador/a d'Històries", icon: "fa-compass", color: "from-indigo-500 to-indigo-700", text: "text-indigo-200" };
    }

    function getTeacherRankDetails(points, email = "") {
      if (email === ADMIN_SUPREMO_EMAIL) return { name: "⚡ Admin Supremo", subtext: "Controlador/a del Codi", icon: "fa-shield-halved", badgeBg: "bg-purple-100 text-purple-900 border-purple-300", color: "from-purple-600 to-pink-600" };
      if (points >= 20) return { name: "👑 Docent Celestial", subtext: "Creador/a d'Universos Lectors", icon: "fa-wand-magic-sparkles", badgeBg: "bg-amber-100 text-amber-900 border-amber-300", color: "from-amber-400 to-amber-600" };
      if (points >= 15) return { name: "📚 Docent de Docents", subtext: "Supervivent de claustres", icon: "fa-graduation-cap", badgeBg: "bg-indigo-100 text-indigo-900 border-indigo-300", color: "from-blue-600 to-indigo-800" };
      if (points >= 10) return { name: "🌟 Savi/a de la Sala", subtext: "Llegenda entre cafès", icon: "fa-mug-hot", badgeBg: "bg-amber-50 text-amber-800 border-amber-200", color: "from-amber-600 to-amber-800" };
      if (points >= 6) return { name: "⚡ Arquitecte/a Pedagògic/a", subtext: "Dominador/a del currículum", icon: "fa-cubes", badgeBg: "bg-indigo-50 text-indigo-800 border-indigo-200", color: "from-indigo-500 to-indigo-700" };
      if (points >= 3) return { name: "📝 Docent Col·laborador/a", subtext: "Exportador/a de fotocòpies", icon: "fa-copy", badgeBg: "bg-teal-50 text-teal-800 border-teal-200", color: "from-teal-500 to-emerald-700" };
      if (points >= 1) return { name: "👨‍🏫 Docent Novell", subtext: "Ajustant el projector", icon: "fa-chalkboard-user", badgeBg: "bg-slate-100 text-slate-800 border-slate-300", color: "from-slate-500 to-slate-700" };
      return { name: "🎒 Docent Nouvingut/da", subtext: "Cercant el wifi de l'escola", icon: "fa-compass-drafting", badgeBg: "bg-slate-50 text-slate-600 border-slate-200", color: "from-slate-400 to-indigo-500" };
    }

    function renderBanner() {
      const bannerContainer = document.getElementById('motivation-banner');
      if (!bannerContainer) return;

      if (currentUser && (userRole === 'alumne' || userRole === 'adult')) {
        const rank = getRankDetails(userPoints);
        const displayName = userDisplayName || currentUser.email.split('@')[0];
        
        let nextRankPoints = 100;
        let nextRankName = "Lector/a de Bronze";
        if (userPoints >= 100 && userPoints < 300) { nextRankPoints = 300; nextRankName = "Lector/a d'Argent"; }
        else if (userPoints >= 300 && userPoints < 700) { nextRankPoints = 700; nextRankName = "Lector/a d'Or"; }
        else if (userPoints >= 700 && userPoints < 1300) { nextRankPoints = 1300; nextRankName = "Mestre/a de la Lectura"; }
        else if (userPoints >= 1300) { nextRankPoints = userPoints; }

        const pointsNeeded = nextRankPoints - userPoints;

        bannerContainer.innerHTML = `
          <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-indigo-900 text-white border-b border-indigo-700/50 shadow-inner py-3 px-4">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3 text-center md:text-left">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr ${rank.color} text-white flex items-center justify-center text-lg shadow-md border border-white/20">
                  <i class="fa-solid ${rank.icon}"></i>
                </div>
                <div>
                  <h2 class="text-sm md:text-base font-extrabold text-white tracking-wide">
                    Hola, <span class="text-amber-300">${displayName}</span>!
                  </h2>
                  <p class="text-xs text-indigo-200">
                    Rang actual: <span class="font-bold text-amber-300">${rank.name}</span>
                  </p>
                </div>
              </div>

              <div class="flex items-center space-x-4 bg-indigo-950/60 px-4 py-1.5 rounded-xl border border-indigo-500/30">
                <div class="text-right">
                  <span class="block text-xs font-semibold text-indigo-200">Total acumulat</span>
                  <span class="text-base font-black text-amber-400">${userPoints} PTS</span>
                </div>
                <div class="h-7 w-px bg-indigo-700/60"></div>
                <div class="text-left">
                  <span class="block text-xs font-semibold text-indigo-200">Següent objectiu</span>
                  <span class="text-xs font-bold text-slate-200">
                    ${userPoints >= 1300 ? '🌟 Nivell Màxim Assolit!' : `+${pointsNeeded} pts per ${nextRankName}`}
                  </span>
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        bannerContainer.innerHTML = '';
      }
    }

    function renderNav() {
      const nav = document.getElementById('nav-actions');
      if (currentUser) {
        const isCreator = userRole === 'docent' || userRole === 'colaborador';
        const isDocent = userRole === 'docent';
        const isLector = userRole === 'alumne' || userRole === 'adult';
        const rank = isCreator ? getTeacherRankDetails(userPoints, currentUser.email) : getRankDetails(userPoints);
        const nameToShow = userDisplayName || currentUser.email.split('@')[0];

        nav.innerHTML = `
          <button onclick="toggleMyLectures()" class="${filterMyLectures ? 'bg-amber-300 text-slate-900 font-bold' : 'bg-indigo-700 hover:bg-indigo-800 text-white font-semibold'} px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid ${filterMyLectures ? 'fa-filter-circle-xmark' : 'fa-bookmark'}"></i>
            <span class="hidden sm:inline">${filterMyLectures ? 'Totes les lectures' : 'Les meves lectures'}</span>
          </button>

          ${isLector ? `
            <button onclick="renderStudentLeaderboard()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-md transform hover:scale-105">
              <i class="fa-solid fa-trophy text-amber-900"></i>
              <span class="hidden md:inline">Classificació</span>
            </button>
          ` : ''}

          ${isDocent ? `
            <button onclick="renderTeacherFoldersList()" class="bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-folder-closed text-amber-300"></i>
              <span class="hidden md:inline">Carpetes / SA</span>
            </button>

            <button onclick="renderStudentTrackingPanel()" class="bg-indigo-700 hover:bg-indigo-800 text-amber-300 font-bold px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-users text-sm"></i>
              <span class="hidden md:inline">Els meus Alumnes</span>
            </button>
          ` : ''}

          ${isCreator ? `
            <button onclick="renderEditor()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3.5 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-md transform hover:scale-105">
              <i class="fa-solid fa-plus text-base"></i>
              <span>Nova Lectura</span>
            </button>
          ` : ''}

          <div onclick="renderUserProfileModal()" title="Obrir el meu perfil" class="cursor-pointer flex items-center bg-indigo-800/80 hover:bg-indigo-800 backdrop-blur-sm px-3 py-1.5 rounded-xl border border-indigo-500/30 space-x-3 shadow-inner transition">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr ${rank.color} text-white flex items-center justify-center text-sm shadow">
              <i class="fa-solid ${rank.icon}"></i>
            </div>
            
            <div class="flex flex-col text-left">
              <div class="flex items-center space-x-1.5">
                <span class="text-xs font-bold text-white tracking-wide">${nameToShow}</span>
                <span class="bg-amber-400/20 text-amber-300 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md border border-amber-400/30">${userPoints} pts</span>
              </div>

                    <option value="all" ${filterLevel === 'all' ? 'selected' : ''}>🎓 Tots els nivells</option>

          for (const doc of docsArray) {
            const data = doc.data() || {};
            const docId = doc.id;
            const isBook = data.type === 'book';
            const isCompleted = userCompletedReadings.includes(docId);

            const isAdmin = currentUser && currentUser.email === ADMIN_SUPREMO_EMAIL;
            const isAuthor = currentUser && data.authorUid === currentUser.uid;
            const canEdit = isAdmin || isAuthor;
            const isDocentOrCollab = userRole === 'docent' || userRole === 'colaborador';

            const teacherText = data.authorDisplayName ? `${data.authorDisplayName}${data.authorSchool ? ' (' + data.authorSchool + ')' : ''}` : 'Docent / Col·laborador/a';
            const authorPoints = data.authorPoints !== undefined ? data.authorPoints : 0;
            const authorEmail = data.authorEmail || "";
            const teacherRank = getTeacherRankDetails(authorPoints, authorEmail);

            const bookAuthorName = data.bookAuthor || '';
            const ptsPerQuestion = data.pointsPerQuestion !== undefined ? data.pointsPerQuestion : 1;
            const durationLabel = isBook ? (data.bookPages ? `📄 ${data.bookPages} pàg.` : '') : (data.estimatedTime ? `⏱️ ${data.estimatedTime}` : '');

            let qCount = 10;
            try {
              const qSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
              if (!qSnap.empty) qCount = qSnap.size;
            } catch (err) {
              console.warn("Error en comptar preguntes:", docId);
            }
            const totalPointsInGame = qCount * ptsPerQuestion;

            let currentLevel = data.level || '';
            if (currentLevel === 'Cicle Inicial') currentLevel = '1r cicle de primària';
            if (currentLevel === 'Cicle Mitjà') currentLevel = '2n cicle de primària';
            if (currentLevel === 'Cicle Superior') currentLevel = '3r cicle de primària';

            if (filterMyLectures && currentUser) {
              if (userRole === 'docent' || userRole === 'colaborador') {
                if (data.authorUid !== currentUser.uid) continue;
              } else {
                if (!isCompleted) continue;
              }
            }

            const matchesSearch = (data.title || '').toLowerCase().includes(filterSearch);
            const matchesBookAuthor = !filterBookAuthor || (bookAuthorName.toLowerCase().includes(filterBookAuthor));
            const matchesType = filterType === 'all' || (isBook ? 'book' : 'text') === filterType;
            
            let matchesLevel = filterLevel === 'all';
            if (!matchesLevel) {
              if (filterLevel === '1r cicle de primària') matchesLevel = currentLevel === '1r cicle de primària';
              else if (filterLevel === '2n cicle de primària') matchesLevel = currentLevel === '2n cicle de primària';
              else if (filterLevel === '3r cicle de primària') matchesLevel = currentLevel === '3r cicle de primària';
              else matchesLevel = currentLevel === filterLevel;
            }

            const matchesCategory = filterCategory === 'all' || (data.category || 'General') === filterCategory;
            const matchesDuration = filterDuration === 'all' || (data.estimatedTime === filterDuration);
            
            let matchesStatus = true;
            if (filterStatus === 'completed') matchesStatus = isCompleted;
            if (filterStatus === 'pending') matchesStatus = !isCompleted;
            
            if (!matchesSearch || !matchesBookAuthor || !matchesType || !matchesLevel || !matchesCategory || !matchesDuration || !matchesStatus) continue;

            cardCount++;

            html += `
              <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between">
                <div class="p-5">
                  <div class="flex items-center justify-between mb-3 gap-2">
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isBook ? 'bg-purple-100 text-purple-800' : 'bg-indigo-100 text-indigo-800'}">
                      ${isBook ? '📖 Llibre' : '📄 Text'}
                    </span>
                    <div class="flex items-center gap-1.5 flex-wrap justify-end">
                      ${durationLabel ? `<span class="text-[10px] bg-slate-100 text-slate-700 font-extrabold px-2 py-0.5 rounded-md border border-slate-200">${durationLabel}</span>` : ''}
                      
                      <span class="text-[10px] bg-amber-100 text-amber-900 border border-amber-300 font-extrabold px-2.5 py-0.5 rounded-md shadow-xs">
                        🏆 ${totalPointsInGame} PTS
                      </span>

                      ${isCompleted ? `<span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-md">✅ Feta</span>` : ''}
                      ${data.category ? `<span class="text-[10px] bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded-md">${data.category}</span>` : ''}
                    </div>
                  </div>

                  ${isBook && data.imageUrl ? `
                    <div class="w-full h-40 mb-3 overflow-hidden rounded-xl bg-slate-100">
                      <img src="${data.imageUrl}" alt="${data.title}" class="w-full h-full object-cover">
                    </div>
                  ` : ''}

                  <h3 class="font-bold text-slate-800 text-lg mb-1 line-clamp-2">${data.title || 'Sense títol'}</h3>
                  <p class="text-xs font-semibold text-indigo-600 mb-2">${currentLevel}</p>
                  
                  ${bookAuthorName ? `
                    <p class="text-xs text-slate-600 font-semibold mb-2 flex items-center gap-1.5">
                      <i class="fa-solid fa-feather-pointed text-amber-600"></i>
                      <span>Autor/a de l'obra: <strong class="text-slate-900 font-bold">${bookAuthorName}</strong></span>
                    </p>
                  ` : ''}

                  <div class="mt-2 mb-4 bg-slate-50 p-2.5 rounded-xl border border-slate-100 space-y-1">
                    <span class="block text-xs text-slate-500 flex items-center gap-1">
                      <i class="fa-solid fa-chalkboard-user text-indigo-500 text-[11px]"></i>
                      ${isBook ? 'Preguntes de comprensió lectora:' : 'Lectura adaptada:'}
                    </span>
                    <div class="text-xs text-slate-800 font-bold">
                      ${teacherText}
                    </div>
                    <div class="pt-0.5">
                      <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-md border inline-flex items-center gap-1 ${teacherRank.badgeBg}">
                        <i class="fa-solid ${teacherRank.icon} text-[10px]"></i>
                        ${teacherRank.name}
                      </span>
                    </div>
                  </div>

                  ${!isBook && data.content ? `
                    <p class="text-slate-600 text-sm line-clamp-3 mb-4">${data.content}</p>
                  ` : ''}
                </div>

                <div class="p-5 pt-0 mt-auto space-y-2">
                  <div class="grid grid-cols-6 gap-1.5">
                    <button onclick="renderReader('${docId}')" class="${isDocentOrCollab ? 'col-span-4' : 'col-span-5'} ${isCompleted ? 'bg-slate-700 hover:bg-slate-800' : 'bg-indigo-600 hover:bg-indigo-700'} text-white font-bold py-2.5 rounded-xl text-xs sm:text-sm transition flex items-center justify-center space-x-2">
                      <i class="fa-solid fa-book-open"></i>
                      <span>${isCompleted ? 'Tornar a llegir' : (isBook ? 'Anar al Qüestionari' : 'Llegir i Respondre')}</span>
                    </button>

                    ${isDocentOrCollab ? `
                      <button onclick="openAddToFolderModal('${docId}')" title="Afegir a una Carpeta / SA" class="bg-amber-50 hover:bg-amber-100 text-amber-900 font-bold rounded-xl text-xs transition flex items-center justify-center border border-amber-200">
                        <i class="fa-solid fa-folder-plus text-base text-amber-700"></i>
                      </button>
                    ` : ''}
                    
                    <button onclick="shareReadingLink('${docId}', 'Lectura')" title="Copiar enllaç directe" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-xl text-xs transition flex items-center justify-center border border-indigo-200">
                      <i class="fa-solid fa-share-nodes text-base"></i>
                    </button>
                  </div>

                  ${canEdit ? `
                    <button onclick="renderEditor('${docId}')" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 font-bold py-1.5 rounded-xl text-xs transition flex items-center justify-center space-x-1.5">
                      <i class="fa-solid fa-pen-to-square text-amber-600"></i>
                      <span>Editar Lectura ${isAdmin && !isAuthor ? '(Admin)' : ''}</span>
                    </button>
                  ` : ''}
                </div>
              </div>
            `;
          }
        }

        if (snapshot.empty || cardCount === 0) {
          html += `
            <div class="col-span-full bg-white p-8 rounded-2xl border border-slate-200 text-center">
              <i class="fa-solid fa-filter-circle-xmark text-4xl text-slate-300 mb-3"></i>

              <button onclick="resetFiltersAndRenderCatalog()" class="mt-3 text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded-lg transition">
                Restablir tots els filtres
              </button>
            </div>
          `;
        }

        html += `</div></div>`;
        app.innerHTML = html;
        renderBanner();
      } catch (err) {
        console.error("Error carregant el catàleg:", err);
        app.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg max-w-2xl mx-auto">Error en carregar el catàleg: ${err.message}</div>`;
      }
    }

    function toggleReadingTypeInputs() {
      const type = document.getElementById('editor-type').value;
      const wrapContent = document.getElementById('wrapper-content');
      const wrapImage = document.getElementById('wrapper-image');
      const wrapDurText = document.getElementById('wrapper-duration-text');
      const wrapDurBook = document.getElementById('wrapper-duration-book');
      const contentInput = document.getElementById('editor-content');
      const labelSource = document.getElementById('label-editorial-source');

      if (type === 'book') {
        wrapContent.classList.add('hidden');
        if (contentInput) contentInput.removeAttribute('required');
        wrapImage.classList.remove('hidden');
        wrapDurText.classList.add('hidden');
        wrapDurBook.classList.remove('hidden');
        if (labelSource) labelSource.innerText = "Editorial / Any d'Edició";
      } else {
        wrapContent.classList.remove('hidden');
        if (contentInput) contentInput.setAttribute('required', 'true');
        wrapImage.classList.add('hidden');
        wrapDurText.classList.remove('hidden');
        wrapDurBook.classList.add('hidden');
        if (labelSource) labelSource.innerText = "Font / Referència Legal o Enllaç";
      }
    }

    function removeQuestionField(btn) {
      btn.closest('.q-block').remove();
      updateQuestionIndexes();
    }

    function moveQuestionUp(btn) {
      const currentBlock = btn.closest('.q-block');
      const prevBlock = currentBlock.previousElementSibling;
      if (prevBlock) {
        currentBlock.parentNode.insertBefore(currentBlock, prevBlock);
        updateQuestionIndexes();
      }
    }

    function moveQuestionDown(btn) {
      const currentBlock = btn.closest('.q-block');
      const nextBlock = currentBlock.nextElementSibling;
      if (nextBlock) {
        currentBlock.parentNode.insertBefore(nextBlock, currentBlock);
        updateQuestionIndexes();
      }
    }

    function updateQuestionIndexes() {
      const blocks = document.querySelectorAll('#questions-container .q-block');
      blocks.forEach((block, idx) => {
        const badge = block.querySelector('.q-number-badge');
        const label = block.querySelector('.q-number-label');
        if (badge) badge.innerText = idx + 1;
        if (label) label.innerText = `Pregunta ${idx + 1}`;
      });

      const badge = document.getElementById('question-count-badge');
      if (badge) badge.innerText = blocks.length;
    }

    function toggleQuestionAnswerType(selectElem) {
      const block = selectElem.closest('.q-block');
      const singleBox = block.querySelector('.q-single-box');
      const multiBox = block.querySelector('.q-multiple-box');
      const opinionBox = block.querySelector('.q-opinion-box');
      const orderingBox = block.querySelector('.q-ordering-box');
      const badges = block.querySelectorAll('.opt-label-badge');

      singleBox.classList.add('hidden');
      multiBox.classList.add('hidden');
      opinionBox.classList.add('hidden');
      orderingBox.classList.add('hidden');

      const isOrdering = selectElem.value === 'ordering';

      badges.forEach((b, idx) => {
        const labelsLetter = ['A', 'B', 'C', 'D'];
        const labelsOrder = ['1r', '2n', '3r', '4t'];
        b.innerText = isOrdering ? labelsOrder[idx] : labelsLetter[idx];
      });

      if (selectElem.value === 'multiple') {
        multiBox.classList.remove('hidden');
      } else if (selectElem.value === 'opinion') {
        opinionBox.classList.remove('hidden');
      } else if (selectElem.value === 'ordering') {
        orderingBox.classList.remove('hidden');
      } else {
        singleBox.classList.remove('hidden');
      }
    }

    async function saveReading(e) {
      e.preventDefault();
      const type = document.getElementById('editor-type')?.value || 'text';
      const title = document.getElementById('editor-title').value;
      const bookAuthor = document.getElementById('editor-book-author')?.value || '';
      const editorialOrSource = document.getElementById('editor-source')?.value || '';
      const level = document.getElementById('editor-level').value;
      const category = document.getElementById('editor-category')?.value || 'General';
      const estimatedTime = document.getElementById('editor-duration')?.value || '10 min';
      const bookPages = document.getElementById('editor-book-pages')?.value || '';
      const pointsPerQuestion = parseInt(document.getElementById('editor-points-per-q')?.value || 1);
      const content = document.getElementById('editor-content')?.value || '';
      const imageUrl = document.getElementById('editor-image')?.value || '';

      const authorDisplayName = userDisplayName || (currentUser ? currentUser.email.split('@')[0] : "Creador/a");
      const authorSchool = userSchool || "";
      const authorEmail = currentUser ? currentUser.email : "";

      try {
        let docId = editingDocId;

        if (editingDocId) {
          await db.collection(DB_COLLECTION).doc(editingDocId).update({
            type: type,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            estimatedTime: estimatedTime,
            bookPages: bookPages,
            pointsPerQuestion: pointsPerQuestion,
            content: content,
            imageUrl: imageUrl,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          const oldQ = await db.collection(DB_COLLECTION).doc(editingDocId).collection(SUB_COLLECTION).get();
          for (const qDoc of oldQ.docs) {
            await qDoc.ref.delete();
          }
        } else {
          if (currentUser && (userRole === 'docent' || userRole === 'colaborador')) {
            userPoints += 1;
            await db.collection("users").doc(currentUser.uid).set({ points: userPoints }, { merge: true });
          }

          const docRef = await db.collection(DB_COLLECTION).add({
            type: type,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            estimatedTime: estimatedTime,
            bookPages: bookPages,
            pointsPerQuestion: pointsPerQuestion,
            content: content,
            imageUrl: imageUrl,
            authorUid: currentUser ? currentUser.uid : null,
            authorDisplayName: authorDisplayName,
            authorSchool: authorSchool,
            authorEmail: authorEmail,
            authorPoints: userPoints,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          docId = docRef.id;
        }

        const qBlocks = document.querySelectorAll('.q-block');
        let orderIndex = 0;

        for (const block of qBlocks) {
          const qText = block.querySelector('.q-text').value;
          const opt0 = block.querySelector('.q-opt-0').value;
          const opt1 = block.querySelector('.q-opt-1').value;
          const opt2 = block.querySelector('.q-opt-2')?.value || '';
          const opt3 = block.querySelector('.q-opt-3')?.value || '';
          const qType = block.querySelector('.q-type-select')?.value || 'single';
          const taxonomyType = block.querySelector('.q-taxonomy-select')?.value || 'literal';

          const options = [opt0, opt1];
          if (opt2) options.push(opt2);
          if (opt3) options.push(opt3);

          if (qText && options.length >= 2) {
            const baseQData = {
              questionText: qText,
              options: options,
              questionType: qType,
              taxonomyType: taxonomyType,
              orderIndex: orderIndex
            };

            if (qType === 'opinion' || qType === 'ordering') {
              await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add(baseQData);
            } else if (qType === 'multiple') {
              const multiCheckboxes = block.querySelectorAll('.q-correct-multi:checked');
              const correctAnswers = Array.from(multiCheckboxes).map(cb => parseInt(cb.value));

              await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add({
                ...baseQData,
                correctAnswers: correctAnswers.length > 0 ? correctAnswers : [0]
              });
            } else {
              const correctSelect = block.querySelector('.q-correct-single');
              const correctIdx = correctSelect ? parseInt(correctSelect.value) : 0;

              await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add({
                ...baseQData,
                correctAnswer: correctIdx
              });
            }

            orderIndex++;
          }
        }

        editingDocId = null;
        await loadUserData();
        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error en desar la lectura: " + err.message);
      }
    }

    /* ==========================================================================
       AVALUACIÓ I MODAL DE FEEDBACK DESGLOSSAT
       ========================================================================== */
    async function submitQuiz(e, docId, pointsPerQuestion = 1) {
      e.preventDefault();
      if (!currentUser) {
        renderLogin();
        return;
      }

      const form = e.target;
      const formData = new FormData(form);

      let questionsSnap;
      try {
        questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).orderBy('orderIndex', 'asc').get();
      } catch (e) {
        questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
      }

      let score = 0;
      let total = questionsSnap.size;

      const stats = {
        literal: { correct: 0, total: 0 },
        inferential: { correct: 0, total: 0 },
        figurative: { correct: 0, total: 0 },
        opinion: { correct: 0, total: 0 },
        creative: { correct: 0, total: 0 }
      };

      questionsSnap.forEach(qDoc => {
        const q = qDoc.data() || {};
        const taxKey = q.taxonomyType || 'literal';
        if (!stats[taxKey]) stats[taxKey] = { correct: 0, total: 0 };

        stats[taxKey].total++;
        if (QuestionEngine.evaluate(q, qDoc.id, formData)) {
          score++;
          stats[taxKey].correct++;
        }
      });

      const newQuizPoints = score * pointsPerQuestion;
      const maxPossiblePoints = total * pointsPerQuestion;

      let userScores = {};
      try {
        const userDoc = await db.collection("users").doc(currentUser.uid).get();
        if (userDoc.exists) userScores = userDoc.data().scores || {};
      } catch (err) {
        console.warn("Error llegint puntuacions anteriors:", err);
      }

      const previousQuizPoints = userScores[docId] || 0;
      let pointsToAdd = 0;

      if (newQuizPoints > previousQuizPoints) {
        pointsToAdd = newQuizPoints - previousQuizPoints;
        userScores[docId] = newQuizPoints;
        userPoints += pointsToAdd;
      }

      if (!userCompletedReadings.includes(docId)) userCompletedReadings.push(docId);

      try {
        await db.collection("users").doc(currentUser.uid).set({
          points: userPoints,
          completedReadings: userCompletedReadings,
          scores: userScores
        }, { merge: true });
      } catch (err) {
        console.warn("Dades desades localment:", err);
      }

      await loadUserData();
      renderNav();

      renderFeedbackModal(score, total, newQuizPoints, maxPossiblePoints, pointsToAdd, stats);
    }

      const container = document.getElementById('feedback-modal-container');

      let breakdownRows = '';

          breakdownRows += `

              </div>
            </div>
          `;
        }
      });

      container.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white p-6 rounded-2xl max-w-lg w-full space-y-5 shadow-2xl">

              <p class="text-xs text-slate-500">Has encertat <strong>${score} de ${total}</strong> preguntes (${newQuizPoints}/${maxPossiblePoints} PTS)</p>
            </div>

            ${pointsToAdd > 0 ? `
              <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-center text-emerald-800 text-xs font-bold">
                🎉 Felicitats! Has aconseguit <span class="text-base text-emerald-700">+${pointsToAdd} PTS</span> nous per al teu perfil!
              </div>
            ` : ''}

            <div class="space-y-2">
              <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Desglossament de la Comprensió Lectora:</h4>
              <div class="space-y-2">${breakdownRows}</div>

            <button onclick="document.getElementById('feedback-modal-container').innerHTML=''; resetFiltersAndRenderCatalog();" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm shadow transition">
              Continuar al Catàleg
            </button>
          </div>
        </div>
      `;

          app.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg">Carpeta no trobada.</div>`;
          return;
        }

        const folder = folderDoc.data();
        const readingIds = folder.readings || [];

        let readingsHTML = '';
        if (readingIds.length > 0) {
          for (const rId of readingIds) {
            const rSnap = await db.collection(DB_COLLECTION).doc(rId).get();
            if (rSnap.exists) {
              const r = rSnap.data();
              readingsHTML += `
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                  <div>
                    <h4 class="font-bold text-slate-800 text-sm">${r.title}</h4>
                    <span class="text-xs text-indigo-600">${r.level || ''}</span>
                  </div>
                  <button onclick="renderReader('${rId}')" class="bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">Llegir</button>
                </div>
              `;
            }
          }
        }

        app.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-6">
            <button onclick="resetFiltersAndRenderCatalog()" class="text-slate-500 hover:text-slate-800 text-sm font-medium inline-flex items-center">
              <i class="fa-solid fa-arrow-left mr-1"></i> Tornar al catàleg
            </button>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200">Carpeta / SA</span>
              <h1 class="text-3xl font-black text-slate-800">${folder.title}</h1>
              <p class="text-sm text-slate-600">${folder.description || ''}</p>
            </div>

            <div class="space-y-3">
              <h2 class="text-lg font-bold text-slate-800">Lectures incloses (${readingIds.length})</h2>
              <div class="space-y-2">
                ${readingsHTML || `<p class="text-xs text-slate-500">No hi ha cap lectura en aquesta carpeta.</p>`}
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        console.error("Error visualitzant la carpeta:", err);
      }
    }

    async function openAddToFolderModal(readingId) {
      if (!currentUser) return;
      const modal = document.getElementById('folder-modal-container');

      try {
        const snap = await db.collection(FOLDERS_COLLECTION).where('authorUid', '==', currentUser.uid).get();
        if (snap.empty) {
          alert("Primer has de crear una carpeta a la secció 'Carpetes / SA'.");
          return;
        }

        let options = '';
        snap.forEach(doc => {
          const f = doc.data();
          options += `<option value="${doc.id}">${f.title}</option>`;
        });

        modal.innerHTML = `
          <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white p-6 rounded-2xl max-w-md w-full space-y-4 shadow-xl">
              <h3 class="text-lg font-bold text-slate-800">Afegir a una Carpeta / SA</h3>
              <select id="select-folder-id" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm font-semibold">${options}</select>
              <div class="flex justify-end space-x-2">
                <button onclick="modal.innerHTML=''" class="px-3 py-1.5 text-xs text-slate-600">Cancel·lar</button>
                <button onclick="confirmAddToFolder('${readingId}')" class="px-4 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-xl">Desar</button>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    async function confirmAddToFolder(readingId) {
      const folderId = document.getElementById('select-folder-id').value;
      try {
        await db.collection(FOLDERS_COLLECTION).doc(folderId).update({
          readings: firebase.firestore.FieldValue.arrayUnion(readingId)
        });
        document.getElementById('folder-modal-container').innerHTML = '';
        alert("Lectura afegida correctament a la carpeta!");
      } catch (err) {
        alert("Error en afegir la lectura: " + err.message);
      }
    }

      try {
        const snap = await db.collection("users").where('teacherUid', '==', currentUser.uid).get();

        let rows = '';
        snap.forEach(doc => {
          const u = doc.data();
          const pts = u.points || 0;
          const rank = getRankDetails(pts);
          const completedCount = (u.completedReadings || []).length;

          rows += `
            <tr class="border-b border-slate-100 hover:bg-slate-50">

            </button>

              <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h1 class="text-2xl font-black text-slate-800 flex items-center gap-2">
                  <i class="fa-solid fa-users text-indigo-600"></i> Els meus Alumnes
                </h1>
                <span class="text-xs bg-indigo-50 text-indigo-700 font-mono font-bold px-3 py-1 rounded-lg">Codi Docent: ${currentUser.uid}</span>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
                      <th class="p-3">Nom de l'Alumne/a</th>
                      <th class="p-3">Centre</th>
                      <th class="p-3">Rang Assolit</th>

    function renderUserProfileModal() {
      if (!currentUser) return;
      const container = document.getElementById('profile-modal-container');

      container.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white p-6 rounded-2xl max-w-md w-full space-y-4 shadow-xl">

            </div>
            <form onsubmit="saveUserProfile(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nom / Pseudònim *</label>
                <input type="text" id="profile-display-name" value="${userDisplayName}" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">

              </div>
              ${userRole === 'alumne' ? `

                  <label class="block text-xs font-bold text-slate-700 mb-1">Codi de Mestre/a (UID Docent)</label>
                  <input type="text" id="profile-teacher-uid" value="${userTeacherUid}" placeholder="Enganxa el codi del teu mestre" class="w-full p-2 border border-slate-300 rounded-lg text-sm font-mono">
                </div>
              ` : ''}
              <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-sm">Desar dades de perfil</button>
            </form>
          </div>
        </div>
      `;
    }

    async function saveUserProfile(e) {
      e.preventDefault();
      const name = document.getElementById('profile-display-name').value;
      const school = document.getElementById('profile-school').value;
      const teacherUid = document.getElementById('profile-teacher-uid')?.value || '';

      try {
        await db.collection("users").doc(currentUser.uid).set({
          displayName: name,
          school: school,
          teacherUid: teacherUid
        }, { merge: true });

        document.getElementById('profile-modal-container').innerHTML = '';
        await loadUserData();
        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error desant el perfil: " + err.message);
      }
    }

    /* ==========================================================================
       FUNCIONS AUXILIARS DE NAVEGACIÓ
       ========================================================================== */
    function shareFolderLink(folderId) {
      const shareUrl = `${window.location.href.split('?')[0]}?carpeta=${folderId}`;
      prompt("Copia aquest enllaç directe a la carpeta:", shareUrl);
    }

    function resetFiltersAndRenderCatalog() {
      if (window.location.search) {
        window.history.pushState({}, document.title, window.location.pathname);
      }
      filterSearch = "";
      filterBookAuthor = "";
      filterType = "all";
      filterLevel = "all";
      filterCategory = "all";
      filterStatus = "all";
      filterDuration = "all";
      filterMyLectures = false;
      renderNav();
      renderCatalog();
    }

    function applyCatalogFilters() {
      filterSearch = document.getElementById('search-input')?.value.toLowerCase() || '';
      filterBookAuthor = document.getElementById('author-search-input')?.value.toLowerCase() || '';
      filterType = document.getElementById('type-select')?.value || 'all';
      filterLevel = document.getElementById('level-select')?.value || 'all';
      filterCategory = document.getElementById('category-select')?.value || 'all';
      filterStatus = document.getElementById('status-select')?.value || 'all';
      filterDuration = document.getElementById('duration-select')?.value || 'all';

      renderCatalog();
    }

    function toggleMyLectures() {
      filterMyLectures = !filterMyLectures;
      renderNav();
      renderCatalog();
    }

    function logout() {
      auth.signOut().then(() => renderCatalog());
    }

    function shareReadingLink(docId, title) {
      const baseUrl = window.location.href.split('?')[0];
      const shareUrl = `${baseUrl}?lectura=${docId}`;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert(`🔗 Enllaç copiat al porta-retalls!\n\n${shareUrl}`);
        }).catch(() => { prompt("Copia aquest enllaç:", shareUrl); });
      } else {
        prompt("Copia aquest enllaç:", shareUrl);
      }
    }
