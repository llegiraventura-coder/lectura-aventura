    function escapeHtmlAttr(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function formatReadingCode(num) {
      if (!num || isNaN(num)) return "#CL-00001";
      return "#CL-" + String(num).padStart(5, '0');

    function scrollToGlossary(e) {

    function normalizeText(str) {
      return (str || '')
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    function uploadImageToFirebase(fileInputElem, targetInputClass, statusSpanId, maxDim) {
      if (!fileInputElem) return;
      const file = fileInputElem.files ? fileInputElem.files[0] : fileInputElem;
      if (!file) return;

      const optionWrapper = fileInputElem.closest('.flex-col') || fileInputElem.closest('.q-block');
      const block = fileInputElem.closest('.q-block');

      let statusElem = statusSpanId ? document.getElementById(statusSpanId) : null;
      if (!statusElem && optionWrapper) {
        statusElem = optionWrapper.querySelector('.q-upload-status');
      }

      if (statusElem) {
        statusElem.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-indigo-600"></i> Compriment...';
        statusElem.className = "text-xs text-indigo-600 font-bold flex items-center gap-1";
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const MAX_WIDTH = maxDim || 900;
          const MAX_HEIGHT = maxDim || 900;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width = Math.round((width * MAX_HEIGHT) / height);
              height = MAX_HEIGHT;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataURL = canvas.toDataURL('image/jpeg', 0.78);

          let inputElem = null;
          if (optionWrapper) inputElem = optionWrapper.querySelector('input[type="text"], input[type="url"]');
          if (!inputElem && block) inputElem = block.querySelector('.' + targetInputClass);
          if (!inputElem) inputElem = document.getElementById(targetInputClass) || document.querySelector('.' + targetInputClass);

          if (inputElem) {
            inputElem.value = compressedDataURL;
            updateImagePreview(inputElem);
            inputElem.dispatchEvent(new Event('input', { bubbles: true }));
            inputElem.dispatchEvent(new Event('change', { bubbles: true }));
          }

          if (statusElem) {
            statusElem.innerHTML = '<i class="fa-solid fa-check text-emerald-600"></i> Carregada!';
            statusElem.className = "text-xs text-emerald-600 font-bold flex items-center gap-1";
            setTimeout(function() { if (statusElem) statusElem.innerHTML = ''; }, 3000);
          }
          fileInputElem.value = '';
        };

        img.onerror = function() {
          if (statusElem) {
            statusElem.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-600"></i> Error en la imatge';
            statusElem.className = "text-xs text-red-600 font-bold flex items-center gap-1";
          }
          fileInputElem.value = '';
        };

        img.src = e.target.result;
      };

      reader.readAsDataURL(file);
    }

    function changeReaderFontSize(delta) {

    function setReaderTheme(theme) {
      readerTheme = theme;
      const box = document.getElementById('reading-text-box');
      if (!box) return;
      box.classList.remove('bg-sepia', 'bg-dark-mode', 'bg-slate-50', 'text-slate-700');

      else if (theme === 'dark') box.classList.add('bg-dark-mode');
      else box.classList.add('bg-slate-50', 'text-slate-700');
    }

    function toggleSpeechSynthesis() {
      if (!('speechSynthesis' in window)) {
        alert("El teu navegador no suporta la síntesi de veu.");
        return;
      }
      if (isSpeaking && !isSpeechPaused) {
        window.speechSynthesis.pause();
        isSpeechPaused = true;
        updateSpeechUI();
        return;
      }
      if (isSpeaking && isSpeechPaused) {
        window.speechSynthesis.resume();
        isSpeechPaused = false;
        updateSpeechUI();
        return;
      }
      stopSpeechSynthesis();
      const textElem = document.getElementById('reading-text-box') || document.getElementById('visual-reading-transcript');
      if (!textElem) return;

      currentTextToRead = textElem.innerText.trim();
      if (!currentTextToRead) return;

      speechUtterance = new SpeechSynthesisUtterance(currentTextToRead);
      speechUtterance.lang = 'ca-ES';
      speechUtterance.rate = speechRate;

      const voices = window.speechSynthesis.getVoices();
      const caVoice = voices.find(function(v) { return v.lang.startsWith('ca'); });
      if (caVoice) speechUtterance.voice = caVoice;

      speechUtterance.onstart = function() { isSpeaking = true; isSpeechPaused = false; updateSpeechUI(); };
      speechUtterance.onend = function() { stopSpeechSynthesis(); };
      speechUtterance.onerror = function() { stopSpeechSynthesis(); };

      window.speechSynthesis.speak(speechUtterance);
    }

    function stopSpeechSynthesis() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isSpeaking = false;
      isSpeechPaused = false;
      updateSpeechUI();
    }

    function changeSpeechRate(rate) {
      speechRate = parseFloat(rate);
      if (isSpeaking) { toggleSpeechSynthesis(); toggleSpeechSynthesis(); }
    }

    function updateSpeechUI() {
      const btnPlay = document.getElementById('btn-speech-play');
      const btnStop = document.getElementById('btn-speech-stop');

      if (btnPlay) {
        if (isSpeaking && !isSpeechPaused) {
          btnPlay.innerHTML = '<i class="fa-solid fa-pause text-amber-300"></i> Pausa';
          btnPlay.className = "px-3 py-1 text-xs font-bold rounded-lg bg-amber-600 text-white border border-amber-700 shadow-xs flex items-center gap-1.5";
        } else if (isSpeaking && isSpeechPaused) {
          btnPlay.innerHTML = '<i class="fa-solid fa-play text-white"></i> Reprendre';
          btnPlay.className = "px-3 py-1 text-xs font-bold rounded-lg bg-emerald-600 text-white border border-emerald-700 shadow-xs flex items-center gap-1.5";
        } else {
          btnPlay.innerHTML = '<i class="fa-solid fa-volume-high text-indigo-200"></i> Escolta';
          btnPlay.className = "px-3 py-1 text-xs font-bold rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white border border-indigo-700 shadow-xs flex items-center gap-1.5";
        }
      }
      if (btnStop) {
        if (isSpeaking) btnStop.classList.remove('hidden');
        else btnStop.classList.add('hidden');
      }
    }

    const QuestionEngine = {
      render: function(qDocId, qData, qIndex, totalQuestions, glossaryWords) {
        totalQuestions = totalQuestions || 0;
        glossaryWords = glossaryWords || [];
        const type = qData.questionType || 'single';
        const imgMode = qData.imageSelectionMode || 'single';
        const taxonomy = qData.taxonomyType || 'literal';
        const taxConfig = TAXONOMY_CONFIG[taxonomy] || TAXONOMY_CONFIG.literal;

        let text = qData.questionText || qData.pregunta || ("Pregunta " + (qIndex + 1));
        text = parseContentWithGlossary(text, glossaryWords);
        const options = (qData.options || qData.opcions || []).filter(function(o) { return o !== null && o !== undefined && o !== ''; });

        let badgeHTML = '';
        if (type === 'multiple') badgeHTML = '<span class="text-[11px] font-bold text-purple-700 bg-purple-100 border border-purple-200 px-2 py-0.5 rounded-md shrink-0">☑️ Opció Múltiple (' + options.length + ' opcions)</span>';
        else if (type === 'opinion') badgeHTML = '<span class="text-[11px] font-bold text-blue-700 bg-blue-100 border border-blue-200 px-2 py-0.5 rounded-md shrink-0">💬 Reflexió / Opinió</span>';
        else if (type === 'ordering') badgeHTML = '<span class="text-[11px] font-bold text-amber-800 bg-amber-100 border border-amber-300 px-2 py-0.5 rounded-md shrink-0">↕️ Ordenació (' + options.length + ' fets)</span>';
        else if (type === 'image_single') {
          const modeLabel = imgMode === 'multiple' ? '☑️ Múltiple' : (imgMode === 'opinion' ? '💬 Opinió' : '');
          badgeHTML = '<span class="text-[11px] font-bold text-teal-800 bg-teal-100 border border-teal-300 px-2 py-0.5 rounded-md shrink-0">🖼️ Imatges ' + modeLabel + '</span>';
        }

                  ${letterBadge}
                  <span class="text-sm text-slate-700 font-medium">${optParsed}</span>
                </label>
              `;
            }
          });
        }

        const progressIndicator = totalQuestions > 0 ? '<span class="text-xs text-indigo-600 font-extrabold bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-100">Pregunta ' + (qIndex + 1) + ' de ' + totalQuestions + '</span>' : '';

        return `
          <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">

      evaluate: function(qData, qDocId, formData) {
        const type = qData.questionType || 'single';
        const imgMode = qData.imageSelectionMode || 'single';

        if (type === 'text_input') {
          const userText = formData.get('q_' + qDocId) || '';
          const normUser = normalizeText(userText);
          if (!normUser) return false;

          let keywords = [];
          if (Array.isArray(qData.keywords)) keywords = qData.keywords;
          else if (typeof qData.keywords === 'string') keywords = qData.keywords.split(',').map(function(k) { return k.trim(); });
          else if (qData.correctAnswerText) keywords = [qData.correctAnswerText];

          if (keywords.length === 0) return true;
          return keywords.some(function(kw) { return normUser.includes(normalizeText(kw)); });
        } else if (type === 'ordering') {
          const val = formData.get('q_' + qDocId);
          if (!val) return false;
          const userSequence = val.split(',').map(function(v) { return parseInt(v); });
          return userSequence.every(function(v, idx) { return v === idx; });
        } else if (type === 'opinion' || (type === 'image_single' && imgMode === 'opinion')) {
          const selected = formData.get('q_' + qDocId);
          return selected !== null && selected !== undefined;
        } else if (type === 'multiple' || (type === 'image_single' && imgMode === 'multiple')) {
          const selectedVals = formData.getAll('q_' + qDocId).map(function(v) { return parseInt(v); }).sort();
          let correctVals = [];
          if (Array.isArray(qData.correctAnswers)) correctVals = qData.correctAnswers.map(function(v) { return parseInt(v); }).sort();
          else if (qData.correctAnswer !== undefined) correctVals = [parseInt(qData.correctAnswer)];
          return selectedVals.length === correctVals.length && selectedVals.every(function(val, idx) { return val === correctVals[idx]; });
        } else {
          const selected = parseInt(formData.get('q_' + qDocId));
          const correct = qData.correctAnswer !== undefined ? parseInt(qData.correctAnswer) : 0;
          return selected === correct;
        }
      }
    };

    function moveOrderItem(btn, dir) {
      const item = btn.closest('.ordering-item');
      const container = item.parentNode;
      const items = Array.from(container.children);
      const currentIdx = items.indexOf(item);
      const targetIdx = currentIdx + dir;

      if (targetIdx >= 0 && targetIdx < items.length) {
        if (dir === -1) container.insertBefore(item, items[targetIdx]);
        else container.insertBefore(item, items[targetIdx].nextSibling);

        const updatedItems = Array.from(container.children);
        updatedItems.forEach(function(it, idx) {
          it.querySelector('.pos-badge').innerText = (idx + 1) + 'º';
        });
        const hiddenInput = container.parentNode.querySelector('input[type="hidden"]');
        if (hiddenInput) {
          hiddenInput.value = updatedItems.map(function(it) { return it.getAttribute('data-original-idx'); }).join(',');
        }
      }
    }

    async function loadUserData() {
      if (!currentUser || !db) return;
      try {
        const doc = await withTimeout(db.collection("users").doc(currentUser.uid).get(), 5000, "perfil d'usuari");
        if (doc.exists) {
          const data = doc.data();
          userPoints = data.points !== undefined ? data.points : 0;
          let role = data.role || 'alumne';
          if (role === 'mestre') role = 'docent';
          if (currentUser.email === ADMIN_SUPREMO_EMAIL && role === 'alumne') role = 'docent';
          userRole = role;
          userCompletedReadings = data.completedReadings || [];
          userScores = data.scores || {};
          userTaxonomyStats = Object.assign({ literal: 0, inferential: 0, figurative: 0, opinion: 0, creative: 0 }, data.taxonomyStats || {});
          userHasImprovedScore = !!data.hasImprovedScore;
          userDisplayName = data.displayName || "";
          userSchool = data.school || "";

                      ${durationLabel ? '<span class="text-[10px] bg-slate-100 text-slate-700 font-extrabold px-2 py-0.5 rounded-md border border-slate-200">' + durationLabel + '</span>' : ''}
                      <span class="text-[10px] bg-amber-100 text-amber-900 border border-amber-300 font-extrabold px-2.5 py-0.5 rounded-md shadow-xs">

    async function renderEditor(docIdToEdit, cloneFromDocId, mode) {
      docIdToEdit = docIdToEdit || null;
      cloneFromDocId = cloneFromDocId || null;
      mode = mode || 'questions';

      stopSpeechSynthesis();
      if (!currentUser) {
        renderLogin();
        return;
      }

      if (!isUserAdminOrCreator()) {
        alert("Accés restringit a Docents i Col·laboradors.");
        renderCatalog();
        return;
      }

      editingDocId = docIdToEdit;
      cloningParentId = cloneFromDocId;
      cloningMode = mode;

      const app = document.getElementById('app');
      app.innerHTML = '<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i><p class="mt-2 text-slate-500 font-medium">Carregant l\'editor...</p></div>';

      let initialData = {
        type: 'text',
        contentFormat: 'written',
        referenceImageUrl: '',
        title: '',
        bookAuthor: '',
        editorialOrSource: '',
        level: '1r cicle de primària',
        category: 'Aventura',
        estimatedTime: '10 min',
        bookPages: '',
        pointsPerQuestion: 1,
        content: '',
        imageUrl: '',
        readingNumber: null,
        glossary: [],
        parentReadingId: null,
        isAdaptedVersion: false
      };

      let initialQuestions = [];
      const targetDocId = editingDocId || cloningParentId;

      if (targetDocId) {
        try {
          const docSnap = await withTimeout(db.collection(DB_COLLECTION).doc(targetDocId).get(), 7000, "lectura a editar");
          if (docSnap.exists) {
            initialData = Object.assign({}, initialData, docSnap.data());
            let qSnap;
            try {
              qSnap = await withTimeout(db.collection(DB_COLLECTION).doc(targetDocId).collection(SUB_COLLECTION).orderBy('orderIndex', 'asc').get(), 6000, "preguntes");
            } catch (orderErr) {
              qSnap = await withTimeout(db.collection(DB_COLLECTION).doc(targetDocId).collection(SUB_COLLECTION).get(), 6000, "preguntes");
            }
            qSnap.forEach(function(qDoc) {
              initialQuestions.push(Object.assign({ id: qDoc.id }, qDoc.data()));
            });
            initialQuestions.sort(function(a, b) {
              return (a.orderIndex !== undefined ? a.orderIndex : 0) - (b.orderIndex !== undefined ? b.orderIndex : 0);
            });
          }
        } catch (err) {
          console.error("Error carregant la lectura per a l'editor:", err);
        }
      }

      if (cloningParentId) {
        const rootId = initialData.parentReadingId || cloningParentId;
        cloningParentId = rootId;
        initialData.parentReadingId = rootId;

        if (cloningMode === 'adapted') {
          initialData.title = (initialData.title || '').replace(/\s*\(Versió Adaptada.*\)/i, '') + ' (Versió Adaptada)';
          initialData.isAdaptedVersion = true;
        } else {
          initialData.title = (initialData.title || '') + ' (Bateria de preguntes)';
          initialData.isAdaptedVersion = false;
        }
      }

      const isAdaptedMode = (cloningParentId && cloningMode === 'adapted') || (editingDocId && initialData.isAdaptedVersion);
      const isReadOnlyText = cloningParentId && cloningMode === 'questions';
      const assignedCode = (editingDocId && initialData.readingNumber) ? formatReadingCode(initialData.readingNumber) : "Assignació automàtica en publicar";
      const currentContentFormat = initialData.contentFormat || 'written';
      const currentRefImg = initialData.referenceImageUrl || '';
      const rootIdForAdaptation = initialData.parentReadingId || editingDocId;

      const taxonomyGuideHTML = `
        <div class="bg-indigo-50/70 border border-indigo-200 p-4 rounded-2xl mb-6 shadow-xs space-y-2.5">

            <span class="text-[11px] font-bold text-indigo-700 bg-indigo-100/80 px-2 py-0.5 rounded-md border border-indigo-200">

            </span>

          <p class="text-xs text-indigo-900 leading-relaxed">
            Per estimular una comprensió lectora profunda i variada, et recomanem combinar <strong>diferents tipologies cognitives</strong> (i formats com opció única, múltiple, ordenació, visual o resposta oberta) al llarg del qüestionari:

    function insertGlossaryLink() {
      const textarea = document.getElementById('editor-content');
      if (!textarea) return;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selectedText = textarea.value.substring(start, end) || "paraula";
      const replacement = "[" + selectedText + "](#glossari-section)";
      textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
      textarea.focus();
    }

    function addGlossaryField(item) {
      const container = document.getElementById('glossary-container');
      if (!container) return;

      const gWord = item ? (item.word || '') : '';
      const gDef = item ? (item.definition || '') : '';

      const div = document.createElement('div');
      div.className = "glossary-item flex items-center gap-2 bg-white p-2 rounded-xl border border-teal-200 shadow-2xs";
      div.innerHTML = '<input type="text" value="' + escapeHtmlAttr(gWord) + '" placeholder="Mot o Concepte" class="g-word w-1/3 p-1.5 border border-slate-300 rounded-lg text-xs font-bold text-teal-900 outline-none">' +
        '<input type="text" value="' + escapeHtmlAttr(gDef) + '" placeholder="Definició breu i senzilla..." class="g-def w-2/3 p-1.5 border border-slate-300 rounded-lg text-xs outline-none">' +

      container.appendChild(div);

      const wrapDurBook = document.getElementById('wrapper-duration-book');
      const contentInput = document.getElementById('editor-content');
      const refImgInput = document.getElementById('editor-ref-image');
      const labelContent = document.getElementById('label-editor-content');
      const hintTranscript = document.getElementById('hint-transcript-audio');
      const btnGlossary = document.getElementById('btn-insert-glossary');
      const labelSource = document.getElementById('label-editorial-source');
      const isAdapted = document.getElementById('editor-is-adapted') && document.getElementById('editor-is-adapted').value === 'true';

      if (type === 'book') {
        if (wrapFormat) wrapFormat.classList.add('hidden');
        if (wrapRefImg) wrapRefImg.classList.add('hidden');
        if (refImgInput) refImgInput.removeAttribute('required');
        wrapContent.classList.add('hidden');
        if (contentInput) contentInput.removeAttribute('required');
        wrapImage.classList.remove('hidden');
        wrapDurText.classList.add('hidden');
        wrapDurBook.classList.remove('hidden');
        if (labelSource) labelSource.innerText = "Editorial / Any d'Edició";
      } else {
        if (wrapFormat) wrapFormat.classList.remove('hidden');
        wrapImage.classList.add('hidden');
        wrapDurText.classList.remove('hidden');
        wrapDurBook.classList.add('hidden');
        if (labelSource) labelSource.innerText = "Font / Referència Legal o Enllaç";

        if (contentFormat === 'image') {
          if (wrapRefImg) wrapRefImg.classList.remove('hidden');
          if (refImgInput) refImgInput.setAttribute('required', 'true');
          wrapContent.classList.remove('hidden');
          if (contentInput) {
            contentInput.removeAttribute('required');
            contentInput.rows = 3;
            contentInput.placeholder = "Opcional: escriu aquí el text de la imatge per activar la lectura en veu alta...";
          }
          if (labelContent) labelContent.innerText = "Transcripció per a Síntesi de Veu / Text Alternatiu (Opcional)";
          if (hintTranscript) hintTranscript.classList.remove('hidden');
          if (btnGlossary) btnGlossary.classList.add('hidden');
        } else {
          if (wrapRefImg) wrapRefImg.classList.add('hidden');
          if (refImgInput) refImgInput.removeAttribute('required');
          wrapContent.classList.remove('hidden');
          if (contentInput) {
            contentInput.setAttribute('required', 'true');
            contentInput.rows = 6;
            contentInput.placeholder = "Escriu aquí el text de la lectura...";
          }
          if (labelContent) {
            labelContent.innerText = isAdapted ? "Text Simplificat / Adaptat (Escurça i adapta el text original) *" : "Text de la Lectura *";
          }
          if (hintTranscript) hintTranscript.classList.add('hidden');
          if (btnGlossary) btnGlossary.classList.remove('hidden');
        }
      }
    }

    function toggleExtraOptions(btn) {
      const block = btn.closest('.q-block');
      const extraBox = block.querySelector('.q-extra-opts-box');
      const choiceEF = block.querySelectorAll('.opt-ef-choice');
      const multiEF = block.querySelectorAll('.opt-ef-multi');
      const isHidden = extraBox.classList.contains('hidden');

      if (isHidden) {
        extraBox.classList.remove('hidden');
        choiceEF.forEach(function(el) { el.classList.remove('hidden'); });
        multiEF.forEach(function(el) { el.classList.remove('hidden'); });
        btn.innerHTML = '<i class="fa-solid fa-minus"></i> <span>Ocultar opcions E i F</span>';
      } else {
        extraBox.classList.add('hidden');
        choiceEF.forEach(function(el) { el.classList.add('hidden'); });
        multiEF.forEach(function(el) { el.classList.add('hidden'); });
        btn.innerHTML = '<i class="fa-solid fa-plus"></i> <span>Afegir opcions E i F (fins a 6)</span>';
        block.querySelector('.q-opt-4').value = '';
        block.querySelector('.q-opt-5').value = '';
      }
    }

    function updateImagePreview(inputElem) {
      const block = inputElem.closest('.q-block');
      if (!block) return;
      const optMatch = inputElem.className.match(/q-opt-(\d)/);
      if (optMatch && optMatch[1] !== undefined) {
        const optIdx = optMatch[1];
        const img = block.querySelector('.img-preview-' + optIdx);
        if (img) img.src = inputElem.value.trim() || ('https://via.placeholder.com/100?text=' + ['A','B','C','D','E','F'][optIdx]);
      }
    }

    function removeQuestionField(btn) {
      btn.closest('.q-block').remove();
      updateQuestionIndexes();
    }

    function moveQuestionUp(btn) {
      const currentBlock = btn.closest('.q-block');
      const prevBlock = currentBlock.previousElementSibling;
      if (prevBlock) {
        currentBlock.parentNode.insertBefore(currentBlock, prevBlock);
        updateQuestionIndexes();
      }
    }

    function moveQuestionDown(btn) {
      const currentBlock = btn.closest('.q-block');
      const nextBlock = currentBlock.nextElementSibling;
      if (nextBlock) {
        currentBlock.parentNode.insertBefore(nextBlock, currentBlock);
        updateQuestionIndexes();
      }
    }

    function updateQuestionIndexes() {
      const blocks = document.querySelectorAll('#questions-container .q-block');
      blocks.forEach(function(block, idx) {
        const badge = block.querySelector('.q-number-badge');
        const label = block.querySelector('.q-number-label');
        if (badge) badge.innerText = idx + 1;
        if (label) label.innerText = 'Pregunta ' + (idx + 1);
      });
      const badge = document.getElementById('question-count-badge');
      if (badge) badge.innerText = blocks.length;
    }

    function toggleQuestionAnswerType(elem) {
      const block = elem.closest('.q-block');
      const mainType = block.querySelector('.q-type-select').value;
      const imgModeSelect = block.querySelector('.q-img-mode-select');
      const imgMode = imgModeSelect ? imgModeSelect.value : 'single';

      const optionsWrapper = block.querySelector('.q-options-wrapper');
      const singleBox = block.querySelector('.q-single-box');
      const singleLabel = block.querySelector('.q-single-label');
      const multiBox = block.querySelector('.q-multiple-box');
      const opinionBox = block.querySelector('.q-opinion-box');
      const orderingBox = block.querySelector('.q-ordering-box');
      const textInputBox = block.querySelector('.q-text-input-box');
      const imagePreviewsBox = block.querySelector('.q-image-previews-box');
      const uploadContainers = block.querySelectorAll('.q-upload-btn-container');
      const badges = block.querySelectorAll('.opt-label-badge');

      optionsWrapper.classList.remove('hidden');
      singleBox.classList.add('hidden');
      multiBox.classList.add('hidden');
      opinionBox.classList.add('hidden');
      orderingBox.classList.add('hidden');
      if (imgModeSelect) imgModeSelect.classList.add('hidden');
      if (textInputBox) textInputBox.classList.add('hidden');
      if (imagePreviewsBox) imagePreviewsBox.classList.add('hidden');

      uploadContainers.forEach(function(c) { c.classList.add('hidden'); });

      const isOrdering = mainType === 'ordering';
      const isImage = mainType === 'image_single';
      const isTextInput = mainType === 'text_input';

      if (isTextInput) {
        optionsWrapper.classList.add('hidden');
        if (textInputBox) textInputBox.classList.remove('hidden');
        return;
      }

      badges.forEach(function(b, idx) {
        const labelsLetter = ['A', 'B', 'C', 'D', 'E', 'F'];
        const labelsOrder = ['1r', '2n', '3r', '4t', '5è', '6è'];
        b.innerText = isOrdering ? labelsOrder[idx] : labelsLetter[idx];
      });

      for (let i = 0; i < 6; i++) {
        const input = block.querySelector('.q-opt-' + i);
        if (input) {
          if (isImage) input.placeholder = 'URL o imatge ' + ['A','B','C','D','E','F'][i] + '...';
          else if (isOrdering) input.placeholder = ['1r','2n','3r','4t','5è','6è'][i] + ' fet que passa';
          else input.placeholder = 'Opció ' + ['A','B','C','D','E','F'][i];
        }
      }

      if (mainType === 'multiple') {
        multiBox.classList.remove('hidden');
      } else if (mainType === 'opinion') {
        opinionBox.classList.remove('hidden');
      } else if (mainType === 'ordering') {
        orderingBox.classList.remove('hidden');
      } else if (isImage) {
        if (imgModeSelect) imgModeSelect.classList.remove('hidden');
        if (imagePreviewsBox) imagePreviewsBox.classList.remove('hidden');
        uploadContainers.forEach(function(c) { c.classList.remove('hidden'); });

        if (imgMode === 'multiple') {
          multiBox.classList.remove('hidden');
        } else if (imgMode === 'opinion') {
          opinionBox.classList.remove('hidden');
        } else {
          singleBox.classList.remove('hidden');
          if (singleLabel) singleLabel.innerText = "Quina és la imatge correcta?";
        }
      } else {
        singleBox.classList.remove('hidden');
        if (singleLabel) singleLabel.innerText = "Quina és la resposta correcta?";
      }
    }

    async function saveReading(e) {
      e.preventDefault();
      const type = document.getElementById('editor-type').value || 'text';
      const contentFormat = type === 'text' ? (document.getElementById('editor-content-format').value || 'written') : 'book';
      const referenceImageUrl = (type === 'text' && contentFormat === 'image') ? (document.getElementById('editor-ref-image').value.trim() || '') : '';
      const title = document.getElementById('editor-title').value;
      const bookAuthor = document.getElementById('editor-book-author').value || '';
      const editorialOrSource = document.getElementById('editor-source').value || '';
      const level = document.getElementById('editor-level').value;
      const category = document.getElementById('editor-category').value || 'General';
      const estimatedTime = document.getElementById('editor-duration').value || '10 min';
      const bookPages = document.getElementById('editor-book-pages').value || '';
      const pointsPerQuestion = parseInt(document.getElementById('editor-points-per-q').value || 1);
      const content = document.getElementById('editor-content').value || '';
      const imageUrl = document.getElementById('editor-image').value || '';
      const isAdaptedVersion = document.getElementById('editor-is-adapted').value === 'true';

      if (type === 'text' && contentFormat === 'image' && !referenceImageUrl) {
        alert("Si us plau, puja una imatge de referència o enganxa'n l'enllaç abans de desar.");
        return;
      }

      const glossary = [];
      document.querySelectorAll('#glossary-container .glossary-item').forEach(function(item) {
        const w = item.querySelector('.g-word').value.trim();
        const d = item.querySelector('.g-def').value.trim();
        if (w && d) glossary.push({ word: w, definition: d });
      });

      const authorDisplayName = userDisplayName || (currentUser ? currentUser.email.split('@')[0] : "Creador/a");
      const authorSchool = userSchool || "";
      const authorEmail = currentUser ? currentUser.email : "";

      const qBlocks = document.querySelectorAll('.q-block');
      const totalQCount = qBlocks.length;

      try {
        let docId = editingDocId;

        if (editingDocId) {
          await db.collection(DB_COLLECTION).doc(editingDocId).update({
            type: type,
            contentFormat: contentFormat,
            referenceImageUrl: referenceImageUrl,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            estimatedTime: estimatedTime,
            bookPages: bookPages,
            pointsPerQuestion: pointsPerQuestion,
            questionCount: totalQCount,
            content: content,
            imageUrl: imageUrl,
            glossary: glossary,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          const oldQ = await db.collection(DB_COLLECTION).doc(editingDocId).collection(SUB_COLLECTION).get();
          for (const qDoc of oldQ.docs) {
            await qDoc.ref.delete();
          }
        } else {
          if (isUserAdminOrCreator()) {
            userPoints += 1;
            await db.collection("users").doc(currentUser.uid).set({ points: userPoints }, { merge: true });
          }

          const countSnap = await db.collection(DB_COLLECTION).get();
          const nextNum = countSnap.size + 1;

          const docRef = await db.collection(DB_COLLECTION).add({
            type: type,
            contentFormat: contentFormat,
            referenceImageUrl: referenceImageUrl,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            estimatedTime: estimatedTime,
            bookPages: bookPages,
            pointsPerQuestion: pointsPerQuestion,
            questionCount: totalQCount,
            content: content,
            imageUrl: imageUrl,
            readingNumber: nextNum,
            glossary: glossary,
            parentReadingId: cloningParentId || null,
            isAdaptedVersion: isAdaptedVersion,
            authorUid: currentUser ? currentUser.uid : null,
            authorDisplayName: authorDisplayName,
            authorSchool: authorSchool,
            authorEmail: authorEmail,
            authorPoints: userPoints,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          docId = docRef.id;
        }

        let orderIndex = 0;

        for (const block of qBlocks) {
          const qText = block.querySelector('.q-text').value;
          const qType = block.querySelector('.q-type-select').value || 'single';
          const imgMode = block.querySelector('.q-img-mode-select').value || 'single';
          const taxonomyType = block.querySelector('.q-taxonomy-select').value || 'literal';

          if (qType === 'text_input') {
            const rawKw = block.querySelector('.q-keywords-input').value || '';
            const keywordsArr = rawKw.split(',').map(function(k) { return k.trim(); }).filter(function(k) { return k.length > 0; });

            if (qText) {
              await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add({
                questionText: qText,
                options: [],
                questionType: 'text_input',
                taxonomyType: taxonomyType,
                keywords: keywordsArr,
                orderIndex: orderIndex
              });
              orderIndex++;
            }
          } else {
            const options = [];
            for (let i = 0; i < 6; i++) {
              const optEl = block.querySelector('.q-opt-' + i);
              const optVal = optEl ? optEl.value : '';
              if (optVal.trim()) options.push(optVal.trim());
            }

            if (qText && options.length >= 2) {
              const baseQData = {
                questionText: qText,
                options: options,
                questionType: qType,
                imageSelectionMode: imgMode,
                taxonomyType: taxonomyType,
                orderIndex: orderIndex
              };

              if (qType === 'opinion' || qType === 'ordering' || (qType === 'image_single' && imgMode === 'opinion')) {
                await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add(baseQData);
              } else if (qType === 'multiple' || (qType === 'image_single' && imgMode === 'multiple')) {
                const multiCheckboxes = block.querySelectorAll('.q-correct-multi:checked');
                const correctAnswers = Array.from(multiCheckboxes).map(function(cb) { return parseInt(cb.value); });

                await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add(Object.assign({}, baseQData, {
                  correctAnswers: correctAnswers.length > 0 ? correctAnswers : [0]
                }));
              } else {
                const correctSelect = block.querySelector('.q-correct-single');
                const correctIdx = correctSelect ? parseInt(correctSelect.value) : 0;

                await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add(Object.assign({}, baseQData, {
                  correctAnswer: correctIdx
                }));
              }
              orderIndex++;
            }
          }
        }

        editingDocId = null;
        cloningParentId = null;
        cloningMode = 'questions';
        await loadUserData();
        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error en desar la lectura: " + err.message);
      }
    }

    function parseContentWithGlossary(rawText, glossaryList) {
      if (!rawText) return '';
      let processed = rawText;
      processed = processed.replace(/\[([^\]]+)\]\(#glossari-section\)/g, function(match, word) {
        return '<a href="#glossari-section" onclick="scrollToGlossary(event)" class="text-indigo-600 font-bold border-b-2 border-indigo-400 hover:text-indigo-800 transition" title="Consultar glossari">' + word + '</a>';
      });
      if (Array.isArray(glossaryList) && glossaryList.length > 0) {
        glossaryList.forEach(function(g) {
          if (g.word && g.word.trim()) {
            const wordToFind = g.word.trim();
            const regex = new RegExp('\\b(' + wordToFind + ')\\b(?![^<]*>|[^[]*])', 'gi');
            processed = processed.replace(regex, '<a href="#glossari-section" onclick="scrollToGlossary(event)" class="text-indigo-600 font-bold border-b-2 border-indigo-400 hover:text-indigo-800 transition" title="Consultar al Glossari">$1</a>');
          }
        });
      }
      return processed;
    }

    async function submitQuiz(e, docId, pointsPerQuestion) {
      e.preventDefault();
      pointsPerQuestion = pointsPerQuestion || 1;
      if (!currentUser) { renderLogin(); return; }

      const form = e.target;
      const formData = new FormData(form);

      let questionsSnap;
      try {
        questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).orderBy('orderIndex', 'asc').get();
      } catch (err) {
        questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
      }

      let score = 0;
      let total = questionsSnap.size;
      const stats = {
        literal: { correct: 0, total: 0 },
        inferential: { correct: 0, total: 0 },
        figurative: { correct: 0, total: 0 },
        opinion: { correct: 0, total: 0 },
        creative: { correct: 0, total: 0 }
      };

      questionsSnap.forEach(function(qDoc) {
        const q = qDoc.data() || {};
        const taxKey = q.taxonomyType || 'literal';
        if (!stats[taxKey]) stats[taxKey] = { correct: 0, total: 0 };
        stats[taxKey].total++;
        if (QuestionEngine.evaluate(q, qDoc.id, formData)) {
          score++;
          stats[taxKey].correct++;
        }
      });

      const newQuizPoints = score * pointsPerQuestion;
      const maxPossiblePoints = total * pointsPerQuestion;

      let localScores = {};
      let localTaxStats = { literal: 0, inferential: 0, figurative: 0, opinion: 0, creative: 0 };
      let localHasImproved = userHasImprovedScore;
      let wasAlreadyCompleted = userCompletedReadings.includes(docId);

      try {
        const userDoc = await db.collection("users").doc(currentUser.uid).get();
        if (userDoc.exists) {
          const uData = userDoc.data();
          localScores = uData.scores || {};
          localTaxStats = Object.assign(localTaxStats, uData.taxonomyStats || {});
          if (uData.hasImprovedScore) localHasImproved = true;
          if (Array.isArray(uData.completedReadings) && uData.completedReadings.includes(docId)) {
            wasAlreadyCompleted = true;
          }
        }
      } catch (err) {}

      const previousQuizPoints = localScores[docId] || 0;
      let pointsToAdd = 0;

      if (newQuizPoints > previousQuizPoints) {
        if (wasAlreadyCompleted && previousQuizPoints > 0) {
          localHasImproved = true;
        }
        pointsToAdd = newQuizPoints - previousQuizPoints;
        localScores[docId] = newQuizPoints;
        userPoints += pointsToAdd;
      }

      // Acumulem encerts per taxonomia al perfil del lector
      Object.keys(stats).forEach(function(tKey) {
        if (stats[tKey] && stats[tKey].correct > 0) {
          localTaxStats[tKey] = (localTaxStats[tKey] || 0) + stats[tKey].correct;
        }
      });

      userScores = localScores;
      userTaxonomyStats = localTaxStats;
      userHasImprovedScore = localHasImproved;

      if (!userCompletedReadings.includes(docId)) userCompletedReadings.push(docId);

      try {
        await db.collection("users").doc(currentUser.uid).set({
          points: userPoints,
          completedReadings: userCompletedReadings,
          scores: localScores,
          taxonomyStats: localTaxStats,
          hasImprovedScore: localHasImproved
        }, { merge: true });
      } catch (err) {}

      await loadUserData();
      renderNav();
      renderFeedbackModal(score, total, newQuizPoints, maxPossiblePoints, pointsToAdd, stats);
    }

    function switchAuthTab(mode) {
      document.getElementById('auth-mode').value = mode;
      const extra = document.getElementById('register-extra-fields');
      const btnLogin = document.getElementById('tab-login-btn');
      const btnReg = document.getElementById('tab-register-btn');
      const submitBtn = document.getElementById('auth-submit-btn');

      if (mode === 'register') {
        extra.classList.remove('hidden');
        btnReg.className = "w-1/2 py-2 rounded-lg bg-white text-indigo-700 shadow-xs";
        btnLogin.className = "w-1/2 py-2 rounded-lg text-slate-600";
        submitBtn.innerText = "Registrar-me i Començar";
      } else {
        extra.classList.add('hidden');
        btnLogin.className = "w-1/2 py-2 rounded-lg bg-white text-indigo-700 shadow-xs";
        btnReg.className = "w-1/2 py-2 rounded-lg text-slate-600";
        submitBtn.innerText = "Entrar";
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      if (!auth) { alert("El servei d'autenticació no està disponible."); return; }
      const mode = document.getElementById('auth-mode').value;
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        if (mode === 'register') {
          const name = document.getElementById('auth-name').value || email.split('@')[0];
          const role = document.getElementById('auth-role').value || 'alumne';
          const school = document.getElementById('auth-school').value || '';

          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection("users").doc(cred.user.uid).set({
            email: email,
            displayName: name,
            role: role,
            school: school,
            points: 0,
            completedReadings: [],
            scores: {},
            taxonomyStats: { literal: 0, inferential: 0, figurative: 0, opinion: 0, creative: 0 },
            hasImprovedScore: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        document.getElementById('auth-modal-container').innerHTML = '';
      } catch (err) {
        alert("Error d'autenticació: " + err.message);
      }
    }

    function shareReadingLink(docId, readingCode) {
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = baseUrl + "?lectura=" + encodeURIComponent(docId);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(function() {
          alert("🔗 Enllaç copiat al porta-retalls (" + (readingCode || docId) + "):\n" + shareUrl);
        }).catch(function() {
          prompt("Copia aquest enllaç directe per compartir la lectura:", shareUrl);
        });
      } else {
        prompt("Copia aquest enllaç directe per compartir la lectura:", shareUrl);
      }
    }

    function shareFolderLink(folderId) {
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = baseUrl + "?carpeta=" + encodeURIComponent(folderId);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(function() {
          alert("📁 Enllaç de la Carpeta / SA copiat al porta-retalls:\n" + shareUrl);
        }).catch(function() {
          prompt("Copia aquest enllaç per compartir la carpeta:", shareUrl);
        });
      } else {
        prompt("Copia aquest enllaç per compartir la carpeta:", shareUrl);
      }
    }

    function shareToGoogleClassroom(docId, title) {
      const baseUrl = window.location.origin + window.location.pathname;
      const targetUrl = baseUrl + "?lectura=" + encodeURIComponent(docId);
      const classroomUrl = "https://classroom.google.com/share?url=" + encodeURIComponent(targetUrl) + "&title=" + encodeURIComponent("Lectura Aventura: " + (title || "Activitat de comprensió lectora"));
      window.open(classroomUrl, "_blank", "noopener,noreferrer");
    }
