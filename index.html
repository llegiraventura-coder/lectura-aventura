<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Aventura</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase JS SDK v9 (Compat version for single-file simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- NAVEGACIÓ SUPERIOR -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="navigate('catalog')">
        <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
        <span class="font-bold text-xl tracking-wide">Lectura Aventura</span>
      </div>
      <nav id="nav-actions" class="flex items-center space-x-4">
        <!-- Es renderitza dinàmicament segons l'estat d'autenticació -->
      </nav>
    </div>
  </header>

  <!-- CONTENIDOR PRINCIPAL -->
  <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6">
    <!-- Es carregaran dinàmicament les vistes -->
  </main>

  <footer class="bg-slate-800 text-slate-400 text-center py-4 text-sm mt-auto">
    <p>&copy; Lectura Aventura — Plataforma Educativa de Comprensió Lectora</p>
  </footer>

  <script>
    // --- CONFIGURACIÓ DE FIREBASE ---
    // Subsitueix aquestes claus per les de la teva consola de Firebase si cal
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKey_ReplaceWithYourActualKey",
      authDomain: "lectura-aventura.firebaseapp.com",
      projectId: "lectura-aventura",
      storageBucket: "lectura-aventura.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    // Inicialitza Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Col·lecció unificada Firestore
    const DB_COLLECTION = "lectures";

    // ESTAT GLOBAL
    let currentUser = null;
    let currentQuestions = [];

    // --- MANEGADOR D'AUTENTICACIÓ I NAVEGACIÓ ---
    auth.onAuthStateChanged(user => {
      currentUser = user;
      renderNav();
      if (!window.location.hash || window.location.hash === '#catalog') {
        renderCatalog();
      }
    });

    function renderNav() {
      const nav = document.getElementById('nav-actions');
      if (currentUser) {
        nav.innerHTML = `
          <button onclick="renderEditor()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-semibold px-3 py-1.5 rounded-lg text-sm transition">
            <i class="fa-solid fa-plus mr-1"></i> Nova Lectura
          </button>
          <div class="flex items-center space-x-2">
            <span class="text-sm font-medium text-indigo-100">${currentUser.email}</span>
            <button onclick="logout()" class="text-indigo-200 hover:text-white p-1">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="renderLogin()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-4 py-1.5 rounded-lg text-sm transition">
            Inicia Sessió
          </button>
        `;
      }
    }

    function logout() {
      auth.signOut().then(() => renderCatalog());
    }

    // --- VISTA 1: CATÀLEG DE LECTURES ---
    async function renderCatalog() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="text-center py-8">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600"></i>
          <p class="mt-2 text-slate-500">Carregant lectures de la base de dades...</p>
        </div>
      `;

      try {
        const snapshot = await db.collection(DB_COLLECTION).get();
        if (snapshot.empty) {
          app.innerHTML = `
            <div class="text-center py-12 bg-white rounded-2xl shadow-sm border border-slate-100">
              <i class="fa-solid fa-book-open-reader text-5xl text-slate-300 mb-3"></i>
              <h2 class="text-xl font-bold text-slate-700">Encara no hi ha cap lectura disponible</h2>
              <p class="text-slate-500 mt-1">Siguis el primer mestre en publicar-ne una!</p>
            </div>
          `;
          return;
        }

        let html = `
          <h1 class="text-2xl font-bold text-slate-800 mb-6 flex items-center">
            <i class="fa-solid fa-layer-group text-indigo-600 mr-2"></i> Catàleg de Lectures
          </h1>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        `;

        snapshot.forEach(doc => {
          const data = doc.data();
          const qCount = data.questions ? data.questions.length : 0;
          html += `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition">
              <div class="p-5 flex-grow">
                <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full">
                  ${data.level || 'General'}
                </span>
                <h3 class="font-bold text-lg text-slate-800 mt-2">${data.title}</h3>
                <p class="text-slate-600 text-sm mt-2 line-clamp-3">${data.content}</p>
              </div>
              <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                <span class="text-xs text-slate-500">
                  <i class="fa-solid fa-circle-question mr-1"></i> ${qCount} preguntes
                </span>
                <button onclick="renderReader('${doc.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs px-3 py-1.5 rounded-lg transition">
                  Llegir ara
                </button>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        app.innerHTML = html;
      } catch (err) {
        console.error("Error carregant el catàleg:", err);
        app.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg">Error carregant les dades: ${err.message}</div>`;
      }
    }

    // --- VISTA 2: LECTOR INTERACTIU I PREGUNTES ---
    async function renderReader(docId) {
      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600"></i></div>`;

      try {
        const doc = await db.collection(DB_COLLECTION).doc(docId).get();
        if (!doc.exists) {
          app.innerHTML = `<p class="text-red-500">Lectura no trobada.</p>`;
          return;
        }

        const data = doc.data();
        const questions = data.questions || [];

        let questionsHTML = '';
        if (questions.length > 0) {
          questionsHTML = `
            <form id="quiz-form" onsubmit="submitQuiz(event, '${docId}',${questions.length})" class="mt-8 pt-6 border-t border-slate-200">
              <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa-solid fa-list-check text-indigo-600 mr-2"></i> Preguntes de Comprensió Obligatòries
              </h2>
          `;

          questions.forEach((q, idx) => {
            questionsHTML += `
              <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="font-semibold text-slate-800 mb-3">${idx + 1}.${q.questionText}</p>
                <div class="space-y-2">
            `;
            q.options.forEach((opt, oIdx) => {
              questionsHTML += `
                <label class="flex items-center space-x-3 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/50 transition">
                  <input type="radio" name="q_${idx}" value="${oIdx}" required class="text-indigo-600 focus:ring-indigo-500">
                  <span class="text-sm text-slate-700">${opt}</span>
                </label>
              `;
            });
            questionsHTML += `</div></div>`;
          });

          questionsHTML += `
              <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">
                Enviar respostes i obtenir punts
              </button>
            </form>
          `;
        } else {
          questionsHTML = `<p class="mt-6 text-sm text-slate-500 italic">Aquesta lectura no té preguntes registrades.</p>`;
        }

        app.innerHTML = `
          <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
            <button onclick="renderCatalog()" class="text-slate-500 hover:text-slate-800 text-sm font-medium mb-4 inline-flex items-center">
              <i class="fa-solid fa-arrow-left mr-1"></i> Tornar al catàleg
            </button>
            <h1 class="text-3xl font-bold text-slate-900 mb-4">${data.title}</h1>
            <div class="prose max-w-none text-slate-700 leading-relaxed text-lg whitespace-pre-line mb-6">
              ${data.content}
            </div>
            ${questionsHTML}
            <div id="quiz-result" class="mt-4 hidden"></div>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    async function submitQuiz(e, docId, totalQ) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      
      const doc = await db.collection(DB_COLLECTION).doc(docId).get();
      const questions = doc.data().questions;

      let score = 0;
      questions.forEach((q, idx) => {
        const selected = parseInt(formData.get(`q_${idx}`));
        if (selected === q.correctAnswer) {
          score++;
        }
      });

      const points = score * 10;
      const resultDiv = document.getElementById('quiz-result');
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `
        <div class="p-4 bg-emerald-100 border border-emerald-300 text-emerald-800 rounded-xl text-center">
          <i class="fa-solid fa-award text-3xl mb-1"></i>
          <h3 class="font-bold text-lg">Molt bé! Has encertat ${score} de${totalQ} preguntes.</h3>
          <p class="text-sm font-medium">Has guanyat +${points} punts d'aventura!</p>
        </div>
      `;
    }

    // --- VISTA 3: EDITOR I CREADOR DE PREGUNTES ---
    function renderEditor() {
      if (!currentUser) {
        renderLogin();
        return;
      }

      currentQuestions = [];
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
          <h1 class="text-2xl font-bold text-slate-800 mb-6 flex items-center">
            <i class="fa-solid fa-pen-to-square text-indigo-600 mr-2"></i> Crear Nova Lectura
          </h1>
          <form onsubmit="saveReading(event)" class="space-y-5">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1">Títol de la Lectura *</label>
              <input type="text" id="editor-title" required class="
