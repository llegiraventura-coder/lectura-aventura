          '<strong>⚠️ Error detectat:</strong> ' + msg +

      var reason = event.reason ? (event.reason.message || String(event.reason)) : 'Error en promesa';

    function escapeHtmlAttr(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function formatReadingCode(num) {

    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("Temps d'espera esgotat carregant " + label)), ms))
      ]);
    }

    function parseContentWithGlossary(content, glossary) {
      if (!content) return '';
      if (!glossary || !Array.isArray(glossary) || glossary.length === 0) return content;

      let result = content;
      const validTerms = glossary.filter(g => g && g.term && g.term.trim().length > 0);
      validTerms.sort((a, b) => b.term.length - a.term.length);

      validTerms.forEach((item, idx) => {
        const term = item.term.trim();
        const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(?<!<[^>]*)\\b(${escapedTerm})\\b(?![^<]*>)`, 'gi');
        result = result.replace(regex, `<span class="glossary-term" onclick="scrollToGlossary(${idx})" title="Clica per veure el significat al glossari">$1</span>`);
      });

      return result;
    }

    function scrollToGlossary(idx) {
      const target = document.getElementById('glossary-item-' + idx);

        target.classList.remove('glossary-highlight');
        void target.offsetWidth;
        target.classList.add('glossary-highlight');
      }
    }

    const QuestionEngine = {
      normalize: function(str) {
        if (!str) return "";
        return String(str).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'¿¡]/g, " ").replace(/\s+/g, " ").trim();
      },
      extractKeywords: function(expectedAnswer) {
        if (!expectedAnswer) return [];
        if (expectedAnswer.includes('|')) {
          return expectedAnswer.split('|').map(k => this.normalize(k)).filter(k => k.length > 0);
        }
        const stopWords = new Set(['el', 'la', 'els', 'les', 'un', 'una', 'uns', 'unes', 'de', 'del', 'dels', 'des', 'a', 'al', 'als', 'per', 'amb', 'sense', 'en', 'i', 'o', 'ni', 'que', 'es', 'son', 'era', 'eren', 'va', 'van', 'ser', 'estar', 'com', 'mes', 'molt', 'prou', 'ja', 'no', 'si', 'ho', 'hi', 'li', 'se', 'seu', 'seva', 'seus', 'seves', 'meu', 'teu', 'nostre', 'vostre', 'aquest', 'aquesta', 'aquell', 'aquella', 'perque']);
        const words = this.normalize(expectedAnswer).split(' ').filter(w => w.length >= 3 && !stopWords.has(w));
        return words.length > 0 ? words : [this.normalize(expectedAnswer)];
      },
      evaluate: function(q, qIndex, formElement) {
        const answerType = q.answerType || 'single';
        const cognitiveType = q.cognitiveType || 'literal';

        if (answerType === 'reflection' || cognitiveType === 'opinion') {
          const textarea = formElement.querySelector(`textarea[name="q_${qIndex}_text"]`);
          const userText = textarea ? textarea.value.trim() : '';
          const isValid = userText.length >= 8;
          return {
            isCorrect: isValid,
            feedbackMsg: isValid
              ? '✅ Resposta reflexiva enregistrada correctament! Has argumentat el teu punt de vista.'
              : '⚠️ Escriu una reflexió una mica més desenvolupada (mínim 8 caràcters) per validar aquesta pregunta d\'opinió.'
          };
        }

        if (answerType === 'multiple') {
          const checkedBoxes = Array.from(formElement.querySelectorAll(`input[name="q_${qIndex}"]:checked`)).map(cb => parseInt(cb.value, 10)).sort();
          const expectedIndices = Array.isArray(q.correctIndices) ? [...q.correctIndices].sort() : [q.correctIndex ?? 0];
          const isCorrect = checkedBoxes.length === expectedIndices.length && checkedBoxes.every((val, i) => val === expectedIndices[i]);
          const expectedLabels = expectedIndices.map(idx => q.options[idx]).join(' + ');
          return {
            isCorrect: isCorrect,
            feedbackMsg: isCorrect
              ? '✅ Fantàstic! Has marcat exactament totes les opcions correctes.'
              : `❌ No és del tot exacte. Les respostes correctes eren: "${expectedLabels}".`
          };
        }

        if (answerType === 'order') {
          const items = Array.from(formElement.querySelectorAll(`#order-list-${qIndex} [data-orig-index]`));
          const userOrder = items.map(el => parseInt(el.getAttribute('data-orig-index'), 10));
          const isCorrect = userOrder.every((val, idx) => val === idx);
          return {
            isCorrect: isCorrect,
            feedbackMsg: isCorrect
              ? '✅ Ordre cronològic perfecte!'
              : `❌ L'ordre correcte era: ${q.options.map((opt, idx) => `${idx + 1}. ${opt}`).join(' → ')}.`
          };
        }

        if (answerType === 'image_select') {
          const selected = formElement.querySelector(`input[name="q_${qIndex}"]:checked`);
          const selectedVal = selected ? parseInt(selected.value, 10) : -1;
          const correctIdx = q.correctIndex ?? 0;
          const isCorrect = selectedVal === correctIdx;
          const correctImg = (q.imageOptions && q.imageOptions[correctIdx]) ? q.imageOptions[correctIdx] : {};
          return {
            isCorrect: isCorrect,
            feedbackMsg: isCorrect
              ? '✅ Imatge correcta!'
              : `❌ La imatge correcta era l'opció ${correctIdx + 1}${correctImg.label ? ' (' + correctImg.label + ')' : ''}.`
          };
        }

        if (answerType === 'open') {
          const input = formElement.querySelector(`input[name="q_${qIndex}_open"]`);
          const rawUserAnswer = input ? input.value.trim() : '';
          const normUser = this.normalize(rawUserAnswer);
          const expectedRaw = q.expectedAnswer || (q.options && q.options[0]) || '';

          if (!normUser) {
            return { isCorrect: false, feedbackMsg: `❌ No has escrit cap resposta. Es buscava: "${expectedRaw}".` };
          }

          if (expectedRaw.includes('|')) {
            const alternatives = this.extractKeywords(expectedRaw);
            const isCorrect = alternatives.some(alt => normUser === alt || normUser.includes(alt));
            return {
              isCorrect: isCorrect,
              feedbackMsg: isCorrect
                ? `✅ Correcte! Resposta vàlida.`
                : `❌ Resposta incorrecta. Es considerava vàlid: "${expectedRaw.split('|').join(' o ')}".`
            };
          }

          const keywords = this.extractKeywords(expectedRaw);
          const matchedCount = keywords.filter(kw => normUser.includes(kw)).length;
          const isCorrect = keywords.length > 0 && (matchedCount / keywords.length) >= 0.7;

          return {
            isCorrect: isCorrect,
            feedbackMsg: isCorrect
              ? `✅ Molt ben expressat! La teva resposta conté la idea clau ("${expectedRaw}").`
              : `❌ Incomplet o incorrecte. La idea clau esperada era: "${expectedRaw}".`
          };
        }

        const selected = formElement.querySelector(`input[name="q_${qIndex}"]:checked`);
        const selectedVal = selected ? parseInt(selected.value, 10) : -1;
        const correctIdx = q.correctIndex ?? 0;
        const isCorrect = selectedVal === correctIdx;

        return {
          isCorrect: isCorrect,
          feedbackMsg: isCorrect
            ? '✅ Correcte!'
            : `❌ Incorrecte. La resposta correcta era: "${q.options[correctIdx]}".`
        };
      }
    };

    function moveOrderItem(qIndex, currentPos, direction) {
      const container = document.getElementById(`order-list-${qIndex}`);
      if (!container) return;
      const items = Array.from(container.children);
      const targetPos = currentPos + direction;
      if (targetPos < 0 || targetPos >= items.length) return;

      if (direction === -1) {
        container.insertBefore(items[currentPos], items[targetPos]);
      } else {
        container.insertBefore(items[targetPos], items[currentPos]);
      }

      Array.from(container.children).forEach((el, idx) => {
        const badge = el.querySelector('.order-pos-badge');
        if (badge) badge.textContent = idx + 1;
        const upBtn = el.querySelector('.order-up-btn');
        const downBtn = el.querySelector('.order-down-btn');
        if (upBtn) {
          upBtn.setAttribute('onclick', `moveOrderItem(${qIndex}, ${idx}, -1)`);
          upBtn.disabled = idx === 0;
          upBtn.classList.toggle('opacity-30', idx === 0);
        }
        if (downBtn) {
          downBtn.setAttribute('onclick', `moveOrderItem(${qIndex}, ${idx}, 1)`);
          downBtn.disabled = idx === container.children.length - 1;
          downBtn.classList.toggle('opacity-30', idx === container.children.length - 1);
        }
      });
    }

    async function uploadImageToFirebase(fileInput, targetUrlInputId, statusSpanId, previewCallback) {
      if (!currentUser) {
        alert("Has d'iniciar sessió per pujar imatges.");
        return;
      }
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      const statusSpan = document.getElementById(statusSpanId);
      if (statusSpan) {
        statusSpan.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-indigo-600"></i> Pujant imatge...';
      }

      try {
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `readings/${currentUser.uid}/${Date.now()}_${safeName}`;
        const ref = storage.ref().child(path);
        const snapshot = await ref.put(file);
        const downloadUrl = await snapshot.ref.getDownloadURL();

        const targetInput = document.getElementById(targetUrlInputId);
        if (targetInput) targetInput.value = downloadUrl;

        if (statusSpan) {
          statusSpan.innerHTML = '<span class="text-emerald-600 font-bold"><i class="fa-solid fa-check"></i> Pujada!</span>';
        }
        if (typeof previewCallback === 'function') previewCallback(downloadUrl);
      } catch (err) {
        console.error("Error pujant imatge:", err);
        if (statusSpan) {
          statusSpan.innerHTML = `<span class="text-red-600 font-bold">Error: ${err.message}</span>`;
        }
        alert("No s'ha pogut pujar la imatge: " + err.message);
      }
    }

    function toggleSpeechSynthesis() {
      if (!('speechSynthesis' in window)) {
        alert("El teu navegador no admet la lectura en veu alta.");
        return;
      }
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        updateSpeechUI();
        return;
      }

      const textEl = document.getElementById('reading-text-body');
      const titleEl = document.getElementById('reading-article-title');
      if (!textEl) return;

      const fullText = (titleEl ? titleEl.innerText + ". " : "") + textEl.innerText;
      const utterance = new SpeechSynthesisUtterance(fullText);
      utterance.lang = 'ca-ES';
      utterance.rate = speechRate;

      utterance.onend = () => { isSpeaking = false; updateSpeechUI(); };
      utterance.onerror = () => { isSpeaking = false; updateSpeechUI(); };

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
      isSpeaking = true;
      updateSpeechUI();
    }

    function changeSpeechRate(newRate) {
      speechRate = parseFloat(newRate);
      if (isSpeaking) {
        toggleSpeechSynthesis();
        toggleSpeechSynthesis();
      }
    }

    function stopSpeechSynthesis() {

    async function saveUserProfile(e) {
      e.preventDefault();
      if (!currentUser) return;
      const nameVal = document.getElementById('profile-name').value.trim();
      const schoolVal = document.getElementById('profile-school').value.trim();
      const teacherUidInput = document.getElementById('profile-teacher-uid');
      const teacherUidVal = teacherUidInput ? teacherUidInput.value.trim() : "";

      try {
        await db.collection("users").doc(currentUser.uid).update({
          displayName: nameVal,
          school: schoolVal,
          teacherUid: teacherUidVal
        });
        userDisplayName = nameVal;
        userSchool = schoolVal;
        userTeacherUid = teacherUidVal;
        document.getElementById('profile-modal-container').innerHTML = '';
        renderNav();
        renderReaderPassport();
      } catch (err) {
        alert("Error guardant el perfil: " + err.message);
      }
    }

    async function sendTeacherFeedback(e) {
      e.preventDefault();
      if (!currentUser) return;
      const type = document.getElementById('fb-type').value;
      const message = document.getElementById('fb-message').value.trim();
      if (!message) return;

      try {
        await db.collection(TEACHER_FEEDBACK_COLLECTION).add({
          senderUid: currentUser.uid,
          senderEmail: currentUser.email,
          senderName: userDisplayName || currentUser.email,
          senderSchool: userSchool || '',
          type: type,
          message: message,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          read: false
        });
        document.getElementById('feedback-modal-container').innerHTML = '';
        alert("✅ Moltes gràcies! El teu suggeriment s'ha enviat correctament.");
      } catch (err) {
        alert("Error enviant el missatge: " + err.message);
      }
    }

    async function renderTeacherFeedbackInbox() {
      const box = document.getElementById('admin-feedback-inbox-box');
      if (!box || !currentUser || currentUser.email !== ADMIN_SUPREMO_EMAIL) return;

      try {
        const snap = await db.collection(TEACHER_FEEDBACK_COLLECTION).orderBy("createdAt", "desc").limit(15).get();
        if (snap.empty) {
          box.innerHTML = `<p class="text-xs text-slate-500 italic">No hi ha cap suggeriment docent rebut encara.</p>`;
          return;
        }
        let html = '<div class="space-y-2.5 max-h-72 overflow-y-auto pr-1">';
        snap.forEach(doc => {
          const d = doc.data();
          html += `
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-1">
              <div class="flex justify-between items-center">
                <span class="font-bold text-indigo-800">${escapeHtmlAttr(d.type || 'Missatge')}</span>
                <span class="text-[11px] text-slate-500">${escapeHtmlAttr(d.senderName)} (${escapeHtmlAttr(d.senderSchool || d.senderEmail)})</span>
              </div>
              <p class="text-slate-700 leading-relaxed">${escapeHtmlAttr(d.message)}</p>
            </div>
          `;
        });
        html += '</div>';

    async function confirmCloneReading(sourceId) {
      const label = document.getElementById('clone-adaptation-label').value.trim() || "Versió Adaptada (DUA)";
      try {
        const docSnap = await db.collection(DB_COLLECTION).doc(sourceId).get();
        if (!docSnap.exists) return;
        const orig = docSnap.data();

        const targetOriginalId = orig.isAdaptedVersion && orig.parentReadingId ? orig.parentReadingId : sourceId;
        const baseDocSnap = targetOriginalId === sourceId ? docSnap : await db.collection(DB_COLLECTION).doc(targetOriginalId).get();
        const baseData = baseDocSnap.exists ? baseDocSnap.data() : orig;

        const existingAdaptedId = baseData.adaptedReadingId || null;

        const clonedData = {
          title: baseData.title,
          author: baseData.author || '',
          type: baseData.type || 'reading',
          contentFormat: baseData.contentFormat || 'text',
          refImageUrl: baseData.refImageUrl || '',
          refImageCaption: baseData.refImageCaption || '',
          cycle: baseData.cycle || 'Cicle Mitjà (3r - 4t Primària)',
          category: baseData.category || 'Narrativa',
          duration: baseData.duration || '5 - 10 minuts',
          pointsPerQuestion: baseData.pointsPerQuestion || 1,
          content: baseData.content || '',
          glossary: baseData.glossary || [],
          questions: baseData.questions || [],
          questionCount: (baseData.questions || []).length,
          isAdaptedVersion: true,
          adaptationLabel: label,
          parentReadingId: targetOriginalId,
          authorEmail: currentUser.email,
          authorUid: currentUser.uid,
          authorName: userDisplayName || currentUser.email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        let finalAdaptedId = existingAdaptedId;
        if (existingAdaptedId) {
          await db.collection(DB_COLLECTION).doc(existingAdaptedId).update(clonedData);
        } else {
          const newDocRef = await db.collection(DB_COLLECTION).add(clonedData);
          finalAdaptedId = newDocRef.id;
        }

        await db.collection(DB_COLLECTION).doc(targetOriginalId).update({
          hasAdaptedVersion: true,
          adaptedReadingId: finalAdaptedId,
          adaptationLabel: label
        });

        document.getElementById('clone-modal-container').innerHTML = '';
        renderEditor(finalAdaptedId);
      } catch (err) {
        alert("Error creant la versió adaptada: " + err.message);
      }
    }

    function switchAuthTab(mode) {
      document.getElementById('auth-mode').value = mode;
      const title = document.getElementById('auth-title');
      const roleBox = document.getElementById('role-selector');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');

      if (mode === 'register') {

        tabReg.className = "flex-1 py-2 font-medium text-slate-500 hover:text-slate-700";

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const mode = document.getElementById('auth-mode').value;
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const errorBox = document.getElementById('auth-error');
      errorBox.classList.add('hidden');

      try {
        if (mode === 'register') {
          let role = document.getElementById('auth-role').value;
          const displayName = document.getElementById('auth-name').value.trim();
          const school = (role !== 'adult') ? document.getElementById('auth-school').value.trim() : "";
          const teacherUid = (role === 'alumne') ? document.getElementById('auth-teacher-uid').value.trim() : "";

          if (!displayName) throw new Error("Si us plau, escriu el teu nom o sobrenom.");
          if (role !== 'adult' && !school) throw new Error("Si us plau, escriu el nom de la teva escola o centre.");

          if (email === ADMIN_SUPREMO_EMAIL) role = 'docent';
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection("users").doc(cred.user.uid).set({
            email: email,
            points: 0,
            role: role,
            completedReadings: [],
            displayName: displayName,
            school: school,
            teacherUid: teacherUid
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        errorBox.textContent = "Error: " + err.message;
        errorBox.classList.remove('hidden');
      }
    }

    function logout() {
      stopSpeechSynthesis();
      auth.signOut();
    }

    async function renderStudentLeaderboard() {
      const box = document.getElementById('student-leaderboard-box');
      if (!box) return;

      const scope = document.getElementById('leaderboard-scope') ? document.getElementById('leaderboard-scope').value : 'all';

      try {
        const snapshot = await db.collection("users").get();
        let allParticipants = [];

        snapshot.forEach(doc => {
          const d = doc.data();
          const isSupremo = d.email === ADMIN_SUPREMO_EMAIL;
          if (!isSupremo && (d.role === 'alumne' || d.role === 'adult' || !d.role)) {
            allParticipants.push({
              uid: doc.id,
              name: d.displayName || (d.email ? d.email.split('@')[0] : 'Lector/a'),
              school: d.school || 'Lector/a Independent',
              role: d.role || 'alumne',
              teacherUid: d.teacherUid || '',
              points: d.points || 0
            });
          }
        });

        let filtered = allParticipants;
        if (scope === 'my_group' && currentUser) {
          filtered = allParticipants.filter(s => s.teacherUid === currentUser.uid || (userTeacherUid && s.teacherUid === userTeacherUid));
        } else if (scope === 'my_school' && userSchool) {
          const normMySchool = normalizeText(userSchool);
          filtered = allParticipants.filter(s => normalizeText(s.school) === normMySchool);
        }

        filtered.sort((a, b) => b.points - a.points);
        const top10 = filtered.slice(0, 10);

        if (top10.length === 0) {
          box.innerHTML = `<p class="text-xs text-slate-500 italic py-2">Encara no hi ha participants registrats en aquest filtre.</p>`;
          return;
        }

        let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">';
        top10.forEach((st, idx) => {
          const rank = getRankDetails(st.points);
          let medal = `<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-600 font-bold text-xs flex items-center justify-center">${idx + 1}</span>`;
          if (idx === 0) medal = `<span class="text-lg">🥇</span>`;
          else if (idx === 1) medal = `<span class="text-lg">🥈</span>`;
          else if (idx === 2) medal = `<span class="text-lg">🥉</span>`;

          const isMe = currentUser && st.uid === currentUser.uid;
          html += `
            <div class="flex items-center justify-between p-2.5 rounded-xl border ${isMe ? 'bg-indigo-50/80 border-indigo-300' : 'bg-slate-50/70 border-slate-200/80'}">
              <div class="flex items-center space-x-2.5 min-w-0">
                <div class="flex-shrink-0 w-7 text-center">${medal}</div>
                <div class="min-w-0">
                  <div class="text-xs font-extrabold text-slate-800 truncate flex items-center gap-1.5">
                    <span>${escapeHtmlAttr(st.name)} ${isMe ? '(Tu)' : ''}</span>
                  </div>
                  <div class="text-[10px] text-slate-500 truncate">
                    ${st.role === 'adult' ? 'Lector/a Adult/a' : escapeHtmlAttr(st.school)} • <span class="text-indigo-600 font-semibold">${rank.name}</span>
                  </div>
                </div>
              </div>
              <span class="flex-shrink-0 bg-amber-100 text-amber-900 font-extrabold text-xs px-2.5 py-1 rounded-lg border border-amber-300">
                ${st.points} pts
              </span>
            </div>
          `;
        });
        html += '</div>';
        box.innerHTML = html;
      } catch (err) {
        box.innerHTML = `<p class="text-xs text-red-600">Error carregant classificació: ${err.message}</p>`;
      }
    }

      stopSpeechSynthesis();

      filterMyLectures = false;

      renderCatalog();

    function applyCatalogFilters() {
      const searchEl = document.getElementById('filter-search');
      const authorEl = document.getElementById('filter-author');
      const typeEl = document.getElementById('filter-type');
      const cycleEl = document.getElementById('filter-cycle');
      const catEl = document.getElementById('filter-category');
      const durEl = document.getElementById('filter-duration');
      const statusEl = document.getElementById('filter-status');

      filterSearchText = searchEl ? searchEl.value : '';
      filterAuthorName = authorEl ? authorEl.value : '';
      filterType = typeEl ? typeEl.value : 'all';
      filterCycle = cycleEl ? cycleEl.value : 'all';
      filterCategory = catEl ? catEl.value : 'all';
      filterDuration = durEl ? durEl.value : 'all';
      filterStatus = statusEl ? statusEl.value : 'all';

      renderCatalogCards();
    }

    function renderCatalogCards() {
      const grid = document.getElementById('catalog-cards-grid');
      const countBadge = document.getElementById('catalog-results-count');
      if (!grid) return;

      const normSearch = normalizeText(filterSearchText);
      const normAuthor = normalizeText(filterAuthorName);
      const isCreator = isUserAdminOrCreator();
      const isSupremo = currentUser && currentUser.email === ADMIN_SUPREMO_EMAIL;

      const filteredLectures = cachedAllLectures.filter(item => {
        if (item.isAdaptedVersion) return false;

        if (filterMyLectures && currentUser) {
          const isMine = (item.authorUid && item.authorUid === currentUser.uid) || (item.authorEmail && item.authorEmail === currentUser.email);
          if (!isMine) return false;
        }

        if (normSearch) {
          const codeStr = formatReadingCode(item.readingNumber) || '';
          const normTitle = normalizeText(item.title);
          const normCode = normalizeText(codeStr);
          const normItemAuthor = normalizeText(item.author);
          if (!normTitle.includes(normSearch) && !normCode.includes(normSearch) && !normItemAuthor.includes(normSearch)) {
            return false;
          }
        }

        if (normAuthor) {
          const normCreator = normalizeText(item.authorName || item.authorEmail || '');
          const normBookAuthor = normalizeText(item.author || '');
          if (!normCreator.includes(normAuthor) && !normBookAuthor.includes(normAuthor)) {
            return false;
          }
        }

        if (filterType !== 'all') {
          if (filterType === 'book' && item.type !== 'book') return false;
          if (filterType === 'visual' && item.contentFormat !== 'image') return false;
          if (filterType === 'reading' && (item.type === 'book' || item.contentFormat === 'image')) return false;
        }

        if (filterCycle !== 'all' && item.cycle !== filterCycle) return false;
        if (filterCategory !== 'all' && item.category !== filterCategory) return false;
        if (filterDuration !== 'all' && item.duration !== filterDuration) return false;

        if (filterStatus !== 'all') {
          const isCompleted = userCompletedReadings.includes(item.id);
          if (filterStatus === 'completed' && !isCompleted) return false;
          if (filterStatus === 'pending' && isCompleted) return false;
          if (filterStatus === 'adapted' && !item.hasAdaptedVersion) return false;
        }

        return true;
      });

      if (countBadge) {
        countBadge.textContent = `${filteredLectures.length} ${filteredLectures.length === 1 ? 'lectura' : 'lectures'}`;
      }

      if (filteredLectures.length === 0) {
        grid.innerHTML = `

              Mostrar totes les lectures

      let html = '';
      filteredLectures.forEach(item => {
        const isCompleted = userCompletedReadings.includes(item.id);

        const isBook = item.type === 'book';

        let typeBadge = '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700"><i class="fa-solid fa-file-lines mr-1"></i> Text</span>';

        else if (isVisual) typeBadge = '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-cyan-100 text-cyan-900"><i class="fa-solid fa-image mr-1"></i> Visual</span>';

        html += `
          <div class="bg-white rounded-2xl shadow-sm border ${isCompleted ? 'border-emerald-300 bg-emerald-50/15' : 'border-slate-200'} overflow-hidden hover:shadow-md transition flex flex-col justify-between group">
            <div class="p-5 space-y-2.5">
              <div class="flex flex-wrap items-center justify-between gap-1.5">
                <div class="flex flex-wrap items-center gap-1.5">
                  ${codeBadge ? `<span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-800 text-amber-300">#${codeBadge}</span>` : ''}
                  ${typeBadge}
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100">${escapeHtmlAttr(item.category || 'General')}</span>

              <button onclick="renderReader('${item.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-1.5 rounded-xl text-xs shadow-sm transition flex items-center">

            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
    }

    async function submitQuiz(e, docId, pointsPerQuestion) {
      e.preventDefault();
      const form = e.target;

      try {
        const docSnap = await db.collection(DB_COLLECTION).doc(docId).get();
        if (!docSnap.exists) return;
        const item = docSnap.data();
        const questions = item.questions || [];

        let correctCount = 0;
        questions.forEach((q, idx) => {
          const result = QuestionEngine.evaluate(q, idx, form);
          if (result.isCorrect) correctCount++;

          const fbBox = document.getElementById(`feedback-q-${idx}`);
          if (fbBox) {
            fbBox.textContent = result.feedbackMsg;
            fbBox.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-red-50', 'text-red-800', 'border-red-200');
            if (result.isCorrect) {
              fbBox.classList.add('bg-emerald-50', 'text-emerald-800', 'border', 'border-emerald-200');
            } else {
              fbBox.classList.add('bg-red-50', 'text-red-800', 'border', 'border-red-200');
            }
          }
        });

        const scoreEarned = correctCount * pointsPerQuestion;
        const maxScore = questions.length * pointsPerQuestion;
        let newlyEarnedPoints = 0;
        let rankUpText = "";

        if (currentUser && !isUserAdminOrCreator()) {
          const prevScore = userScores[docId] || 0;
          const oldRank = getRankDetails(userPoints).name;

          if (scoreEarned > prevScore) {
            newlyEarnedPoints = scoreEarned - prevScore;
            userPoints += newlyEarnedPoints;
            userScores[docId] = scoreEarned;
          }

          if (!userCompletedReadings.includes(docId)) {
            userCompletedReadings.push(docId);
          }

          const newRank = getRankDetails(userPoints).name;
          if (newRank !== oldRank) {
            rankUpText = `🎉 Has pujat al rang: ${newRank}!`;
          }

          await db.collection("users").doc(currentUser.uid).update({
            points: userPoints,
            completedReadings: userCompletedReadings,
            scores: userScores
          });

          renderNav();
        }

        renderFeedbackModal(scoreEarned, maxScore, newlyEarnedPoints, rankUpText);
      } catch (err) {
        alert("Error corregint el qüestionari: " + err.message);
      }
    }

        setContentFormat(document.getElementById('ed-content-format').value);
      }
    }

    function setContentFormat(fmt) {
      document.getElementById('ed-content-format').value = fmt;
      const textCont = document.getElementById('ed-text-container');
      const imgCont = document.getElementById('ed-image-container');
      const btnText = document.getElementById('btn-fmt-text');
      const btnImg = document.getElementById('btn-fmt-image');

      if (fmt === 'image') {
        textCont.classList.add('hidden');
        imgCont.classList.remove('hidden');
        btnImg.className = "flex-1 py-2 text-xs font-bold bg-indigo-600 text-white rounded-xl";
        btnText.className = "flex-1 py-2 text-xs font-bold bg-slate-100 text-slate-700 rounded-xl";
      } else {
        textCont.classList.remove('hidden');
        imgCont.classList.add('hidden');
        btnText.className = "flex-1 py-2 text-xs font-bold bg-indigo-600 text-white rounded-xl";
        btnImg.className = "flex-1 py-2 text-xs font-bold bg-slate-100 text-slate-700 rounded-xl";
      }
    }

    function updateRefImagePreview(url) {
      const prev = document.getElementById('ed-ref-image-preview');
      if (!prev) return;
      if (url && url.trim()) {
        prev.innerHTML = `<img src="${escapeHtmlAttr(url.trim())}" class="max-h-48 rounded-xl border border-slate-200 mx-auto mt-2">`;
      } else {
        prev.innerHTML = '';
      }
    }

    function addGlossaryField(term = '', definition = '') {
      const container = document.getElementById('glossary-fields-container');
      const div = document.createElement('div');
      div.className = "flex flex-col sm:flex-row gap-2 items-start bg-slate-50 p-2.5 rounded-xl border border-slate-200 glossary-row";
      div.innerHTML = `
        <input type="text" placeholder="Paraula clau" value="${escapeHtmlAttr(term)}" class="glossary-term-input w-full sm:w-1/3 px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-bold">
        <input type="text" placeholder="Definició clara per a l'alumne" value="${escapeHtmlAttr(definition)}" class="glossary-def-input w-full sm:flex-1 px-3 py-1.5 border border-slate-300 rounded-lg text-xs">
        <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 p-1.5 text-xs"><i class="fa-solid fa-trash"></i></button>
      `;
      container.appendChild(div);
    }

    function insertGlossaryLink() {
      const textarea = document.getElementById('ed-content');
      if (!textarea) return;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selected = textarea.value.substring(start, end).trim();
      if (!selected) {
        alert("Selecciona primer una paraula dins del text de la lectura per afegir-la al glossari.");
        return;
      }
      addGlossaryField(selected, '');
    }

    function toggleQuestionAnswerType(selectEl) {
      const card = selectEl.closest('.question-editor-card');
      const type = selectEl.value;
      const optsBox = card.querySelector('.q-options-box');
      const openBox = card.querySelector('.q-open-box');
      const imgBox = card.querySelector('.q-image-options-box');
      const reflBox = card.querySelector('.q-reflection-box');

      optsBox.classList.add('hidden');
      openBox.classList.add('hidden');
      imgBox.classList.add('hidden');
      reflBox.classList.add('hidden');

      if (type === 'open') openBox.classList.remove('hidden');
      else if (type === 'image_select') imgBox.classList.remove('hidden');
      else if (type === 'reflection') reflBox.classList.remove('hidden');
      else optsBox.classList.remove('hidden');
    }

    function updateImagePreview(inputEl) {
      const row = inputEl.closest('.img-opt-row');
      const preview = row.querySelector('.img-opt-preview');
      const url = inputEl.value.trim();
      preview.innerHTML = url ? `<img src="${escapeHtmlAttr(url)}" class="w-12 h-12 object-cover rounded-lg border">` : '';
    }

    function updateQuestionIndexes() {
      document.querySelectorAll('.question-editor-card').forEach((card, idx) => {
        card.querySelector('.q-num-label').textContent = `Pregunta ${idx + 1}`;
      });
    }

    function moveQuestionUp(btn) {
      const card = btn.closest('.question-editor-card');
      if (card.previousElementSibling) {
        card.parentNode.insertBefore(card, card.previousElementSibling);
        updateQuestionIndexes();
      }
    }

    function moveQuestionDown(btn) {
      const card = btn.closest('.question-editor-card');
      if (card.nextElementSibling) {
        card.parentNode.insertBefore(card.nextElementSibling, card);
        updateQuestionIndexes();
      }
    }

    function removeQuestionField(btn) {
      btn.closest('.question-editor-card').remove();
      updateQuestionIndexes();
    }

    function addQuestionField(data = null) {
      const container = document.getElementById('questions-editor-container');
      const idx = container.children.length;
      const qText = data ? data.question : '';
      const cogType = data ? (data.cognitiveType || 'literal') : 'literal';
      const ansType = data ? (data.answerType || 'single') : 'single';
      const opts = data && Array.isArray(data.options) ? data.options : ['', '', '', ''];
      const correctIdx = data ? (data.correctIndex ?? 0) : 0;
      const correctIndices = data && Array.isArray(data.correctIndices) ? data.correctIndices : [0];
      const expectedAns = data ? (data.expectedAnswer || '') : '';
      const imgOpts = data && Array.isArray(data.imageOptions) ? data.imageOptions : [{ url: '', label: '' }, { url: '', label: '' }];

      const card = document.createElement('div');
      card.className = "question-editor-card p-5 bg-slate-50 rounded-2xl border border-slate-200 space-y-3";
      card.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-2">
          <span class="q-num-label text-xs font-black uppercase text-indigo-700">Pregunta ${idx + 1}</span>
          <div class="flex items-center gap-1.5">
            <button type="button" onclick="moveQuestionUp(this)" class="p-1.5 bg-white border border-slate-300 rounded-lg text-xs hover:bg-slate-100"><i class="fa-solid fa-arrow-up"></i></button>
            <button type="button" onclick="moveQuestionDown(this)" class="p-1.5 bg-white border border-slate-300 rounded-lg text-xs hover:bg-slate-100"><i class="fa-solid fa-arrow-down"></i></button>
            <button type="button" onclick="removeQuestionField(this)" class="p-1.5 bg-red-50 border border-red-200 text-red-600 rounded-lg text-xs hover:bg-red-100"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1">Dimensió cognitiva</label>
            <select class="q-cognitive-type w-full px-3 py-1.5 border border-slate-300 rounded-xl text-xs bg-white">
              ${Object.entries(COGNITIVE_TYPES).map(([k, v]) => `<option value="${k}" ${cogType === k ? 'selected' : ''}>${v.label} — ${v.desc}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1">Format de resposta</label>
            <select onchange="toggleQuestionAnswerType(this)" class="q-answer-type w-full px-3 py-1.5 border border-slate-300 rounded-xl text-xs bg-white">
              <option value="single" ${ansType === 'single' ? 'selected' : ''}>Opció única (Test)</option>
              <option value="multiple" ${ansType === 'multiple' ? 'selected' : ''}>Opció múltiple (Diverses correctes)</option>
              <option value="open" ${ansType === 'open' ? 'selected' : ''}>Resposta oberta curta (Paraules clau)</option>
              <option value="order" ${ansType === 'order' ? 'selected' : ''}>Ordenar seqüència (Cronològica)</option>
              <option value="image_select" ${ansType === 'image_select' ? 'selected' : ''}>Selecció d'imatge</option>
              <option value="reflection" ${ansType === 'reflection' ? 'selected' : ''}>Reflexió / Opinió oberta</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">Enunciat de la pregunta</label>
          <input type="text" required value="${escapeHtmlAttr(qText)}" placeholder="Escriu la pregunta..." class="q-text-input w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm bg-white">
        </div>

        <!-- Opcions test / múltiple / ordre -->
        <div class="q-options-box space-y-2 ${['open', 'image_select', 'reflection'].includes(ansType) ? 'hidden' : ''}">
          <p class="text-[11px] text-slate-500">Marca la casella de la resposta correcta (en mode <em>Ordenar</em>, escriu-les en l'ordre correcte de dalt a baix):</p>
          ${[0, 1, 2, 3].map(oIdx => `
            <div class="flex items-center gap-2">
              <input type="checkbox" class="q-opt-correct w-4 h-4 text-emerald-600 rounded" ${(ansType === 'multiple' ? correctIndices.includes(oIdx) : correctIdx === oIdx) ? 'checked' : ''}>
              <input type="text" value="${escapeHtmlAttr(opts[oIdx] || '')}" placeholder="Opció ${oIdx + 1}" class="q-opt-input flex-1 px-3 py-1.5 border border-slate-300 rounded-xl text-xs bg-white">
            </div>
          `).join('')}
        </div>

        <!-- Resposta oberta -->
        <div class="q-open-box space-y-1 ${ansType !== 'open' ? 'hidden' : ''}">
          <label class="block text-[11px] font-bold text-slate-600">Resposta esperada o paraules clau (separa alternatives amb | )</label>
          <input type="text" value="${escapeHtmlAttr(expectedAns)}" placeholder="Ex: Barcelona | Ciutat Comtal" class="q-open-expected w-full px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white">
        </div>

        <!-- Selecció d'imatge -->
        <div class="q-image-options-box space-y-2 ${ansType !== 'image_select' ? 'hidden' : ''}">
          <p class="text-[11px] text-slate-500">Enganxa les URL de les imatges i marca quina és la correcta:</p>
          ${[0, 1].map(iIdx => {
            const imgObj = imgOpts[iIdx] || { url: '', label: '' };
            return `
              <div class="img-opt-row flex flex-wrap items-center gap-2 bg-white p-2 rounded-xl border border-slate-200">
                <input type="radio" name="img_correct_${idx}_${Date.now()}" class="q-img-correct" ${correctIdx === iIdx ? 'checked' : ''}>
                <input type="text" oninput="updateImagePreview(this)" value="${escapeHtmlAttr(imgObj.url)}" placeholder="URL de la imatge ${iIdx + 1}" class="q-img-url flex-1 px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs">
                <input type="text" value="${escapeHtmlAttr(imgObj.label)}" placeholder="Peu d'imatge" class="q-img-label w-36 px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs">
                <div class="img-opt-preview">${imgObj.url ? `<img src="${escapeHtmlAttr(imgObj.url)}" class="w-10 h-10 object-cover rounded border">` : ''}</div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Reflexió -->
        <div class="q-reflection-box ${ansType !== 'reflection' ? 'hidden' : ''} bg-amber-50 p-3 rounded-xl border border-amber-200 text-xs text-amber-900">
          L'alumne disposarà d'un quadre de text lliure per argumentar la seva resposta. Es validarà automàticament en escriure una reflexió completa.
        </div>
      `;
      container.appendChild(card);
    }

          </form>
        </div>
      `;

      (data.glossary || []).forEach(g => addGlossaryField(g.term, g.definition));
      if (data.questions && data.questions.length > 0) {
        data.questions.forEach(q => addQuestionField(q));
      } else {
        addQuestionField();
      }
    }

    async function saveReading(e) {
      e.preventDefault();
      if (!currentUser || !isUserAdminOrCreator()) return;

      const title = document.getElementById('ed-title').value.trim();
      const author = document.getElementById('ed-author').value.trim();
      const type = document.getElementById('ed-type').value;
      const contentFormat = document.getElementById('ed-content-format').value;
      const refImageUrl = document.getElementById('ed-ref-image-url').value.trim();
      const refImageCaption = document.getElementById('ed-ref-image-caption').value.trim();
      const cycle = document.getElementById('ed-cycle').value;
      const category = document.getElementById('ed-category').value;
      const duration = document.getElementById('ed-duration').value;
      const pointsPerQuestion = parseInt(document.getElementById('ed-points-per-q').value, 10) || 1;
      const content = document.getElementById('ed-content').value;

      const glossary = [];
      document.querySelectorAll('.glossary-row').forEach(row => {
        const term = row.querySelector('.glossary-term-input').value.trim();
        const definition = row.querySelector('.glossary-def-input').value.trim();
        if (term && definition) glossary.push({ term, definition });
      });

      const questions = [];
      document.querySelectorAll('.question-editor-card').forEach(card => {
        const question = card.querySelector('.q-text-input').value.trim();
        const cognitiveType = card.querySelector('.q-cognitive-type').value;
        const answerType = card.querySelector('.q-answer-type').value;

        if (!question) return;

        if (answerType === 'open') {
          const expectedAnswer = card.querySelector('.q-open-expected').value.trim();
          questions.push({ question, cognitiveType, answerType, expectedAnswer });
        } else if (answerType === 'reflection') {
          questions.push({ question, cognitiveType, answerType });
        } else if (answerType === 'image_select') {
          const imageOptions = [];
          let correctIndex = 0;
          card.querySelectorAll('.img-opt-row').forEach((r, idx) => {
            const url = r.querySelector('.q-img-url').value.trim();
            const label = r.querySelector('.q-img-label').value.trim();
            if (r.querySelector('.q-img-correct').checked) correctIndex = idx;
            imageOptions.push({ url, label });
          });
          questions.push({ question, cognitiveType, answerType, imageOptions, correctIndex });
        } else {
          const options = [];
          const correctIndices = [];
          card.querySelectorAll('.q-opt-input').forEach((inp, idx) => {
            const val = inp.value.trim();
            if (val) {
              const chk = inp.parentElement.querySelector('.q-opt-correct');
              if (chk && chk.checked) correctIndices.push(options.length);
              options.push(val);
            }
          });
          const correctIndex = correctIndices.length > 0 ? correctIndices[0] : 0;
          questions.push({ question, cognitiveType, answerType, options, correctIndex, correctIndices });
        }
      });

      if (questions.length === 0) {
        alert("Has d'afegir com a mínim una pregunta vàlida.");
        return;
      }

      const payload = {
        title,
        author,
        type,
        contentFormat,
        refImageUrl,
        refImageCaption,
        cycle,
        category,
        duration,
        pointsPerQuestion,
        content,
        glossary,
        questions,
        questionCount: questions.length
      };

      const adaptLabelInput = document.getElementById('ed-adaptation-label');
      if (adaptLabelInput) {
        payload.adaptationLabel = adaptLabelInput.value.trim() || "Versió Adaptada (DUA)";
      }

      try {
        if (currentEditingId) {
          await db.collection(DB_COLLECTION).doc(currentEditingId).update(payload);
        } else {
          let nextNumber = 1;
          try {
            const maxSnap = await db.collection(DB_COLLECTION).orderBy("readingNumber", "desc").limit(1).get();
            if (!maxSnap.empty && maxSnap.docs[0].data().readingNumber) {
              nextNumber = maxSnap.docs[0].data().readingNumber + 1;
            }
          } catch (_) {}

          payload.readingNumber = nextNumber;
          payload.authorEmail = currentUser.email;
          payload.authorUid = currentUser.uid;
          payload.authorName = userDisplayName || currentUser.email;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection(DB_COLLECTION).add(payload);
        }

        alert("✅ Lectura guardada correctament!");
        resetFiltersAndRenderCatalog();
      } catch (err) {
        alert("Error guardant la lectura: " + err.message);
      }
    }

    function shareReadingLink(docId) {
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = baseUrl + "?lectura=" + encodeURIComponent(docId);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(function() {
          alert("🔗 Enllaç de la lectura copiat al porta-retalls:\n" + shareUrl);
        }).catch(function() {
          prompt("Copia aquest enllaç per compartir la lectura:", shareUrl);
        });
      } else {
        prompt("Copia aquest enllaç per compartir la lectura:", shareUrl);
      }
    }

        navigator.clipboard.writeText(shareUrl).then(function() {

          prompt("Copia aquest enllaç per compartir la carpeta:", shareUrl);

        prompt("Copia aquest enllaç per compartir la carpeta:", shareUrl);

    }

    function shareToGoogleClassroom(docId, title) {
      const baseUrl = window.location.origin + window.location.pathname;
      const targetUrl = baseUrl + "?lectura=" + encodeURIComponent(docId);
      const classroomUrl = "https://classroom.google.com/share?url=" + encodeURIComponent(targetUrl) + "&title=" + encodeURIComponent("Lectura Aventura: " + (title || "Activitat de comprensió lectora"));
      window.open(classroomUrl, "_blank", "noopener,noreferrer");
    }
