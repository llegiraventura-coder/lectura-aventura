<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Aventura - v0.18.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="resetFiltersAndRenderCatalog()">
        <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
        <span class="font-bold text-xl tracking-wide">Lectura Aventura</span>
      </div>
      <nav id="nav-actions" class="flex items-center space-x-3"></nav>
    </div>
  </header>

  <div id="motivation-banner"></div>

  <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6"></main>

  <footer class="bg-slate-800 text-slate-400 py-4 text-sm mt-auto border-t border-slate-700">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
      <p>&copy; Lectura Aventura — Plataforma Educativa de Comprensió Lectora</p>
      <button onclick="renderChangelogModal()" class="inline-flex items-center gap-1.5 text-xs bg-slate-700 hover:bg-slate-600 text-amber-300 hover:text-amber-200 px-3 py-1 rounded-lg transition font-mono border border-slate-600">
        <i class="fa-solid fa-code-branch text-amber-400"></i>
        <span>v0.18.0 — Historial de versions</span>
      </button>
    </div>
  </footer>

  <div id="changelog-modal-container"></div>
  <div id="profile-modal-container"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCcBpg9FRwYDElWoZlYsGir4ZA_HqS0BDc",
      authDomain: "lectura-aventura.firebaseapp.com",
      projectId: "lectura-aventura",
      storageBucket: "lectura-aventura.firebasestorage.app",
      messagingSenderId: "525339295825",
      appId: "1:525339295825:web:3a5b3ea8791f6146d4b870",
      measurementId: "G-7132LXLDTR"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DB_COLLECTION = "lectures";
    const SUB_COLLECTION = "questions";
    const ADMIN_SUPREMO_EMAIL = "scasas26@xtec.cat";

    let currentUser = null;
    let userPoints = 0;
    let userRole = 'alumne'; 
    let userCompletedReadings = [];
    let userDisplayName = "";
    let userSchool = "";
    let userTeacherUid = ""; 
    let filterMyLectures = false;
    let editingDocId = null;

    let filterSearch = "";
    let filterBookAuthor = "";
    let filterType = "all";
    let filterLevel = "all";
    let filterCategory = "all";
    let filterStatus = "all";

    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (user) {
        await loadUserData();
      } else {
        userPoints = 0;
        userRole = 'alumne';
        userCompletedReadings = [];
        userDisplayName = "";
        userSchool = "";
        userTeacherUid = "";
        filterMyLectures = false;
      }
      renderNav();
      
      if (currentUser && (!userDisplayName || !userSchool)) {
        renderUserProfileModal();
      } else {
        renderCatalog();
      }
    });

    async function loadUserData() {
      if (!currentUser) return;
      try {
        const doc = await db.collection("users").doc(currentUser.uid).get();
        if (doc.exists) {
          const data = doc.data();
          userPoints = data.points !== undefined ? data.points : 0;
          let role = data.role || 'alumne';
          if (role === 'mestre') role = 'docent';
          userRole = role;
          userCompletedReadings = data.completedReadings || [];
          userDisplayName = data.displayName || "";
          userSchool = data.school || "";
          userTeacherUid = data.teacherUid || "";
        } else {
          userPoints = 0;
          userRole = 'alumne';
          userCompletedReadings = [];
          userDisplayName = "";
          userSchool = "";
          userTeacherUid = "";
        }
      } catch (err) {
        console.warn("Error carregant dades de l'usuari:", err);
      }
    }

    function getRankDetails(points) {
      if (points >= 1300) return { name: "Mestre/a de la Lectura", icon: "fa-crown", color: "from-amber-400 to-amber-600", text: "text-amber-300" };
      if (points >= 700) return { name: "Lector/a d'Or", icon: "fa-trophy", color: "from-amber-300 to-amber-500", text: "text-amber-200" };
      if (points >= 300) return { name: "Lector/a d'Argent", icon: "fa-medal", color: "from-slate-400 to-slate-600", text: "text-slate-200" };
      if (points >= 100) return { name: "Lector/a de Bronze", icon: "fa-award", color: "from-amber-700 to-amber-900", text: "text-amber-400" };
      return { name: "Explorador/a d'Històries", icon: "fa-compass", color: "from-indigo-500 to-indigo-700", text: "text-indigo-200" };
    }

    function getTeacherRankDetails(points, email = "") {
      if (email === ADMIN_SUPREMO_EMAIL) return { name: "⚡ Admin Supremo", subtext: "Controlador/a del Codi", icon: "fa-shield-halved", badgeBg: "bg-purple-100 text-purple-900 border-purple-300", color: "from-purple-600 to-pink-600" };
      if (points >= 20) return { name: "👑 Docent Celestial", subtext: "Creador/a d'Universos Lectors", icon: "fa-wand-magic-sparkles", badgeBg: "bg-amber-100 text-amber-900 border-amber-300", color: "from-amber-400 to-amber-600" };
      if (points >= 15) return { name: "📚 Docent de Docents", subtext: "Supervivent de claustres", icon: "fa-graduation-cap", badgeBg: "bg-indigo-100 text-indigo-900 border-indigo-300", color: "from-blue-600 to-indigo-800" };
      if (points >= 10) return { name: "🌟 Savi/a de la Sala", subtext: "Llegenda entre cafès", icon: "fa-mug-hot", badgeBg: "bg-amber-50 text-amber-800 border-amber-200", color: "from-amber-600 to-amber-800" };
      if (points >= 6) return { name: "⚡ Arquitecte/a Pedagògic/a", subtext: "Dominador/a del currículum", icon: "fa-cubes", badgeBg: "bg-indigo-50 text-indigo-800 border-indigo-200", color: "from-indigo-500 to-indigo-700" };
      if (points >= 3) return { name: "📝 Docent Col·laborador/a", subtext: "Exportador/a de fotocòpies", icon: "fa-copy", badgeBg: "bg-teal-50 text-teal-800 border-teal-200", color: "from-teal-500 to-emerald-700" };
      if (points >= 1) return { name: "👨‍🏫 Docent Novell", subtext: "Ajustant el projector", icon: "fa-chalkboard-user", badgeBg: "bg-slate-100 text-slate-800 border-slate-300", color: "from-slate-500 to-slate-700" };
      return { name: "🎒 Docent Nouvingut/da", subtext: "Cercant el wifi de l'escola", icon: "fa-compass-drafting", badgeBg: "bg-slate-50 text-slate-600 border-slate-200", color: "from-slate-400 to-indigo-500" };
    }

    function renderBanner() {
      const bannerContainer = document.getElementById('motivation-banner');
      if (!bannerContainer) return;

      if (currentUser && userRole === 'alumne') {
        const rank = getRankDetails(userPoints);
        const displayName = userDisplayName || currentUser.email.split('@')[0];
        
        let nextRankPoints = 100;
        let nextRankName = "Lector/a de Bronze";
        if (userPoints >= 100 && userPoints < 300) { nextRankPoints = 300; nextRankName = "Lector/a d'Argent"; }
        else if (userPoints >= 300 && userPoints < 700) { nextRankPoints = 700; nextRankName = "Lector/a d'Or"; }
        else if (userPoints >= 700 && userPoints < 1300) { nextRankPoints = 1300; nextRankName = "Mestre/a de la Lectura"; }
        else if (userPoints >= 1300) { nextRankPoints = userPoints; }

        const pointsNeeded = nextRankPoints - userPoints;

        bannerContainer.innerHTML = `
          <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-indigo-900 text-white border-b border-indigo-700/50 shadow-inner py-3 px-4">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3 text-center md:text-left">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr ${rank.color} text-white flex items-center justify-center text-lg shadow-md border border-white/20">
                  <i class="fa-solid ${rank.icon}"></i>
                </div>
                <div>
                  <h2 class="text-sm md:text-base font-extrabold text-white tracking-wide">
                    Hola, <span class="text-amber-300">${displayName}</span>!
                  </h2>
                  <p class="text-xs text-indigo-200">
                    Rang actual: <span class="font-bold text-amber-300">${rank.name}</span>
                  </p>
                </div>
              </div>

              <div class="flex items-center space-x-4 bg-indigo-950/60 px-4 py-1.5 rounded-xl border border-indigo-500/30">
                <div class="text-right">
                  <span class="block text-xs font-semibold text-indigo-200">Total acumulat</span>
                  <span class="text-base font-black text-amber-400">${userPoints} PTS</span>
                </div>
                <div class="h-7 w-px bg-indigo-700/60"></div>
                <div class="text-left">
                  <span class="block text-xs font-semibold text-indigo-200">Següent objectiu</span>
                  <span class="text-xs font-bold text-slate-200">
                    ${userPoints >= 1300 ? '🌟 Nivell Màxim Assolit!' : `+${pointsNeeded} pts per ${nextRankName}`}
                  </span>
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        bannerContainer.innerHTML = '';
      }
    }

    function renderNav() {
      const nav = document.getElementById('nav-actions');
      if (currentUser) {
        const isCreator = userRole === 'docent' || userRole === 'colaborador';
        const isDocent = userRole === 'docent';
        const isAlumne = userRole === 'alumne';
        const rank = isCreator ? getTeacherRankDetails(userPoints, currentUser.email) : getRankDetails(userPoints);
        const nameToShow = userDisplayName || currentUser.email.split('@')[0];

        nav.innerHTML = `
          <button onclick="toggleMyLectures()" class="${filterMyLectures ? 'bg-amber-300 text-slate-900 font-bold' : 'bg-indigo-700 hover:bg-indigo-800 text-white font-semibold'} px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid ${filterMyLectures ? 'fa-filter-circle-xmark' : 'fa-bookmark'}"></i>
            <span class="hidden sm:inline">${filterMyLectures ? 'Totes les lectures' : 'Les meves lectures'}</span>
          </button>

          ${isAlumne ? `
            <button onclick="renderStudentLeaderboard()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-md transform hover:scale-105">
              <i class="fa-solid fa-trophy text-amber-900"></i>
              <span class="hidden md:inline">Classificació</span>
            </button>
          ` : ''}

          ${isDocent ? `
            <button onclick="renderStudentTrackingPanel()" class="bg-indigo-700 hover:bg-indigo-800 text-amber-300 font-bold px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-users text-sm"></i>
              <span class="hidden md:inline">Els meus Alumnes</span>
            </button>
          ` : ''}

          ${isCreator ? `
            <button onclick="renderEditor()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3.5 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-md transform hover:scale-105">
              <i class="fa-solid fa-plus text-base"></i>
              <span>Nova Lectura</span>
            </button>
          ` : ''}

          <div onclick="renderUserProfileModal()" title="Obrir el meu perfil" class="cursor-pointer flex items-center bg-indigo-800/80 hover:bg-indigo-800 backdrop-blur-sm px-3 py-1.5 rounded-xl border border-indigo-500/30 space-x-3 shadow-inner transition">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr ${rank.color} text-white flex items-center justify-center text-sm shadow">
              <i class="fa-solid ${rank.icon}"></i>
            </div>
            
            <div class="flex flex-col text-left">
              <div class="flex items-center space-x-1.5">
                <span class="text-xs font-bold text-white tracking-wide">${nameToShow}</span>
                <span class="bg-amber-400/20 text-amber-300 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md border border-amber-400/30">${userPoints} pts</span>
              </div>
              <span class="text-[11px] text-amber-300 font-bold leading-none mt-0.5">${rank.name}</span>
            </div>

            <button onclick="event.stopPropagation(); logout()" title="Tancar Sessió" class="text-indigo-300 hover:text-white hover:bg-indigo-700/50 p-1.5 rounded-lg transition ml-1">
              <i class="fa-solid fa-right-from-bracket text-sm"></i>
            </button>
          </div>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="renderLogin()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow">Inicia Sessió</button>
        `;
      }
      renderBanner();
    }

    function toggleMyLectures() {
      filterMyLectures = !filterMyLectures;
      renderNav();
      renderCatalog();
    }

    function logout() {
      auth.signOut().then(() => renderCatalog());
    }

    function resetFiltersAndRenderCatalog() {
      filterSearch = "";
      filterBookAuthor = "";
      filterType = "all";
      filterLevel = "all";
      filterCategory = "all";
      filterStatus = "all";
      filterMyLectures = false;
      renderNav();
      renderCatalog();
    }

    function applyCatalogFilters() {
      filterSearch = document.getElementById('search-input')?.value.toLowerCase() || '';
      filterBookAuthor = document.getElementById('author-search-input')?.value.toLowerCase() || '';
      filterType = document.getElementById('type-select')?.value || 'all';
      filterLevel = document.getElementById('level-select')?.value || 'all';
      filterCategory = document.getElementById('category-select')?.value || 'all';
      filterStatus = document.getElementById('status-select')?.value || 'all';

      renderCatalog();
    }

    async function renderUserProfileModal() {
      const container = document.getElementById('profile-modal-container');
      
      let docentsList = [];
      if (userRole === 'alumne') {
        try {
          const usersSnap = await db.collection("users").get();
          usersSnap.forEach(d => {
            const data = d.data();
            const role = data.role;
            if (role === 'docent' || role === 'mestre' || d.id === currentUser?.uid) {
              docentsList.push({
                uid: d.id,
                name: data.displayName || data.email || "Docent",
                school: data.school || ""
              });
            }
          });
        } catch(err) {
          console.warn("Error carregant llista de docents:", err);
        }
      }

      container.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white max-w-md w-full rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8 relative">
            <button onclick="closeUserProfileModal()" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600 p-1">
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="text-center mb-6">
              <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
                <i class="fa-solid ${userRole === 'alumne' ? 'fa-user-graduate' : (userRole === 'docent' ? 'fa-chalkboard-user' : 'fa-handshake-angle')}"></i>
              </div>
              <h2 class="text-xl font-bold text-slate-800">Fitxa d'Usuari</h2>
              <p class="text-xs text-slate-500 mt-1">Configura les teves dades d'identificació a Lectura Aventura</p>
            </div>

            <form onsubmit="saveUserProfile(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Tipus de Perfil</label>
                <input type="text" disabled value="${userRole === 'alumne' ? '🎓 Alumne / Alumna' : (userRole === 'docent' ? '👨‍🏫 Docent' : '🤝 Col·laborador/a')}" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 cursor-not-allowed">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nom i Cognoms / Nom Públic *</label>
                <input type="text" id="profile-name" value="${userDisplayName}" placeholder="Ex: Marc Soler, Mestra Maria" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Centre Educatiu / Escola *</label>
                <input type="text" id="profile-school" value="${userSchool}" placeholder="Ex: Escola La Renaixença, Osona" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
              </div>

              ${userRole === 'alumne' ? `
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">El teu Docent de Referència</label>
                  <select id="profile-teacher-uid" class="w-full p-2.5 border border-indigo-300 bg-indigo-50/50 rounded-xl text-sm font-semibold text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">-- Selecciona el teu Docent (Opcional) --</option>
                    ${docentsList.length > 0 ? docentsList.map(d => `<option value="${d.uid}" ${userTeacherUid === d.uid ? 'selected' : ''}>${d.name} ${d.school ? '(' + d.school + ')' : ''}</option>`).join('') : '<option value="" disabled>Cap docent registrat actualment</option>'}
                  </select>
                </div>
              ` : ''}

              <div class="pt-2 flex gap-2">
                <button type="button" onclick="closeUserProfileModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">Cancel·lar</button>
                <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm shadow transition">Desar Fitxa</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function closeUserProfileModal() {
      const container = document.getElementById('profile-modal-container');
      if (container) container.innerHTML = '';
    }

    async function saveUserProfile(e) {
      e.preventDefault();
      const name = document.getElementById('profile-name').value;
      const school = document.getElementById('profile-school').value;
      const teacherUid = document.getElementById('profile-teacher-uid')?.value || "";

      try {
        await db.collection("users").doc(currentUser.uid).set({ 
          displayName: name, 
          school: school,
          teacherUid: teacherUid 
        }, { merge: true });

        userDisplayName = name;
        userSchool = school;
        userTeacherUid = teacherUid;

        closeUserProfileModal();
        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error en desar la fitxa: " + err.message);
      }
    }

    /* --- CLASSIFICACIÓ D'ALUMNES PER AL GRUP DEL DOCENT (v0.18.0) --- */
    async function renderStudentLeaderboard() {
      if (userRole !== 'alumne') return;
      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i><p class="mt-2 text-slate-500 font-medium">Carregant la classificació del teu grup...</p></div>`;

      if (!userTeacherUid) {
        app.innerHTML = `
          <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-3xl mx-auto">
              <i class="fa-solid fa-user-slash"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800">Sens docent assignat</h2>
            <p class="text-sm text-slate-600 leading-relaxed">
              Per veure la classificació i formar part del ranking de la teva classe, necessites seleccionar el teu <strong>Docent de referència</strong> al teu perfil.
            </p>
            <button onclick="renderUserProfileModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition shadow">
              Seleccionar el meu Docent
            </button>
          </div>
        `;
        return;
      }

      try {
        // Carreguem les dades del docent assignat
        let teacherName = "el teu Docent";
        let teacherSchool = "";
        const teacherDoc = await db.collection("users").doc(userTeacherUid).get();
        if (teacherDoc.exists) {
          const tData = teacherDoc.data();
          teacherName = tData.displayName || tData.email || "el teu Docent";
          teacherSchool = tData.school || "";
        }

        // Carreguem els alumnes del docent
        const studentsSnap = await db.collection("users")
          .where("role", "==", "alumne")
          .where("teacherUid", "==", userTeacherUid)
          .get();

        let classmates = [];
        studentsSnap.forEach(doc => {
          classmates.push({ id: doc.id, ...doc.data() });
        });

        // Ordenem de més a menys punts
        classmates.sort((a, b) => (b.points || 0) - (a.points || 0));

        // Podi (Top 3)
        const top1 = classmates[0];
        const top2 = classmates[1];
        const top3 = classmates[2];

        let tableRowsHTML = '';
        classmates.forEach((st, idx) => {
          const pts = st.points || 0;
          const rank = getRankDetails(pts);
          const completedCount = (st.completedReadings || []).length;
          const isMe = st.id === currentUser.uid;

          let posBadge = `<span class="font-mono font-bold text-slate-500">#${idx + 1}</span>`;
          if (idx === 0) posBadge = `<span class="text-lg">🥇</span>`;
          if (idx === 1) posBadge = `<span class="text-lg">🥈</span>`;
          if (idx === 2) posBadge = `<span class="text-lg">🥉</span>`;

          tableRowsHTML += `
            <tr class="border-b border-slate-100 transition ${isMe ? 'bg-amber-50/80 font-bold border-amber-200' : 'hover:bg-slate-50'}">
              <td class="p-3 text-center">${posBadge}</td>
              <td class="p-3 flex items-center space-x-2">
                <span class="text-slate-800 ${isMe ? 'text-indigo-900 font-extrabold' : ''}">${st.displayName || st.email}</span>
                ${isMe ? `<span class="text-[10px] bg-indigo-600 text-white font-extrabold px-2 py-0.5 rounded-full">Tu</span>` : ''}
              </td>
              <td class="p-3">
                <span class="text-xs font-bold text-amber-700 bg-amber-100/80 border border-amber-300 px-2.5 py-1 rounded-lg">
                  ${pts} PTS
                </span>
              </td>

    async function renderReader(docId) {
      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600"></i></div>`;

      try {
        const doc = await db.collection(DB_COLLECTION).doc(docId).get();
        if (!doc.exists) {
          app.innerHTML = `<p class="text-red-500">Lectura no trobada.</p>`;
          return;
        }
        const data = doc.data();
        const isBook = data.type === 'book';

        const questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
        
        const teacherText = data.authorDisplayName ? `${data.authorDisplayName}${data.authorSchool ? ' (' + data.authorSchool + ')' : ''}` : 'Docent / Col·laborador/a';
        const authorPoints = data.authorPoints !== undefined ? data.authorPoints : 0;
        const authorEmail = data.authorEmail || "";
        const teacherRank = getTeacherRankDetails(authorPoints, authorEmail);

        const bookAuthorName = data.bookAuthor || '';
        const editorialOrSource = data.editorialOrSource || '';
        const ptsPerQuestion = data.pointsPerQuestion !== undefined ? data.pointsPerQuestion : 1;

        let questionsHTML = '';
        if (!questionsSnap.empty) {
          const totalQuestions = questionsSnap.size;
          const maxPoints = totalQuestions * ptsPerQuestion;

          questionsHTML = `
            <form id="quiz-form" onsubmit="submitQuiz(event, '${docId}', ${ptsPerQuestion})" class="mt-8 pt-6 border-t border-slate-200">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-slate-800 flex items-center">
                  <i class="fa-solid fa-list-check text-indigo-600 mr-2"></i> Preguntes de Comprensió (${totalQuestions})
                </h2>
                <span class="text-xs bg-amber-100 text-amber-900 border border-amber-300 font-extrabold px-3 py-1 rounded-lg">
                  🏆 ${ptsPerQuestion} ${ptsPerQuestion === 1 ? 'pt' : 'pts'} per encert (Màx: ${maxPoints} PTS)
                </span>
              </div>
          `;

          let qIndex = 0;
          questionsSnap.forEach(qDoc => {
            const q = qDoc.data();
            const options = q.options || q.opcions || q.respostes || [];
            const questionText = q.questionText || q.pregunta || q.text || `Pregunta ${qIndex + 1}`;

            questionsHTML += `
              <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="font-semibold text-slate-800 mb-3">${qIndex + 1}. ${questionText}</p>
                <div class="space-y-2">
            `;

            options.forEach((opt, oIdx) => {
              questionsHTML += `
                <label class="flex items-center space-x-3 p-2.5 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/50 transition">
                  <input type="radio" name="q_${qDoc.id}" value="${oIdx}" required class="text-indigo-600 focus:ring-indigo-500">
                  <span class="text-sm text-slate-700">${opt}</span>
                </label>
              `;
            });

            questionsHTML += `</div></div>`;
            qIndex++;
          });

          questionsHTML += `
              <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">
                Enviar respostes i obtenir punts
              </button>
            </form>
          `;
        } else {

    async function submitQuiz(e, docId, pointsPerQuestion = 1) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);

      const questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
      let score = 0;
      let total = questionsSnap.size;

      questionsSnap.forEach(qDoc => {
        const q = qDoc.data();
        const selected = parseInt(formData.get(`q_${qDoc.id}`));
        const correct = q.correctAnswer !== undefined ? q.correctAnswer : 0;
        if (selected === correct) score++;
      });

      const newQuizPoints = score * pointsPerQuestion;
      const maxPossiblePoints = total * pointsPerQuestion;

      let userScores = {};
      if (currentUser) {
        try {
          const userDoc = await db.collection("users").doc(currentUser.uid).get();
          if (userDoc.exists) userScores = userDoc.data().scores || {};
        } catch (err) {
          console.warn("Error llegint puntuacions anteriors:", err);
        }
      }

      const previousQuizPoints = userScores[docId] || 0;
      let pointsToAdd = 0;

      if (newQuizPoints > previousQuizPoints) {
        pointsToAdd = newQuizPoints - previousQuizPoints;
        userScores[docId] = newQuizPoints;
        userPoints += pointsToAdd;
      }

      if (!userCompletedReadings.includes(docId)) userCompletedReadings.push(docId);

      if (currentUser) {
        try {
          await db.collection("users").doc(currentUser.uid).set({
            points: userPoints,
            completedReadings: userCompletedReadings,
            scores: userScores
          }, { merge: true });
        } catch (err) {
          console.warn("S'han desat les dades localment:", err);
        }
      }

      await loadUserData();
      renderNav();

      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;

      if (pointsToAdd > 0) {
        alert(`🎉 Gran millora! Has encertat ${score} de ${total} preguntes.\n\nS'han afegit +${pointsToAdd} PTS nous al teu total! (Total en aquesta lectura: ${newQuizPoints}/${maxPossiblePoints} pts)`);
      } else if (newQuizPoints === maxPossiblePoints) {
        alert(`⭐ Molt bé! Has tornat a encertar totes les preguntes (${score}/${total}), però ja tenies la puntuació màxima d'aquesta lectura.`);
      } else {
        alert(`👍 Has encertat ${score} de ${total} preguntes (${newQuizPoints} pts).\n\nCom que la teva millor marca anterior era de ${previousQuizPoints} pts, el teu total no ha canviat.`);
      }

      renderCatalog();
    }

        if (labelSource) labelSource.innerText = "Editorial / Any d'Edició";

        if (contentInput) contentInput.setAttribute('required', 'true');

    }

    async function saveReading(e) {
      e.preventDefault();
      const type = document.getElementById('editor-type')?.value || 'text';
      const title = document.getElementById('editor-title').value;
      const bookAuthor = document.getElementById('editor-book-author')?.value || '';
      const editorialOrSource = document.getElementById('editor-source')?.value || '';
      const level = document.getElementById('editor-level').value;
      const category = document.getElementById('editor-category')?.value || 'General';
      const pointsPerQuestion = parseInt(document.getElementById('editor-points-per-q')?.value || 1);
      const content = document.getElementById('editor-content')?.value || '';
      const imageUrl = document.getElementById('editor-image')?.value || '';

      const authorDisplayName = userDisplayName || (currentUser ? currentUser.email.split('@')[0] : "Creador/a");
      const authorSchool = userSchool || "";
      const authorEmail = currentUser ? currentUser.email : "";

      try {
        let docId = editingDocId;

        if (editingDocId) {
          await db.collection(DB_COLLECTION).doc(editingDocId).update({
            type: type,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            pointsPerQuestion: pointsPerQuestion,
            content: content,
            imageUrl: imageUrl,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          const oldQ = await db.collection(DB_COLLECTION).doc(editingDocId).collection(SUB_COLLECTION).get();
          for (const qDoc of oldQ.docs) {
            await qDoc.ref.delete();
          }
        } else {
          if (currentUser && (userRole === 'docent' || userRole === 'colaborador')) {
            userPoints += 1;
            await db.collection("users").doc(currentUser.uid).set({ points: userPoints }, { merge: true });
          }

          const docRef = await db.collection(DB_COLLECTION).add({
            type: type,
            title: title,
            bookAuthor: bookAuthor,
            editorialOrSource: editorialOrSource,
            level: level,
            category: category,
            pointsPerQuestion: pointsPerQuestion,
            content: content,
            imageUrl: imageUrl,
            authorUid: currentUser ? currentUser.uid : null,
            authorDisplayName: authorDisplayName,
            authorSchool: authorSchool,
            authorEmail: authorEmail,
            authorPoints: userPoints,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          docId = docRef.id;
        }

        const qBlocks = document.querySelectorAll('.q-block');
        for (const block of qBlocks) {
          const qText = block.querySelector('.q-text').value;
          const opt0 = block.querySelector('.q-opt-0').value;
          const opt1 = block.querySelector('.q-opt-1').value;
          const opt2 = block.querySelector('.q-opt-2')?.value || '';
          const opt3 = block.querySelector('.q-opt-3')?.value || '';
          
          const correctSelect = block.querySelector('.q-correct');
          const correctIdx = correctSelect ? parseInt(correctSelect.value) : 0;

          const options = [opt0, opt1];
          if (opt2) options.push(opt2);
          if (opt3) options.push(opt3);

          if (qText && options.length >= 2) {
            await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add({
              questionText: qText,
              options: options,
              correctAnswer: correctIdx
            });
          }
        }

        editingDocId = null;
        await loadUserData();
        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error en desar la lectura: " + err.message);
      }
    }

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Contrasenya</label>

            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">Inicia Sessió</button>
          </form>

          <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <!-- BANNER D'ACOLLIDA I MANIFEST COL·LABORATIU (v0.17.0) -->
            <div class="bg-indigo-50/80 border border-indigo-100 p-4 rounded-xl space-y-2 text-left">
              <h3 class="font-extrabold text-indigo-900 text-sm flex items-center gap-1.5">

              </p>
              <p class="text-xs text-slate-600 leading-relaxed">
                Aquesta plataforma es construeix gràcies a la suma de les aportacions que fem tant docents com col·laboradors. Totes les lectures es comparteixen i els alumnes s'agrupen per docents i centres educatius per sumar punts i fer créixer la comunitat lectora.
              </p>
              <ul class="text-[11px] text-slate-700 space-y-1 pt-1 font-medium">
                <li class="flex items-start gap-1"><span class="shrink-0">🎓</span> <span><strong>Alumnes:</strong> Teniu lectures curtes integrades i comprensions lectores de llibres físics. Supereu qüestionaris i feu créixer el vostre rang lector tot aconseguint punts a cada aventura.</span></li>
                <li class="flex items-start gap-1"><span class="shrink-0">👨‍🏫</span> <span><strong>Docents:</strong> Acompanyeu el vostre alumnat, creeu i adapteu propostes lectores a la mida del vostre grup i feu un seguiment clar i motivador del seu progrés.</span></li>
                <li class="flex items-start gap-1"><span class="shrink-0">🤝</span> <span><strong>Col·laboradors/es:</strong> Comunitat lectora i creadora que comparteix lectures, adaptacions i preguntes per enriquir la biblioteca lliure a disposició de totes les escoles.</span></li>
              </ul>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Soc...</label>
              <select id="reg-role" class="w-full p-2.5 border border-indigo-300 bg-indigo-50/50 rounded-xl text-sm font-bold text-indigo-900 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="alumne">🎓 Alumne / Alumna</option>
                <option value="docent">👨‍🏫 Docent (Amb grup d'alumnes)</option>
                <option value="colaborador">🤝 Col·laborador/a (Lector/a creador/a)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Correu electrònic</label>
              <input type="email" id="reg-email" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Contrasenya</label>
              <input type="password" id="reg-password" required minlength="6" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm transition">Crear Compte</button>
          </form>
        </div>
      `;
    }

    function switchAuthTab(tab) {
      const fLogin = document.getElementById('form-login');
      const fReg = document.getElementById('form-register');
      const tLogin = document.getElementById('tab-login');
      const tReg = document.getElementById('tab-register');

      if (tab === 'register') {
        fLogin.classList.add('hidden');
        fReg.classList.remove('hidden');
        tReg.className = "w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm";
        tLogin.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent text-sm hover:text-slate-600";
      } else {
        fReg.classList.add('hidden');
        fLogin.classList.remove('hidden');
        tLogin.className = "w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm";
        tReg.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent text-sm hover:text-slate-600";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        alert("Error d'accés: " + err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const role = document.getElementById('reg-role').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection("users").doc(cred.user.uid).set({
          email: email,
          role: role,
          points: 0,
          completedReadings: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        alert("Compte creat amb èxit!");
      } catch (err) {
        alert("Error en registrar l'usuari: " + err.message);
      }
    }
