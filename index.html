<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Aventura - v010.2</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase JS SDK v9 (Compat version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- NAVEGACIÓ SUPERIOR -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="resetFiltersAndRenderCatalog()">
        <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
        <span class="font-bold text-xl tracking-wide">Lectura Aventura</span>
      </div>
      <nav id="nav-actions" class="flex items-center space-x-3">
        <!-- Renderitzat dinàmic -->
      </nav>
    </div>
  </header>

  <!-- BARRA MOTIVADORA PERMANENT PER A ALUMNES -->
  <div id="motivation-banner"></div>

  <!-- CONTENIDOR PRINCIPAL -->
  <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6">
    <!-- Vistes dinàmiques -->
  </main>

  <footer class="bg-slate-800 text-slate-400 text-center py-4 text-sm mt-auto">
    <p>&copy; Lectura Aventura — Plataforma Educativa de Comprensió Lectora</p>
  </footer>

  <script>
    // --- CONFIGURACIÓ DE FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcBpg9FRwYDElWoZlYsGir4ZA_HqS0BDc",
      authDomain: "lectura-aventura.firebaseapp.com",
      projectId: "lectura-aventura",
      storageBucket: "lectura-aventura.firebasestorage.app",
      messagingSenderId: "525339295825",
      appId: "1:525339295825:web:3a5b3ea8791f6146d4b870",
      measurementId: "G-7132LXLDTR"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DB_COLLECTION = "lectures";
    const SUB_COLLECTION = "questions";
    const ADMIN_SUPREMO_EMAIL = "scasas26@xtec.cat";

    let currentUser = null;
    let userPoints = 0;
    let userRole = 'alumne';
    let userCompletedReadings = [];
    let userDisplayName = "";
    let userSchool = "";
    let filterMyLectures = false;
    let editingDocId = null;

    // --- VARIABLES GLOBALS DE FILTRATGE ---
    let filterSearch = "";
    let filterType = "all";
    let filterLevel = "all";
    let filterCategory = "all";
    let filterStatus = "all";

    // --- MANEGADOR D'AUTENTICACIÓ I NAVEGACIÓ ---
    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (user) {
        await loadUserData();
      } else {
        userPoints = 0;
        userRole = 'alumne';
        userCompletedReadings = [];
        userDisplayName = "";
        userSchool = "";
        filterMyLectures = false;
      }
      renderNav();
      
      if (currentUser && userRole === 'mestre' && (!userDisplayName || !userSchool)) {
        renderTeacherProfileModal();
      } else {
        renderCatalog();
      }
    });

    async function loadUserData() {
      if (!currentUser) return;
      try {
        const doc = await db.collection("users").doc(currentUser.uid).get();
        if (doc.exists) {
          const data = doc.data();
          userPoints = data.points !== undefined ? data.points : 0;
          userRole = data.role || 'alumne';
          userCompletedReadings = data.completedReadings || [];
          userDisplayName = data.displayName || "";
          userSchool = data.school || "";
        } else {
          userPoints = 0;
          userRole = 'alumne';
          userCompletedReadings = [];
          userDisplayName = "";
          userSchool = "";
        }
      } catch (err) {
        console.warn("Error carregant dades de l'usuari:", err);
      }
    }

    // --- RANGS D'ALUMNE ---
    function getRankDetails(points) {
      if (points >= 1300) {
        return { name: "Mestre/a de la Lectura", icon: "fa-crown", color: "from-amber-400 to-amber-600", text: "text-amber-300" };
      } else if (points >= 700) {
        return { name: "Lector/a d'Or", icon: "fa-trophy", color: "from-amber-300 to-amber-500", text: "text-amber-200" };
      } else if (points >= 300) {
        return { name: "Lector/a d'Argent", icon: "fa-medal", color: "from-slate-400 to-slate-600", text: "text-slate-200" };
      } else if (points >= 100) {
        return { name: "Lector/a de Bronze", icon: "fa-award", color: "from-amber-700 to-amber-900", text: "text-amber-400" };
      }
      return { name: "Explorador/a d'Històries", icon: "fa-compass", color: "from-indigo-500 to-indigo-700", text: "text-indigo-200" };
    }

    // --- RANGS DE MESTRE (CORREGIT v010.2: SENSE DEPENDRER DE currentUser) ---
    function getTeacherRankDetails(points, email = "") {
      if (email === ADMIN_SUPREMO_EMAIL) {
        return { name: "⚡ Admin Supremo", subtext: "Controlador/a del Codi", icon: "fa-shield-halved", badgeBg: "bg-purple-100 text-purple-900 border-purple-300", color: "from-purple-600 to-pink-600" };
      }
      if (points >= 20) {
        return { name: "👑 Mestre Déu Celestial", subtext: "Creador/a d'Universos Lectors", icon: "fa-wand-magic-sparkles", badgeBg: "bg-amber-100 text-amber-900 border-amber-300", color: "from-amber-400 to-amber-600" };
      } else if (points >= 15) {
        return { name: "📚 Mestre de Mestres", subtext: "Supervivent de claustres", icon: "fa-graduation-cap", badgeBg: "bg-indigo-100 text-indigo-900 border-indigo-300", color: "from-blue-600 to-indigo-800" };
      } else if (points >= 10) {
        return { name: "🌟 Savi/a de la Sala", subtext: "Llegenda entre cafès", icon: "fa-mug-hot", badgeBg: "bg-amber-50 text-amber-800 border-amber-200", color: "from-amber-600 to-amber-800" };
      } else if (points >= 6) {
        return { name: "⚡ Arquitecte/a Pedagògic/a", subtext: "Dominador/a del currículum", icon: "fa-cubes", badgeBg: "bg-indigo-50 text-indigo-800 border-indigo-200", color: "from-indigo-500 to-indigo-700" };
      } else if (points >= 3) {
        return { name: "📝 Mestre Col·laborador/a", subtext: "Exportador/a de fotocòpies", icon: "fa-copy", badgeBg: "bg-teal-50 text-teal-800 border-teal-200", color: "from-teal-500 to-emerald-700" };
      } else if (points >= 1) {
        return { name: "👨‍🏫 Mestre Novell", subtext: "Ajustant el projector", icon: "fa-chalkboard-user", badgeBg: "bg-slate-100 text-slate-800 border-slate-300", color: "from-slate-500 to-slate-700" };
      }
      return { name: "🎒 Mestre Nouvingut/da", subtext: "Cercant el wifi de l'escola", icon: "fa-compass-drafting", badgeBg: "bg-slate-50 text-slate-600 border-slate-200", color: "from-slate-400 to-indigo-500" };
    }

    // --- BANNER MOTIVADOR PERMANENT ---
    function renderBanner() {
      const bannerContainer = document.getElementById('motivation-banner');
      if (!bannerContainer) return;

      if (currentUser && userRole !== 'mestre') {
        const rank = getRankDetails(userPoints);
        const displayName = userDisplayName || currentUser.email.split('@')[0];
        
        let nextRankPoints = 100;
        let nextRankName = "Lector/a de Bronze";
        if (userPoints >= 100 && userPoints < 300) {
          nextRankPoints = 300;
          nextRankName = "Lector/a d'Argent";
        } else if (userPoints >= 300 && userPoints < 700) {
          nextRankPoints = 700;
          nextRankName = "Lector/a d'Or";
        } else if (userPoints >= 700 && userPoints < 1300) {
          nextRankPoints = 1300;
          nextRankName = "Mestre/a de la Lectura";
        } else if (userPoints >= 1300) {
          nextRankPoints = userPoints;
        }

        const pointsNeeded = nextRankPoints - userPoints;

        bannerContainer.innerHTML = `
          <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-indigo-900 text-white border-b border-indigo-700/50 shadow-inner py-3 px-4">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3 text-center md:text-left">
              
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr ${rank.color} text-white flex items-center justify-center text-lg shadow-md border border-white/20">
                  <i class="fa-solid ${rank.icon}"></i>
                </div>
                <div>
                  <h2 class="text-sm md:text-base font-extrabold text-white tracking-wide">
                    Hola, <span class="text-amber-300">${displayName}</span>!
                  </h2>
                  <p class="text-xs text-indigo-200">
                    Rang actual: <span class="font-bold text-amber-300">${rank.name}</span>
                  </p>
                </div>
              </div>

              <div class="flex items-center space-x-4 bg-indigo-950/60 px-4 py-1.5 rounded-xl border border-indigo-500/30">
                <div class="text-right">
                  <span class="block text-xs font-semibold text-indigo-200">Total acumulat</span>
                  <span class="text-base font-black text-amber-400">${userPoints} PTS</span>
                </div>
                <div class="h-7 w-px bg-indigo-700/60"></div>
                <div class="text-left">
                  <span class="block text-xs font-semibold text-indigo-200">Següent objectiu</span>
                  <span class="text-xs font-bold text-slate-200">
                    ${userPoints >= 1300 ? '🌟 Nivell Màxim Assolit!' : `+${pointsNeeded} pts per ${nextRankName}`}
                  </span>
                </div>
              </div>

            </div>
          </div>
        `;
      } else {
        bannerContainer.innerHTML = '';
      }
    }

    function renderNav() {
      const nav = document.getElementById('nav-actions');
      if (currentUser) {
        const isTeacher = userRole === 'mestre';
        const rank = isTeacher ? getTeacherRankDetails(userPoints, currentUser.email) : getRankDetails(userPoints);
        const nameToShow = userDisplayName || currentUser.email.split('@')[0];

        nav.innerHTML = `
          <button onclick="toggleMyLectures()" class="${filterMyLectures ? 'bg-amber-300 text-slate-900 font-bold' : 'bg-indigo-700 hover:bg-indigo-800 text-white font-semibold'} px-3 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid ${filterMyLectures ? 'fa-filter-circle-xmark' : 'fa-bookmark'}"></i>
            <span class="hidden sm:inline">${filterMyLectures ? 'Totes les lectures' : 'Les meves lectures'}</span>
          </button>

          ${isTeacher ? `
            <button onclick="renderTeacherProfileModal()" title="Editar el meu perfil docent" class="bg-indigo-700 hover:bg-indigo-800 text-indigo-200 hover:text-white p-2 rounded-xl text-xs transition">
              <i class="fa-solid fa-id-card text-sm"></i>
            </button>
            <button onclick="renderEditor()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3.5 py-1.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5 shadow-md transform hover:scale-105">
              <i class="fa-solid fa-plus text-base"></i>
              <span>Nova Lectura</span>
            </button>
          ` : ''}

          <div class="flex items-center bg-indigo-800/80 backdrop-blur-sm px-3 py-1.5 rounded-xl border border-indigo-500/30 space-x-3 shadow-inner">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr ${rank.color} text-white flex items-center justify-center text-sm shadow">
              <i class="fa-solid ${rank.icon}"></i>
            </div>
            
            <div class="flex flex-col text-left">
              <div class="flex items-center space-x-1.5">
                <span class="text-xs font-bold text-white tracking-wide">${nameToShow}</span>
                <span class="bg-amber-400/20 text-amber-300 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md border border-amber-400/30">${userPoints} pts</span>
              </div>
              <span class="text-[11px] text-amber-300 font-bold leading-none mt-0.5">
                ${rank.name}
              </span>
            </div>

            <button onclick="logout()" title="Tancar Sessió" class="text-indigo-300 hover:text-white hover:bg-indigo-700/50 p-1.5 rounded-lg transition ml-1">
              <i class="fa-solid fa-right-from-bracket text-sm"></i>
            </button>
          </div>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="renderLogin()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow">
            Inicia Sessió
          </button>
        `;
      }
      renderBanner();
    }

    function toggleMyLectures() {
      filterMyLectures = !filterMyLectures;
      renderNav();
      renderCatalog();
    }

    function logout() {
      auth.signOut().then(() => renderCatalog());
    }

    function resetFiltersAndRenderCatalog() {
      filterSearch = "";
      filterType = "all";
      filterLevel = "all";
      filterCategory = "all";
      filterStatus = "all";
      filterMyLectures = false;
      renderNav();
      renderCatalog();
    }

    function applyCatalogFilters() {
      filterSearch = document.getElementById('search-input')?.value.toLowerCase() || '';
      filterType = document.getElementById('type-select')?.value || 'all';
      filterLevel = document.getElementById('level-select')?.value || 'all';
      filterCategory = document.getElementById('category-select')?.value || 'all';
      filterStatus = document.getElementById('status-select')?.value || 'all';

      renderCatalog();
    }

    // --- FORMULARI / MINI-FITXA DOCENT ---
    function renderTeacherProfileModal() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="max-w-md mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
          <div class="text-center mb-6">
            <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
              <i class="fa-solid fa-chalkboard-user"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800">Fitxa de Presentació Docent</h2>
            <p class="text-xs text-slate-500 mt-1">Introdueix les teves dades públiques per signar les lectures sense mostrar el teu correu.</p>
          </div>

          <form onsubmit="saveTeacherProfile(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nom Públic / Àlies *</label>
              <input type="text" id="profile-name" value="${userDisplayName}" placeholder="Ex: Mestre Sergi, Mestra Maria" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Centre Educatiu / Població / Comarca *</label>
              <input type="text" id="profile-school" value="${userSchool}" placeholder="Ex: Escola La Renaixença, Osona" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm shadow transition mt-2">
              Desar Fitxa i Continuar
            </button>
          </form>
        </div>
      `;
    }

    async function saveTeacherProfile(e) {
      e.preventDefault();
      const name = document.getElementById('profile-name').value;
      const school = document.getElementById('profile-school').value;

      try {
        await db.collection("users").doc(currentUser.uid).set({
          displayName: name,
          school: school
        }, { merge: true });

        userDisplayName = name;
        userSchool = school;

        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error en desar la fitxa: " + err.message);
      }
    }

    // --- VISTA 1: CATÀLEG DE LECTURES ---
    async function renderCatalog() {
      const app = document.getElementById('app');
      app.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i><p class="mt-2 text-slate-500 font-medium">Carregant el catàleg...</p></div>`;

      try {
        const snapshot = await db.collection(DB_COLLECTION).orderBy('createdAt', 'desc').get();
        
        let html = `
          <div class="max-w-6xl mx-auto space-y-6">
            
            ${filterMyLectures ? `
              <div class="bg-amber-50 border border-amber-200 text-amber-900 px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold flex items-center justify-between shadow-sm">
                <span class="flex items-center gap-2">
                  <i class="fa-solid fa-filter text-amber-600"></i>
                  ${userRole === 'mestre' ? 'Mostrant només les lectures que has creat tu.' : 'Mostrant només les lectures que ja has completat.'}
                </span>
                <button onclick="toggleMyLectures()" class="text-amber-700 hover:text-amber-900 underline text-xs">Mostrar-ho tot</button>
              </div>
            ` : ''}

            <!-- BARRA DE FILTRATGE EN 2 FILES -->
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="relative sm:col-span-2">
                  <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                  <input type="text" id="search-input" value="${filterSearch}" placeholder="Cercar per títol..." oninput="applyCatalogFilters()" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                
                <div>
                  <select id="type-select" onchange="applyCatalogFilters()" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="all" ${filterType === 'all' ? 'selected' : ''}>📑 Tots els tipus</option>
                    <option value="text" ${filterType === 'text' ? 'selected' : ''}>📄 Text integrat (Lectura curta)</option>
                    <option value="book" ${filterType === 'book' ? 'selected' : ''}>📖 Llibre de lectura</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-100">
                <div>
                  <select id="level-select" onchange="applyCatalogFilters()" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="all" ${filterLevel === 'all' ? 'selected' : ''}>🎓 Tots els nivells</option>
                    <option value="Cicle Inicial" ${filterLevel === 'Cicle Inicial' ? 'selected' : ''}>Cicle Inicial</option>
                    <option value="Cicle Mitjà" ${filterLevel === 'Cicle Mitjà' ? 'selected' : ''}>Cicle Mitjà</option>
                    <option value="Cicle Superior" ${filterLevel === 'Cicle Superior' ? 'selected' : ''}>Cicle Superior</option>
                  </select>
                </div>

                <div>
                  <select id="category-select" onchange="applyCatalogFilters()" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="all" ${filterCategory === 'all' ? 'selected' : ''}>📚 Totes les categories</option>
                    <option value="Aventura" ${filterCategory === 'Aventura' ? 'selected' : ''}>🧭 Aventura</option>
                    <option value="Misteri" ${filterCategory === 'Misteri' ? 'selected' : ''}>🔍 Misteri</option>
                    <option value="Ciència-ficció" ${filterCategory === 'Ciència-ficció' ? 'selected' : ''}>🚀 Ciència-ficció</option>
                    <option value="Teatre" ${filterCategory === 'Teatre' ? 'selected' : ''}>🎭 Teatre</option>
                    <option value="Poesia" ${filterCategory === 'Poesia' ? 'selected' : ''}>📜 Poesia</option>
                    <option value="Tradició / Llegenda" ${filterCategory === 'Tradició / Llegenda' ? 'selected' : ''}>🏛️ Tradició / Llegenda</option>
                    <option value="General" ${filterCategory === 'General' ? 'selected' : ''}>📖 General</option>
                  </select>
                </div>

                <div>
                  <select id="status-select" onchange="applyCatalogFilters()" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-indigo-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="all" ${filterStatus === 'all' ? 'selected' : ''}>📌 Totes les lectures</option>
                    <option value="pending" ${filterStatus === 'pending' ? 'selected' : ''}>⏳ Pendents de fer</option>
                    <option value="completed" ${filterStatus === 'completed' ? 'selected' : ''}>✅ Ja fetes</option>
                  </select>
                </div>
              </div>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        `;

        let cardCount = 0;

        if (!snapshot.empty) {
          snapshot.forEach(doc => {
            const data = doc.data();
            const docId = doc.id;
            const isBook = data.type === 'book';
            const isCompleted = userCompletedReadings.includes(docId);

            const isAdmin = currentUser && currentUser.email === ADMIN_SUPREMO_EMAIL;
            const isAuthor = currentUser && data.authorUid === currentUser.uid;
            const canEdit = isAdmin || isAuthor;

            const authorText = data.authorDisplayName 
              ? `${data.authorDisplayName}${data.authorSchool ? ' (' + data.authorSchool + ')' : ''}`
              : 'Docent de Lectura Aventura';

            // CÀLCUL I RECONEIXEMENT DEL RANG DE L'AUTOR/A (v010.2: TOTALMENT DESVINCULAT DE currentUser)
            const authorPoints = data.authorPoints !== undefined ? data.authorPoints : 0;
            const authorEmail = data.authorEmail || "";
            const authorRank = getTeacherRankDetails(authorPoints, authorEmail);

            if (filterMyLectures && currentUser) {
              if (userRole === 'mestre') {
                if (data.authorUid !== currentUser.uid) return;
              } else {
                if (!isCompleted) return;
              }
            }

            const matchesSearch = (data.title || '').toLowerCase().includes(filterSearch);
            const matchesType = filterType === 'all' || (isBook ? 'book' : 'text') === filterType;
            const matchesLevel = filterLevel === 'all' || data.level === filterLevel;
            const matchesCategory = filterCategory === 'all' || (data.category || 'General') === filterCategory;
            
            let matchesStatus = true;
            if (filterStatus === 'completed') matchesStatus = isCompleted;
            if (filterStatus === 'pending') matchesStatus = !isCompleted;
            
            if (!matchesSearch || !matchesType || !matchesLevel || !matchesCategory || !matchesStatus) return;

            cardCount++;

            html += `
              <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between">
                <div class="p-5">
                  <div class="flex items-center justify-between mb-3 gap-2">

    // --- SUBMIT QUIZ ---
    async function submitQuiz(e, docId) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);

      const questionsSnap = await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).get();
      let score = 0;
      let total = questionsSnap.size;

      questionsSnap.forEach(qDoc => {
        const q = qDoc.data();
        const selected = parseInt(formData.get(`q_${qDoc.id}`));
        const correct = q.correctAnswer !== undefined ? q.correctAnswer : 0;
        if (selected === correct) {
          score++;
        }
      });

      const newQuizPoints = score * 10;
      const maxPossiblePoints = total * 10;

      let userScores = {};
      if (currentUser) {
        try {
          const userDoc = await db.collection("users").doc(currentUser.uid).get();
          if (userDoc.exists) {
            userScores = userDoc.data().scores || {};
          }
        } catch (err) {
          console.warn("Error llegint puntuacions anteriors:", err);
        }
      }

      const previousQuizPoints = userScores[docId] || 0;
      let pointsToAdd = 0;

      if (newQuizPoints > previousQuizPoints) {
        pointsToAdd = newQuizPoints - previousQuizPoints;
        userScores[docId] = newQuizPoints;
        userPoints += pointsToAdd;
      }

      if (!userCompletedReadings.includes(docId)) {
        userCompletedReadings.push(docId);
      }

      if (currentUser) {
        try {
          await db.collection("users").doc(currentUser.uid).set({
            points: userPoints,
            completedReadings: userCompletedReadings,
            scores: userScores
          }, { merge: true });
        } catch (err) {
          console.warn("S'han desat les dades localment:", err);
        }
      }

      await loadUserData();
      renderNav();

      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;

      if (pointsToAdd > 0) {
        alert(`🎉 Gran millora! Has encertat ${score} de ${total} preguntes.\n\nS'han afegit +${pointsToAdd} PTS nous al teu total! (Total en aquesta lectura: ${newQuizPoints}/${maxPossiblePoints} pts)`);
      } else if (newQuizPoints === maxPossiblePoints) {
        alert(`⭐ Molt bé! Has tornat a encertar totes les preguntes (${score}/${total}), però ja tenies la puntuació màxima d'aquesta lectura.`);
      } else {
        alert(`👍 Has encertat ${score} de ${total} preguntes (${newQuizPoints} pts).\n\nCom que la teva millor marca anterior era de ${previousQuizPoints} pts, el teu total no ha canviat. Segueix intentant-ho per superar-te!`);
      }

      renderCatalog();
    }

    function toggleReadingTypeInputs() {
      const type = document.getElementById('editor-type').value;

      } else {
        wrapContent.classList.remove('hidden');
        if (contentInput) contentInput.setAttribute('required', 'true');
        wrapImage.classList.add('hidden');
      }
    }

    // --- GUARDAR O ACTUALITZAR LECTURA PRESERVANT L'AUTORIA ORIGINAL (v010.2) ---
    async function saveReading(e) {
      e.preventDefault();
      const type = document.getElementById('editor-type')?.value || 'text';
      const title = document.getElementById('editor-title').value;
      const level = document.getElementById('editor-level').value;
      const category = document.getElementById('editor-category')?.value || 'General';

      const authorSchool = userSchool || "";
      const authorEmail = currentUser ? currentUser.email : "";

      try {
        let docId = editingDocId;

        if (editingDocId) {
          await db.collection(DB_COLLECTION).doc(editingDocId).update({
            type: type,
            title: title,
            level: level,
            category: category,
            content: content,
            imageUrl: imageUrl,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          const oldQ = await db.collection(DB_COLLECTION).doc(editingDocId).collection(SUB_COLLECTION).get();
          for (const qDoc of oldQ.docs) {
            await qDoc.ref.delete();
          }
        } else {
          if (currentUser && userRole === 'mestre') {
            userPoints += 1;
            await db.collection("users").doc(currentUser.uid).set({
              points: userPoints
            }, { merge: true });
          }

          const docRef = await db.collection(DB_COLLECTION).add({
            type: type,
            title: title,
            level: level,
            category: category,
            content: content,
            imageUrl: imageUrl,
            authorUid: currentUser ? currentUser.uid : null,
            authorDisplayName: authorDisplayName,
            authorSchool: authorSchool,
            authorEmail: authorEmail,
            authorPoints: userPoints,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          docId = docRef.id;
        }

        const qBlocks = document.querySelectorAll('.q-block');
        for (const block of qBlocks) {
          const qText = block.querySelector('.q-text').value;
          const opt0 = block.querySelector('.q-opt-0').value;
          const opt1 = block.querySelector('.q-opt-1').value;
          const opt2 = block.querySelector('.q-opt-2')?.value || '';
          const opt3 = block.querySelector('.q-opt-3')?.value || '';
          
          const correctSelect = block.querySelector('.q-correct');
          const correctIdx = correctSelect ? parseInt(correctSelect.value) : 0;

          const options = [opt0, opt1];
          if (opt2) options.push(opt2);
          if (opt3) options.push(opt3);

          if (qText && options.length >= 2) {
            await db.collection(DB_COLLECTION).doc(docId).collection(SUB_COLLECTION).add({
              questionText: qText,
              options: options,
              correctAnswer: correctIdx
            });
          }
        }

        editingDocId = null;
        await loadUserData();
        renderNav();
        renderCatalog();
      } catch (err) {
        alert("Error en desar la lectura: " + err.message);
      }
    }

    // --- VISTA 4: LOGIN / REGISTRE ---
    function renderLogin() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="max-w-md mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
          <div class="flex border-b border-slate-200 mb-6">
            <button id="tab-login" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm">
              Inicia Sessió
            </button>
            <button id="tab-register" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent text-sm hover:text-slate-600">
              Crear Compte
            </button>
          </div>

          <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Correu electrònic</label>
              <input type="email" id="login-email" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Contrasenya</label>
              <input type="password" id="login-password" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">Inicia Sessió</button>
          </form>

          <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Soc...</label>
              <select id="reg-role" class="w-full p-2.5 border border-indigo-300 bg-indigo-50/50 rounded-xl text-sm font-bold text-indigo-900 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="alumne">🎓 Alumne / Alumna</option>
                <option value="mestre">👨‍🏫 Mestre / Mestra (Creador/a)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Correu electrònic</label>
              <input type="email" id="reg-email" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Contrasenya</label>
              <input type="password" id="reg-password" required minlength="6" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm transition">Crear Compte</button>
          </form>
        </div>
      `;
    }

    function switchAuthTab(tab) {
      const fLogin = document.getElementById('form-login');
      const fReg = document.getElementById('form-register');
      const tLogin = document.getElementById('tab-login');
      const tReg = document.getElementById('tab-register');

      if (tab === 'register') {
        fLogin.classList.add('hidden');
        fReg.classList.remove('hidden');
        tReg.className = "w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm";
        tLogin.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent text-sm hover:text-slate-600";
      } else {
        fReg.classList.add('hidden');
        fLogin.classList.remove('hidden');
        tLogin.className = "w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 text-sm";
        tReg.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent text-sm hover:text-slate-600";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        alert("Error d'accés: " + err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const role = document.getElementById('reg-role').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection("users").doc(cred.user.uid).set({
          email: email,
          role: role,
          points: 0,
          completedReadings: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        alert("Compte creat amb èxit!");
      } catch (err) {
        alert("Error en registrar l'usuari: " + err.message);
      }
    }
  </script>
