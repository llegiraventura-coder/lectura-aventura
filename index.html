<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Aventura</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase JS SDK v9 (Compat version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- NAVEGACIÓ SUPERIOR -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="renderCatalog()">
        <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
        <span class="font-bold text-xl tracking-wide">Lectura Aventura</span>
      </div>
      <nav id="nav-actions" class="flex items-center space-x-3">
        <!-- Renderitzat dinàmic -->
      </nav>
    </div>
  </header>

  <!-- CONTENIDOR PRINCIPAL -->
  <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6">
    <!-- Vistes dinàmiques -->
  </main>

  <footer class="bg-slate-800 text-slate-400 text-center py-4 text-sm mt-auto">
    <p>&copy; Lectura Aventura — Plataforma Educativa de Comprensió Lectora</p>
  </footer>

  <script>
    // --- CONFIGURACIÓ DE FIREBASE REALS ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcBpg9FRwYDElWoZlYsGir4ZA_HqS0BDc",
      authDomain: "lectura-aventura.firebaseapp.com",
      projectId: "lectura-aventura",
      storageBucket: "lectura-aventura.firebasestorage.app",
      messagingSenderId: "525339295825",
      appId: "1:525339295825:web:3a5b3ea8791f6146d4b870",
      measurementId: "G-7132LXLDTR"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DB_COLLECTION = "lectures";
    const SUB_COLLECTION = "questions";
    let currentUser = null;
    let userPoints = 0;
    let filterMyLectures = false;

    // --- MANEGADOR D'AUTENTICACIÓ I NAVEGACIÓ ---
    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (user) {
        await loadUserPoints();
      } else {
        userPoints = 0;
        filterMyLectures = false;
      }
      renderNav();
      renderCatalog();
    });

    async function loadUserPoints() {
      if (!currentUser) return;
      try {
        const doc = await db.collection("users").doc(currentUser.uid).get();
        if (doc.exists && doc.data().points !== undefined) {
          userPoints = doc.data().points;
        } else {
          userPoints = 0;
        }
      } catch (err) {
        console.warn("No s'han pogut carregar els punts de Firestore:", err);
      }
    }

    function getRankDetails(points) {
      if (points >= 100) {
        return { name: "Mestre/a de la Lectura", icon: "fa-crown", color: "from-amber-400 to-amber-600", text: "text-amber-300" };
      } else if (points >= 50) {
        return { name: "Lector/a d'Argent", icon: "fa-medal", color: "from-slate-400 to-slate-600", text: "text-slate-200" };
      }
      return { name: "Explorador/a de Històries", icon: "fa-compass", color: "from-indigo-500 to-indigo-700", text: "text-indigo-200" };
    }

    function renderNav() {
      const nav = document.getElementById('nav-actions');
      if (currentUser) {
        const rank = getRankDetails(userPoints);
        nav.innerHTML = `
          <button onclick="toggleMyLectures()" class="${filterMyLectures ? 'bg-amber-300 text-slate-900' : 'bg-indigo-700 hover:bg-indigo-800 text-white'} font-semibold px-3 py-1.5 rounded-lg text-xs md:text-sm transition flex items-center gap-1">
            <i class="fa-solid fa-bookmark"></i>
            <span>${filterMyLectures ? 'Totes les lectures' : 'Les meves lectures'}</span>
          </button>

          <button onclick="renderEditor()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-semibold px-3 py-1.5 rounded-lg text-xs md:text-sm transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i>
            <span>Nova Lectura</span>
          </button>

          <div class="flex items-center space-x-2 pl-2 border-l border-indigo-400">
            <div class="hidden sm:flex flex-col text-right">
              <span class="text-xs font-bold text-white">${currentUser.email.split('@')[0]}</span>
              <span class="text-[10px] text-amber-300 font-semibold">${rank.name}</span>
            </div>
            <button onclick="logout()" title="Tancar Sessió" class="text-indigo-200 hover:text-white p-1">
              <i class="fa-solid fa-right-from-bracket text-lg"></i>
            </button>
          </div>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="renderLogin()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-4 py-1.5 rounded-lg text-sm transition">
            Inicia Sessió
          </button>
        `;
      }
    }

    function toggleMyLectures() {
      filterMyLectures = !filterMyLectures;
      renderNav();
      renderCatalog();
    }

    function logout() {
      auth.signOut().then(() => renderCatalog());
    }

    // --- VISTA 1: CATÀLEG DE LECTURES + BANNER DE PERFIL ---
    async function renderCatalog() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="text-center py-8">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600"></i>
          <p class="mt-2 text-slate-500">Carregant lectures de la base de dades...</p>
        </div>
      `;

      try {
        let query = db.collection(DB_COLLECTION);
        if (filterMyLectures && currentUser) {
          query = query.where("authorUid", "==", currentUser.uid);
        }

        const snapshot = await query.get();
        const rank = getRankDetails(userPoints);

        let userHeaderHTML = '';
        if (currentUser) {
          userHeaderHTML = `
            <div class="mb-8 p-6 bg-gradient-to-r ${rank.color} rounded-2xl shadow-lg text-white flex flex-col md:flex-row justify-between items-center gap-4">
              <div class="flex items-center space-x-4">
                <div class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-3xl shadow-inner">
                  <i class="fa-solid ${rank.icon}${rank.text}"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <h2 class="text-2xl font-black tracking-wide">${rank.name}</h2>
                    <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full uppercase tracking-wider font-bold
